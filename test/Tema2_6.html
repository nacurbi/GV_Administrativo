<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 10px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn, #finalizar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover, #finalizar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .resultados-finales-container {
            text-align: center;
        }
        .resultados-finales-texto {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .resultados-finales-correctas {
            color: #155724;
            font-weight: bold;
        }
        .resultados-finales-incorrectas {
            color: #721c24;
            font-weight: bold;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test" style="text-align: justify;"><strong>TEMA 2. ESTATUTO DE AUTONOMÍA:</strong> Estatuto de Autonomía del País Vasco</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
            <div id="resultados-finales" class="hidden resultados-finales-container">
                <h2>Resultados Finales</h2>
                <div id="resultados-texto" class="resultados-finales-texto"></div>
            </div>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
            <button id="finalizar-btn" class="comprobar-btn" style="width: 100%; margin-top: 20px;">Finalizar Test</button>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. Los miembros del Parlamento Vasco serán inviolables por los votos y opiniones que emitan en el ejercicio de su cargo. Seleccione la respuesta correcta:",
    "options": [
      "a) Durante su mandato, por los actos delictivos cometidos en el ámbito territorial de la Comunidad Autónoma, no podrán ser detenidos ni retenidos sino en caso de flagrante delito, correspondiendo decidir, en todo caso, sobre su inculpación, prisión, procesamiento y juicio al Tribunal Superior de Justicia del País Vasco. Fuera del ámbito territorial del País Vasco, la responsabilidad penal será exigible en los mismos términos ante la Sala de lo Penal del Tribunal Supremo.",
      "b) Durante su mandato, por los actos delictivos cometidos en el ámbito territorial de la Comunidad Autónoma, no podrán ser detenidos ni retenidos sino en caso de flagrante delito, correspondiendo decidir, en todo caso, sobre su inculpación, prisión, procesamiento y juicio a la Sala de lo Penal del Tribunal Supremo.",
      "c) Durante su mandato, por los actos delictivos cometidos en el ámbito territorial de la Comunidad Autónoma, no podrán ser detenidos ni retenidos sino en caso de flagrante delito, correspondiendo decidir, en todo caso, sobre su inculpación, prisión, procesamiento y juicio al Tribunal Superior de Justicia del País Vasco. Fuera del ámbito territorial del País Vasco, la responsabilidad penal será exigible en los mismos términos ante la Audiencia Nacional.",
      "d) Durante su mandato, por los actos delictivos cometidos en el ámbito territorial de la Comunidad Autónoma, no podrán ser detenidos ni retenidos en ningún caso, correspondiendo decidir, en todo caso, sobre su inculpación, prisión, procesamiento y juicio al Tribunal Superior de Justicia del País Vasco. Fuera del ámbito territorial del País Vasco, la responsabilidad penal será exigible en los mismos términos ante la Sala de lo Penal del Tribunal Supremo."
    ],
    "correct": 0
  },
  {
    "question": "2. Según el art. 149 CE, el derecho estatal:",
    "options": [
      "a) Será, en todo caso, supletorio del derecho de las Comunidades Autónomas.",
      "b) Prevalecerá, en cualquier caso, sobre el de las comunidades autónomas si existe conflicto.",
      "c) Será subsidiario del derecho de las Comunidades Autónomas si así viene establecido en el correspondiente Estatuto de Autonomía.",
      "d) Será subsidiario del derecho de las Comunidades Autónomas si así lo determina el Tribunal Constitucional."
    ],
    "correct": 0
  },
  {
    "question": "3. La inviolabilidad del domicilio se contempla en:",
    "options": [
      "a) El artículo 14 de la Constitución.",
      "b) El artículo 18 de la Constitución.",
      "c) El artículo 12 de la Constitución.",
      "d) No está recogido como tal en la Constitución."
    ],
    "correct": 1
  },
  {
    "question": "4. El derecho a la libertad de enseñanza se recoge en:",
    "options": [
      "a) El artículo 37 de la CE.",
      "b) El artículo 14 de la CE.",
      "c) El artículo 27 de la CE.",
      "d) El artículo 32 de la CE."
    ],
    "correct": 2
  },
  {
    "question": "5. Indique cuál de los siguientes enunciados no es un deber o un derecho de los ciudadanos, contemplado en la Constitución:",
    "options": [
      "a) Podrá establecerse un servicio civil para el cumplimiento de fines de interés general.",
      "b) Se reconoce la libertad de empresa en el marco de la economía de mercado. Los poderes públicos garantizan y protegen su ejercicio y la defensa de la productividad, de acuerdo con las exigencias de la economía general y, en su caso, de la planificación.",
      "c) Se reconoce el derecho a disponer de periodos de ocio y disfrute vacacional.",
      "d) Se reconoce el derecho de fundación para fines de interés general, con arreglo a la ley."
    ],
    "correct": 2
  },
  {
    "question": "6. Según el Estatuto de Autonomía del País Vasco, la agricultura, la ganadería es una competencia:",
    "options": [
      "a) Exclusiva.",
      "b) De desarrollo.",
      "c) Del Estado.",
      "d) De ejecución."
    ],
    "correct": 0
  },
  {
    "question": "7. La designación de senadores que han de representar al País Vasco, según el Estatuto de Autonomía corresponde al:",
    "options": [
      "a) Gobierno Vasco.",
      "b) Lehendakari.",
      "c) Parlamento Vasco.",
      "d) Gobierno de España."
    ],
    "correct": 2
  },
  {
    "question": "8. Los Consejeros del Gobierno Vasco son designados por el:",
    "options": [
      "a) Parlamento Vasco.",
      "b) Rey.",
      "c) Lehendakari.",
      "d) Lehendakari y nombrados por el Rey."
    ],
    "correct": 2
  },
  {
    "question": "9. De conformidad con lo establecido en el art. 19 de la C.E, señale la respuesta correcta:",
    "options": [
      "a) Los españoles tienen derecho a entrar y salir libremente de España en los términos que la ley establezca. Este derecho podrá ser limitado sólo por motivos políticos.",
      "b) Los españoles tienen derecho a entrar y salir libremente de España en los términos que la ley establezca. Este derecho podrá ser limitado por motivos políticos o ideológicos.",
      "c) Los españoles tienen derecho a entrar y salir libremente de España en los términos que la ley establezca. Este derecho no podrá ser limitado por motivos políticos o ideológicos.",
      "d) La salida y entrada del país no es un derecho contemplado en la Constitución."
    ],
    "correct": 2
  },
  {
    "question": "10. El derecho al trabajo contenido en el artículo 35 de la Constitución comprende:",
    "options": [
      "a) La protección de la salud laboral y una remuneración suficiente.",
      "b) La libre elección de profesión u oficio, y el derecho a la negociación colectiva laboral.",
      "c) La libre elección de profesión u oficio a la promoción a través del trabajo y a una remuneración suficiente para atender sus necesidades y las de su familia.",
      "d) El derecho a la no discriminación en el trabajo por razones laborales y la enseñanza básica obligatoria y gratuita."
    ],
    "correct": 2
  },
  {
    "question": "11. La Comunidad Autónoma del País Vasco tiene competencia exclusiva en las siguientes materias (señale la incorrecta):",
    "options": [
      "a) Organización, régimen y funcionamiento de sus instituciones de autogobierno dentro de las normas del vigente Estatuto de Autonomía.",
      "b) Agricultura y ganadería, de acuerdo con la ordenación general de la economía.",
      "c) Casinos, juegos y apuestas, con excepción de las Apuestas Mutuas Deportivas Benéficas.",
      "d) Régimen minero y energético. Recursos geotérmicos."
    ],
    "correct": 3
  },
  {
    "question": "12. La Comunidad Autónoma del País Vasco tiene competencia exclusiva en las siguientes materias (señale la incorrecta):",
    "options": [
      "a) Desarrollo comunitario. Condición femenina. Política Infantil, juvenil y de la tercera edad.",
      "b) Establecimiento y regulación de Bolsas de Comercio y demás centros de contratación de mercancías y de valores conforme a la legislación mercantil.",
      "c) Ordenación farmacéutica de acuerdo con lo dispuesto en el artículo 149.1.16.a de la Constitución, e higiene, teniendo en cuenta lo dispuesto en el artículo 18 de este Estatuto.",
      "d) Propiedad intelectual e industrial."
    ],
    "correct": 3
  },
  {
    "question": "13. Es competencia de la Comunidad Autónoma del País Vasco el desarrollo legislativo y la ejecución dentro de su territorio de la legislación básica del Estado en las siguientes materias. Señale la respuesta incorrecta:",
    "options": [
      "a) Medio ambiente y ecología.",
      "b) Expropiación forzosa, contratos y concesiones administrativas, en el ámbito de sus competencias y sistema de responsabilidad de la Administración del País Vasco.",
      "c) Ordenación del sector pesquero del País Vasco.",
      "d) Pesas y medidas; contraste de metales."
    ],
    "correct": 3
  },
  {
    "question": "14. La Comunidad Autónoma del País Vasco tiene competencia exclusiva en las siguientes materias:",
    "options": [
      "a) Asistencia Social.",
      "b) Turismo, deporte, ocio y esparcimiento.",
      "c) Ordenación del territorio y del litoral, urbanismo y vivienda.",
      "d) Todas las respuestas anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "15. Según el Estatuto del País Vasco los poderes del País Vasco se ejercerán a través…",
    "options": [
      "a) Del Parlamento.",
      "b) Del Gobierno.",
      "c) De su Presidente o Lehendakari.",
      "d) Todas las respuestas anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "16. El Presidente del Gobierno Vasco:",
    "options": [
      "a) Será designado entre sus miembros por el Parlamento y nombrado por el Rey.",
      "b) Será designado por los diputados y senadores y nombrado por el Rey.",
      "c) Será designado y nombrado por el Parlamento Vasco.",
      "d) Todas son falsas."
    ],
    "correct": 0
  },
  {
    "question": "17. Según el Estatuto de Autonomía del País Vasco, la Comunidad Autónoma tiene competencia exclusiva en las siguientes materias:",
    "options": [
      "a) Medio Ambiente y ecología.",
      "b) Expropiación forzosa, contratos y concesiones administrativas en el ámbito de sus competencias y sistema de responsabilidad de la Administración del País Vasco.",
      "c) Ordenación del sector pesquero del País Vasco.",
      "d) Ninguna de las respuestas anteriores es correcta."
    ],
    "correct": 3
  },
  {
    "question": "18. Según el Estatuto de Autonomía del País Vasco, cuál de las siguientes materias son competencia exclusiva de la Comunidad Autónoma:",
    "options": [
      "a) Normas electorales, organización, régimen y funcionamiento de sus Órganos Forales.",
      "b) Redacción y aprobación del Plan Foral de Obras y Servicios, asistencia y asesoramiento técnico a las Entidades Locales.",
      "c) Organización, régimen y funcionamiento de sus Instituciones de autogobierno dentro de las normas del presente Estatuto.",
      "d) Medio Ambiente y ecología."
    ],
    "correct": 2
  },
  {
    "question": "19. Según el Estatuto de Autonomía del País Vasco, los archivos, bibliotecas y museos que no sean de titularidad estatal es una competencia:",
    "options": [
      "a) De desarrollo legislativo y de ejecución.",
      "b) De ejecución.",
      "c) Exclusiva.",
      "d) Concurrente."
    ],
    "correct": 2
  },
  {
    "question": "20. Según el Estatuto de Autonomía del País Vasco, son competencias de desarrollo legislativo y de ejecución dentro de su territorio:",
    "options": [
      "a) Ordenación del territorio y del litoral, urbanismo y vivienda.",
      "b) Ordenación del sector pesquero del País Vasco.",
      "c) Asistencia social.",
      "d) Ninguna de las anteriores es correcta."
    ],
    "correct": 1
  },
  {
    "question": "21. Según el Estatuto de Autonomía, corresponde a la Comunidad Autónoma del País Vasco la ejecución de la legislación del Estado en:",
    "options": [
      "a) Asistencia Social.",
      "b) Conservación, modificación y desarrollo del Derecho Civil Foral y especial.",
      "c) Régimen de los bienes provinciales y municipales.",
      "d) Legislación penitenciaria."
    ],
    "correct": 3
  },
  {
    "question": "22. En relación con la Administración de Justicia, la Comunidad Autónoma del País Vasco ejercerá:",
    "options": [
      "a) Las facultades que las Leyes Orgánicas del Poder Judicial y del Consejo Vasco de Finanzas Públicas reconozcan, reserven o atribuyan al Gobierno.",
      "b) Las facultades que las Leyes Orgánicas del Poder Judicial y del Consejo General del Poder Judicial reconozcan, reserven o atribuyan al Gobierno.",
      "c) Las facultades que las Leyes Orgánicas del Poder Judicial y Ley de Territorios Históricos reconozcan, reserven o atribuyan al Gobierno Vasco.",
      "d) Ninguna de las respuestas anteriores es correcta."
    ],
    "correct": 1
  },
  {
    "question": "23. Según el Estatuto de Autonomía del País Vasco, las competencias de desarrollo legislativo y ejecución son materias:",
    "options": [
      "a) En las que al Estado corresponde la fijación de las normas básicas y a la Comunidad Autónoma el desarrollo legislativo.",

    "correct": 0
  },
  {
    "question": "24. Según el Estatuto de Autonomía del País Vasco, indique cuáles de las siguientes competencias son competencia exclusiva no compartida:",
    "options": [

      "b) Bienes de dominio público y patrimoniales cuya titularidad corresponda a la Comunidad Autónoma.",

  {
    "question": "25. Según el Estatuto de Autonomía del País Vasco, indique cuál de las siguientes competencias es compartida con el Estado:",
    "options": [
      "a) El régimen local.",
      "b) Turismo y deporte.",
      "c) Archivos, Bibliotecas y Museos que no sean de titularidad estatal.",

    ],
    "correct": 0
  },
  {
    "question": "26. Según el Estatuto de Autonomía del País Vasco, las competencias exclusivas se regulan en:",

  },

      "c) Exclusiva.",
      "d) Ninguna de las respuestas es correcta."

    "correct": 0
  },
  {
    "question": "29. Según el Estatuto de Autonomía del País Vasco (artículo 10), cuál de las competencias indicadas es exclusiva:",

    ],
    "correct": 0
  },
  {
    "question": "30. Según el Estatuto del País Vasco, las leyes del Parlamento Vasco serán promulgadas por:",
    "options": [
      "a) El Presidente del Gobierno Vasco y publicadas en el Boletín Oficial del País Vasco.",
      "b) El Presidente del Parlamento Vasco y publicadas en el Boletín Oficial del País Vasco y en el Boletín Oficial del Estado.",
      "c) El Rey y publicadas en el Boletín Oficial del País Vasco y en el Boletín Oficial del Estado.",
      "d) El Presidente del Gobierno Vasco y publicadas en el Boletín Oficial del País Vasco y en el Boletín Oficial del Estado."
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.resultadosFinales.classList.add('hidden');
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');
                DOM.finalizarBtn.textContent = 'Finalizar Test';

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function mostrarResultados() {
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                // Recalcular el recuento total acumulado
                let correctas = 0;
                let incorrectas = 0;
                preguntas.forEach(p => {
                    if (p.comprobada) {
                        if (p.esCorrecta) correctas++;
                        else incorrectas++;
                    }
                });

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${correctas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${incorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function toggleFinalizarTest() {
                if (DOM.resultadosFinales.classList.contains('hidden')) {
                    mostrarResultados();
                } else {
                    mostrarPregunta();
                }
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, finalizar test, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
