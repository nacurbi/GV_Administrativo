<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley_392015_Practico12</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>LEY 39/2015 · TEST PRÁCTICO 12</strong> (Ley 39/2015 y Ley 40/2015)</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <details class="supuesto hidden" id="supuesto" open><summary>Supuesto práctico</summary><div id="supuesto-texto"></div></details>
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="referencia hidden" id="referencia"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const supuestos = ["<p>El Servicio de Ayudas de Gobierno Vasco tramita una convocatoria para la modernización de pequeños establecimientos. La sociedad mercantil NORTEA, S.L. presenta una solicitud por medio de su administradora, Elena.</p><p>También solicita la ayuda Jon, persona física que no está obligado a relacionarse electrónicamente con la Administración. En el expediente constan documentos aportados en una convocatoria anterior y otros elaborados por distintas Administraciones.</p><p>Durante la tramitación se plantean cuestiones sobre representación, identificación y firma, presentación en registros, cómputo y ampliación de plazos, así como sobre el contenido y la práctica de las notificaciones.</p><p>Además, la instructora del procedimiento, Marta, mantiene una amistad con la asesora de NORTEA, S.L. y, además, trabajó profesionalmente para dicha sociedad hace dieciocho meses. Jon promueve su recusación por escrito.</p>"];
            let preguntas = [
  {
    "question": "1. Elena presenta la solicitud en nombre de NORTEA, S.L., pero no acredita suficientemente la representación. Conforme a la Ley 39/2015, ¿qué actuación procede?",
    "options": [
      "a) Archivar sin más trámites la solicitud.",
      "b) Tener por realizado el acto si aporta la acreditación o subsana el defecto dentro de diez días,o de un plazo superior cuando las circunstancias lo requieran.",
      "c) Conceder siempre un plazo improrrogable diez días para la subsanación.",
      "d) Admitir la solicitud y presumir la representación sin necesidad de exigir acreditación."
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "2. ¿Cuál de las siguientes circunstancias permite considerar interesada a una persona en el procedimiento?",
    "options": [
      "a) Promoverlo como titular de intereses legítimos individuales o colectivos.",
      "b) Tener derechos que puedan resultar afectados por la decisión que se adopte, aunque no haya iniciado el procedimiento.",
      "c) Personarse en el procedimiento antes de que recaiga resolución definitiva cuando sus intereses legítimos puedan resultar afectados.",
      "d) Todas las respuestas son correctas."
    ],
    "correct": 3,
    "caso": 0
  },
  {
    "question": "3. Respecto de NORTEA, S.L., señale la respuesta correcta sobre su relación con la Administración:",
    "options": [
      "a) Está obligada a relacionarse por medios electrónicos para cualquier trámite del procedimiento.",
      "b) Puede escoger libremente entre medios electrónicos y papel en cada trámite.",
      "c) Solo está obligada si cuenta con más de cincuenta trabajadores.",
      "d) Solo está obligada cuando una norma reglamentaria individual lo disponga expresamente."
    ],
    "correct": 0,
    "caso": 0
  },
  {
    "question": "4. Jon comienza la tramitación en papel. ¿Puede cambiar después el medio elegido?",
    "options": [
      "a) No, la elección inicial es irrevocable.",
      "b) Solo puede cambiar si lo autoriza el órgano instructor.",
      "c) Sí, puede elegir en todo momento si se comunica electrónicamente o no y modificar el medio elegido.",
      "d) Sí, pero únicamente antes del trámite de audiencia."
    ],
    "correct": 2,
    "caso": 0
  },
  {
    "question": "5. Según el artículo 11 de la Ley 39/2015, ¿en cuál de estas actuaciones puede exigirse firma del interesado?",
    "options": [
      "a) En cualquier consulta por escrito sobre el estado del expediente.",
      "b) Para formular solicitudes, presentar declaraciones responsables o comunicaciones, interponer recursos, desistir de acciones o renunciar a derechos.",
      "c) Solo para interponer recursos administrativos.",
      "d) Únicamente cuando la actuación sea preceptiva."
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "6. Jon presenta un escrito dirigido al Gobierno Vasco en una oficina de asistencia en materia de registros del Ayuntamiento de Donostia. ¿Es un lugar de presentación admitido por la Ley 39/2015?",
    "options": [
      "a) No, porque debe acudir a un registro de la misma Administración destinataria.",
      "b) Solo si existe convenio bilateral entre ambas Administraciones.",
      "c) Sí, al poder presentarse en las oficinas de asistencia en materia de registros.",
      "d) Solo si el escrito se dirige a una entidad local."
    ],
    "correct": 2,
    "caso": 0
  },
  {
    "question": "7. La unidad instructora exige a Jon un documento que ya fue elaborado por otra Administración. Como regla general, procede:",
    "options": [
      "a) No exigirlo al interesado y recabarlo electrónicamente a través de las redes corporativas o plataformas de intermediación de datos, salvo oposición del interesado.",
      "b) Exigir siempre el original en papel para proceder a su cotejo.",
      "c) Exigir una copia compulsada, aunque la Administración pueda consultarlo.",
      "d) Archivar el expediente si no lo aporta con la solicitud."
    ],
    "correct": 0,
    "caso": 0
  },
  {
    "question": "8. Se concede a Jon un plazo de diez días para realizar un trámite. En el cómputo de dicho plazo:",
    "options": [
      "a) Se incluyen los sábados, salvo que sean festivos.",
      "b) Se incluyen sábados y domingos, pero no festivos.",
      "c) Solo se excluyen los domingos y festivos.",
      "d) Se excluyen sábados, domingos y los declarados festivos."
    ],
    "correct": 3,
    "caso": 0
  },
  {
    "question": "9. Antes de vencer dicho plazo, Jon solicita su ampliación. Se comprueba que no se perjudican derechos de terceros. ¿Qué establece el artículo 32?",
    "options": [
      "a) La Administración debe conceder, de oficio o a petición del interesado, una ampliación que suponga la mitad del plazo inicial, si las circunstancias lo aconsejan.",
      "b) La Administración puede conceder, de oficio o a petición del interesado, una ampliación que no exceda de la mitad del plazo inicial, si las circunstancias lo aconsejan.",
      "c) La Administración debe conceder, de oficio o a petición del interesado, una ampliación que no exceda la mitad del plazo inicial, si las circunstancias lo aconsejan.",
      "d) La Administración puede conceder, de oficio o a petición del interesado, una ampliación que suponga de la mitad del plazo inicial, si las circunstancias lo aconsejan."
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "10. Señale cuál NO es un contenido exigido por el artículo 40.2 para una notificación administrativa:",
    "options": [
      "a) El texto íntegro de la resolución.",
      "b) La indicación de si pone fin o no a la vía administrativa.",
      "c) Los recursos procedentes, el órgano ante el que deben presentarse y el plazo para interponerlos.",
      "d) La identidad del titular del órgano que haya llevado a cabo la tramitación."
    ],
    "correct": 3,
    "caso": 0
  },
  {
    "question": "11. Marta mantiene amistad íntima con la asesora de NORTEA, S.L. y prestó servicios profesionales a la sociedad hace dieciocho meses:",
    "options": [
      "a) Ambas circunstancias encajan en motivos legales de abstención.",
      "b) Ninguna constituye motivo de abstención si Marta afirma ser imparcial.",
      "c) Solo la prestación de servicios constituye motivo de abstención; la amistad íntima nunca lo es.",
      "d) Solo existiría abstención si Marta fuese familiar de la administradora."
    ],
    "correct": 0,
    "caso": 0
  },
  {
    "question": "12. Jon recusa por escrito a Marta y esta al día siguiente niega la causa alegada. ¿Qué régimen se aplica?",
    "options": [
      "a) El superior de Marta resolverá en tres días, previos los informes y comprobaciones que considere oportunos; la resolución admite recurso. Durante este tiempo, se podrá suspender el plazo para resolver y notificar.",
      "b) El superior de Marta resolverá en 3 días, previos los informes y comprobaciones que considere oportunos; la resolución no admite recurso, sin perjuicio de alegar la recusación al recurrir la resolución del procedimiento. Durante este tiempo, se podrá suspender el plazo para resolver y notificar.",
      "c) El superior de Marta resolverá en tres días, previos los informes y comprobaciones que considere oportunos; la resolución no admite recurso, sin perjuicio de alegar la recusación al recurrir la resolución del procedimiento. Durante este tiempo, se suspenderá el plazo para resolver y notificar.",
      "d) El superior de Marta resolverá en 3 días, previos los informes y comprobaciones que considere oportunos; la resolución admite recurso. Durante este tiempo, se suspenderá el plazo para resolver y notificar"
    ],
    "correct": 2,
    "caso": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    [].concat(pregunta.correct).forEach(c => toggleClasses(botonesOpciones[c], 'correcta'));

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;
                const sup = document.getElementById('supuesto');
                if (pregunta.caso != null && supuestos[pregunta.caso]) {
                    if (sup.dataset.caso !== String(pregunta.caso)) { document.getElementById('supuesto-texto').innerHTML = supuestos[pregunta.caso]; sup.dataset.caso = pregunta.caso; }
                    sup.classList.remove('hidden');
                } else sup.classList.add('hidden');
                const ref = document.getElementById('referencia');
                ref.textContent = pregunta.ref || '';
                ref.classList.toggle('hidden', !(pregunta.comprobada && pregunta.ref));

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = [].concat(pregunta.correct).includes(pregunta.respuestaUsuario);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();
                if (pregunta.ref) document.getElementById('referencia').classList.remove('hidden');

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
