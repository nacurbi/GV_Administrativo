<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley_392015_Test4</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>LEY 39/2015, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN:</strong> Test 4</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. La ley del procedimiento administrativo común de las administraciones públicas es de fecha?:",
    "options": [
      "a) 39/2015 de 1 de octubre.",
      "b) 40/2015 de 1 de octubre.",
      "c) 5/2015 de 30 de octubre.",
      "d) Ninguna es correcta."
    ],
    "correct": 0
  },
  {
    "question": "2. Cuál es el objeto de la ley de procedimiento administrativo común de las administraciones públicas?",
    "options": [
      "a) Regular el procedimiento administrativo común a todas las administraciones públicas.",
      "b) Regular el procedimiento sancionador.",
      "c) Regular la reclamación de responsabilidad de las administraciones públicas.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "3. El artículo 13 de la LPAC :",
    "options": [
      "a) Regula los derechos del interesado en el procedimiento administrativo.",
      "b) Regula los derechos de los ciudadanos en sus relaciones con las administraciones públicas.",
      "c) Regula los derechos de las personas con capacidad de obrar ante las administraciones públicas.",
      "d) Regula los derechos de las personas en sus relaciones con las administraciones públicas."
    ],
    "correct": 3
  },
  {
    "question": "4. Señala cuál no es un derecho del artículo 13 de la LPAC :",
    "options": [
      "a) A identificar a las autoridades y al personal al servicio de las administraciones públicas bajo cuya responsabilidad se tramiten los procedimientos.",
      "b) A la obtención y utilización de los medios de identificación y firma electrónica contemplados en esta ley.",
      "c) A la protección de datos de carácter personal y en particular a la seguridad y confidencialidad de los datos que figuran en los ficheros, sistemas y aplicaciones de las administraciones públicas.",
      "d) A exigir las responsabilidades de las administraciones públicas y autoridades cuando así corresponda legalmente."
    ],
    "correct": 0
  },
  {
    "question": "5. Señala la respuesta correcta :",
    "options": [
      "a) Las personas físicas podrán elegir siempre y en todo momento la forma de relacionarse con las administraciones públicas.",
      "b) Las personas jurídicas están obligadas a relacionarse a través de medios electrónicos con las administraciones públicas.",
      "c) Reglamentariamente, las administraciones públicas podrán establecer la relación electrónica obligatoria y para todos los procedimientos a ciertos colectivos de personas físicas que por razón de su capacidad económica, técnica, dedicación profesional u otros.",
      "d) Las respuestas b y c son correctas."
    ],
    "correct": 1
  },
  {
    "question": "6. Cuál no está en la regulación de derechos del artículo 13 de la ley 39/2015 de 1 de octubre?:",
    "options": [
      "a) A utilizar las lenguas oficiales en el territorio de su Comunidad autónoma, de acuerdo con lo previsto en la ley 39/2015 de 1 de octubre y en el resto del ordenamiento jurídico.",
      "b) A obtener información y orientación acerca de los requisitos jurídicos o técnicos que las disposiciones vigentes impongan a los proyectos, actuaciones o solicitudes que se propongan realizar.",
      "c) A comunicarse con las administraciones públicas a través de un punto de acceso general electrónico de la Administración.",
      "d) Todas son correctas."
    ],
    "correct": 1
  },
  {
    "question": "7. Quién está obligado a relacionarse a través de medios electrónicos con las administraciones públicas para la realización de cualquier trámite de un procedimiento administrativo? :",
    "options": [
      "a) Las personas jurídicas.",
      "b) Los entes sin personalidad jurídica.",
      "c) Los que ejerzan una actividad profesional para la que se requiera colegiación obligatoria para los trámites y actuaciones que realicen con las administraciones públicas en ejercicio de dicha actividad profesional.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "8. Señala la respuesta correcta:",
    "options": [
      "a) La ley 39/2015 de 1 de octubre podrá establecer la obligación de relacionarse a través de medios electrónicos para todos los procedimientos y para ciertos colectivos de personas físicas.",
      "b) La ley reguladora de procedimientos podrá obligar a determinados colectivos de personas físicas para relacionarse electrónicamente por razón de su capacidad económica, técnica, dedicación profesional u otros.",
      "c) Reglamentariamente, las administraciones públicas podrán establecer la obligación de relacionarse con ellas a través de medios electrónicos para determinados procedimientos y para ciertos colectivos de personas físicas de las cuales quede acreditado que tienen acceso y disponibilidad de los medios electrónicos necesarios.",
      "d) Todas son incorrectas."
    ],
    "correct": 2
  },
  {
    "question": "9. Sobre la lengua de los procedimientos:",
    "options": [
      "a) La lengua de los procedimientos será siempre el castellano salvo que el interesado elija otra lengua.",
      "b) La lengua de los procedimientos tramitados por la Administración General del estado será el castellano, no pudiendo elegir el interesado otra lengua.",
      "c) En los procedimientos tramitados por las administraciones de las Comunidades autónomas y de las entidades locales, el uso de la lengua se ajustará a lo previsto en la legislación autonómica correspondiente.",
      "d) Los interesados en un procedimiento administrativo deberán traducir al castellano los documentos, expedientes o partes que deban surtir efecto fuera del territorio de la Comunidad autónoma."
    ],
    "correct": 2
  },
  {
    "question": "10. Sobre los registros, señala la respuesta correcta :",
    "options": [
      "a) Cada administración pública podrá disponer de un registro electrónico general en el que se hará el correspondiente asiento de todo documento que sea presentado o que se reciba.",
      "b) Los documentos que los interesados dirijan a los órganos de las administraciones públicas podrán presentarse además de en los registros electrónicos, en las oficinas de correos,, en oficinas de asistencia en materias de registros y en las embajadas extranjeras en España, entre otras.",
      "c) Los organismos públicos vinculados o dependientes de cada administración podrán disponer de su propio registro electrónico plenamente interoperable e interconectado con el registro electrónico general de la administración de la que depende.",
      "d) Todas son correctas."
    ],
    "correct": 2
  },
  {
    "question": "11. Pueden presentarse documentos de forma presencial? :",
    "options": [
      "a) No.",
      "b) Algunos documentos.",
      "c) Sí, pero deberán ser digitalizados y devueltos a sus dueños salvo que la norma determine la custodia por la administración de dichos documentos.",
      "d) Sólo los documentos que tengan un régimen especial."
    ],
    "correct": 2
  },
  {
    "question": "12. Sobre la colaboración de las personas con la Administración, señala la respuesta correcta:",
    "options": [
      "a) Las personas no tienen obligación de colaborar con la administración, sólo los interesados.",
      "b) Los interesados en un procedimiento que conozcan datos que permitan identificar a otros interesados que no hayan comparecido en él tienen el deber de proporcionárselos a la Administración actuante.",
      "c) Las administraciones públicas podrán entrar en los domicilios del afectado sin necesidad de autorización judicial.",
      "d) Todas son correctas."
    ],
    "correct": 1
  },
  {
    "question": "13. Quienes son responsables de la tramitación de los procedimientos? :",
    "options": [
      "a) Los interesados.",
      "b) Los titulares de las unidades administrativas y el personal al servicio de las administraciones públicas que tuvieran a su cargo la resolución o despacho de asuntos.",
      "c) Las respuestas a y b son correctas.",
      "d) Las respuestas a y b son incorrectas."
    ],
    "correct": 1
  },
  {
    "question": "14. La comparecencia de las personas ante las oficinas públicas:",
    "options": [
      "a) Presencialmente sólo será obligatorio cuando así esté previsto en una norma reglamentaria.",
      "b) Ya sea presencialmente o por medios electrónicos, sólo será obligatorio cuándo así esté previsto en una norma con rango de ley.",
      "c) Presencialmente, sólo será obligatorio cuando así esté previsto en una norma con rango de ley.",
      "d) Por medios electrónicos sólo será obligatorio cuando lo exija un reglamento."
    ],
    "correct": 1
  },
  {
    "question": "15. Señala la respuesta correcta :",
    "options": [
      "a) La administración no está obligada a dictar resolución expresa y a notificarla en los procedimientos iniciados de oficio.",
      "b) La administración está obligada a dictar resolución expresa y a notificarla en los procedimientos iniciados sólo a solicitud de interesado.",
      "c) La administración está obligado a dictar resolución expresa y a notificarla en todos los procedimientos cualquiera que sea su forma de iniciación, salvo en los supuestos de terminación del procedimiento por pacto o convenio, así como en los procedimientos relativos al ejercicio de derechos sometidos únicamente al deber de declaración responsable o comunicación.",
      "d) La administración no está obligada a resolver expresamente y notificar la resolución, porque existe la figura del silencio administrativo."
    ],
    "correct": 2
  },
  {
    "question": "16. Sobre la duración del procedimiento señala la respuesta correcta :",
    "options": [
      "a) El plazo máximo en el que debe notificarse la resolución expresa será el fijado por la norma reguladora del procedimiento.",
      "b) Este plazo nunca podrá exceder de 6 meses.",
      "c) Los plazos se empezarán a contar en los procedimientos iniciados a solicitud del interesado desde la fecha de la solicitud.",
      "d) Todas son incorrectas."
    ],
    "correct": 0
  },
  {
    "question": "17. Cuándo las normas reguladoras de los procedimientos no fijen el plazo máximo para notificar la resolución expresa, éste será de:",
    "options": [
      "a) 10 días hábiles.",
      "b) 1 mes.",
      "c) 3 meses.",
      "d) 6 meses."
    ],
    "correct": 2
  },
  {
    "question": "18. El procedimiento sancionador se regula en la Norma Foral 54/2015 que establece que el plazo máximo para notificar y resolver el procedimiento es de 9 meses… Es correcto? :",
    "options": [
      "a) Sí, se puede establecer un periodo máximo de 9 meses.",
      "b) No, el plazo máximo es de 3 meses.",
      "c) Se puede establecer una duración superior a 6 meses con una norma con rango de ley, y una norma foral no la tiene.",
      "d) Ninguna es correcta."
    ],
    "correct": 2
  },
  {
    "question": "19. Cómo se cuentan los plazos? :",
    "options": [
      "a) En los procedimientos iniciados de oficio desde la fecha del acuerdo de iniciación.",
      "b) En los procedimientos iniciados a solicitud del interesado desde el dia de la notificación de la iniciación.",
      "c) En los procedimientos iniciados a solicitud del interesado desde el día siguiente a la fecha en que la solicitud haya tenido entrada.",
      "d) Ninguna es correcta."
    ],
    "correct": 0
  },
  {
    "question": "20. El plazo máximo legal para resolver un procedimiento y notificar la resolución, se puede suspender?:",
    "options": [
      "a) Nunca.",
      "b) Siempre.",
      "c) En determinados casos el órgano competente podrá suspender dicho plazo.",
      "d) Se podrá suspender dicho plazo a instancia del interesado."
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
