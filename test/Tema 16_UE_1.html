<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema 16_UE_1</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>TEMA 16. LA UNIÓN EUROPEA</strong> (Test 1)</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. La construcción europea se inició formalmente con una declaración que proponía una transferencia progresiva de competencias hacia instituciones supranacionales. ¿A qué declaración se refiere esta afirmación?",
    "options": [
      "a) Declaración de Maastricht",
      "b) Declaración de Schuman",
      "c) Declaración de Lisboa",
      "d) Declaración de Roma"
    ],
    "correct": 1
  },
  {
    "question": "2. ¿Cuál fue la primera organización surgida como resultado tangible del proceso de construcción europea?",
    "options": [
      "a) CEE",
      "b) CEEA",
      "c) CECA",
      "d) UE"
    ],
    "correct": 2
  },
  {
    "question": "3. Los dos textos constitutivos principales de la Unión Europea son:",
    "options": [
      "a) TUE y TFUE",
      "b) Maastricht y Lisboa",
      "c) CEDH y TUE",
      "d) Ninguna es correcta"
    ],
    "correct": 0
  },
  {
    "question": "4. ¿Qué institución define las orientaciones y prioridades políticas generales de la UE sin legislar?",
    "options": [
      "a) Comisión",
      "b) Parlamento",
      "c) Consejo Europeo",
      "d) TJUE"
    ],
    "correct": 2
  },
  {
    "question": "5. Señale la respuesta incorrecta sobre el Consejo Europeo.",
    "options": [
      "a) Integrado por jefes de Estado y/o de Gobierno",
      "b) Mandato presidencial de 2,5 años renovable una vez",
      "c) Legisla con el Parlamento",
      "d) Se reúne normalmente dos veces por semestre"
    ],
    "correct": 2
  },
  {
    "question": "6. Respecto al Consejo de la Unión Europea:",
    "options": [
      "a) Está integrado por diputados",
      "b) Tiene miembros permanentes",
      "c) Se reúne en distintas formaciones",
      "d) Ninguna es correcta"
    ],
    "correct": 2
  },
  {
    "question": "7. ¿Cuál es la función esencial del COREPER?",
    "options": [
      "a) Resolver recursos",
      "b) Preparar trabajos del Consejo",
      "c) Control presupuestario",
      "d) Política monetaria"
    ],
    "correct": 1
  },
  {
    "question": "8. La mayoría cualificada requiere:",
    "options": [
      "a) 55% Estados y 65% población",
      "b) 65% Estados y 55% población",
      "c) Unanimidad",
      "d) 72% Estados exclusivamente"
    ],
    "correct": 0
  },
  {
    "question": "9. Señale la respuesta incorrecta.",
    "options": [
      "a) Existe derecho de veto",
      "b) Un voto en contra bloquea",
      "c) Las abstenciones impiden la unanimidad",
      "d) Se usa en materias sensibles"
    ],
    "correct": 2
  },
  {
    "question": "10. Respecto al presupuesto anual de la UE:",
    "options": [
      "a) La Comisión presenta la propuesta",
      "b) Consejo y Parlamento lo aprueban",
      "c) Puede aplicarse régimen de doceavas provisionales",
      "d) Todas son correctas"
    ],
    "correct": 3
  },
  {
    "question": "11. La institución que representa el poder ejecutivo europeo es:",
    "options": [
      "a) Consejo Europeo",
      "b) Parlamento",
      "c) Comisión Europea",
      "d) Tribunal de Cuentas"
    ],
    "correct": 2
  },
  {
    "question": "12. Sobre la Comisión Europea:",
    "options": [
      "a) Se compone de un comisario por cada Estado Miembro",
      "b) Mandato coincidente con el Parlamento",
      "c) Monopolio casi absoluto iniciativa legislativa",
      "d) Todas son correctas"
    ],
    "correct": 3
  },
  {
    "question": "13. Para aprobar propuestas en la Comisión se requiere:",
    "options": [
      "a) Al menos 14 votos favorables",
      "b) Unanimidad",
      "c) Dos tercios del Parlamento",
      "d) Mayoría cualificada del Consejo"
    ],
    "correct": 0
  },
  {
    "question": "14. Señale la respuesta incorrecta sobre el Parlamento Europeo.",
    "options": [
      "a) Tiene legitimidad democrática directa",
      "b) Los eurodiputados se organizan exclusivamente por nacionalidades",
      "c) Ejerce función legislativa",
      "d) Sus miembros son elegidos directamente"
    ],
    "correct": 1
  },
  {
    "question": "15. Las elecciones europeas tienen lugar cada:",
    "options": [
      "a) 3 años",
      "b) 4 años",
      "c) 5 años",
      "d) 6 años"
    ],
    "correct": 2
  },
  {
    "question": "16. Sobre las sedes del Parlamento Europeo:",
    "options": [
      "a) Celebra sus sesiones plenarias en Estrasburgo y Bruselas",
      "b) Su Secretaría General está ubicada en Luxemburgo",
      "c) Las Comisiones se reúnen en Bruselas",
      "d) Todas son correctas"
    ],
    "correct": 3
  },
  {
    "question": "17. ¿Quién nombra al Defensor del Pueblo Europeo?",
    "options": [
      "a) Consejo Europeo",
      "b) Comisión",
      "c) Parlamento Europeo",
      "d) TJUE"
    ],
    "correct": 2
  },
  {
    "question": "18. Misión principal del TJUE:",
    "options": [
      "a) Aprobar presupuesto",
      "b) Velar por interpretación y aplicación del Derecho UE",
      "c) Dirigir política monetaria",
      "d) Representar Estados"
    ],
    "correct": 1
  },
  {
    "question": "19. Señale la respuesta incorrecta sobre el Tribunal de Justicia.",
    "options": [
      "a) Un juez por Estado",
      "b) Existen abogados generales",
      "c) Las conclusiones del abogado general vinculan al Tribunal",
      "d) Mandato de 6 años"
    ],
    "correct": 2
  },
  {
    "question": "20. El recurso por incumplimiento tiene por objeto:",
    "options": [
      "a) Controlar el cumplimiento de obligaciones por los Estados",
      "b) Revisar sentencias nacionales",
      "c) Resolver conflictos laborales",
      "d) Ninguna es correcta"
    ],
    "correct": 0
  },
  {
    "question": "21. ¿Quién puede interponer recurso por incumplimiento?",
    "options": [
      "a) Solo Comisión",
      "b) Comisión o un Estado contra otro Estado",
      "c) Solo particulares",
      "d) Solo Parlamento"
    ],
    "correct": 1
  },
  {
    "question": "22. El recurso de reparación de daños y perjuicios pretende:",
    "options": [
      "a) Indemnizar daños causados por órganos UE",
      "b) Modificar tratados",
      "c) Sancionar penalmente Estados",
      "d) Ninguna es correcta"
    ],
    "correct": 0
  },
  {
    "question": "23. Respecto al BCE y al Eurosistema:",
    "options": [
      "a) Tiene su sede en Frankfurt",
      "b) Su objetivo principal es la estabilidad de precios (controlar la inflación)",
      "c) Contribuye a la solidez realizando funciones de supervisión bancaria",
      "d) Todas son correctas"
    ],
    "correct": 3
  },
  {
    "question": "24. Señale la respuesta incorrecta.",
    "options": [
      "a) Los reglamentos son directamente aplicables",
      "b) Las directivas obligan en cuanto al resultado",
      "c) Las recomendaciones son vinculantes",
      "d) Los dictámenes no son vinculantes"
    ],
    "correct": 2
  },
  {
    "question": "25. Respecto a las directivas:",
    "options": [
      "a) Suelen prever plazo de transposición",
      "b) Son técnica de legislación compartida",
      "c) Requieren normalmente transposición interna",
      "d) Todas son correctas"
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
