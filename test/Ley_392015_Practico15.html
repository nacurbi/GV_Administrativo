<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley_392015_Practico15</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>LEY 39/2015 · TEST PRÁCTICO 15</strong> (Ley 39/2015 y Ley 40/2015)</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <details class="supuesto hidden" id="supuesto" open><summary>Supuesto práctico</summary><div id="supuesto-texto"></div></details>
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="referencia hidden" id="referencia"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const supuestos = ["<p>El Departamento de Alimentación, Desarrollo Rural, Agricultura y Pesca de la Administración General de la Comunidad Autónoma de Euskadi tramita un procedimiento para exigir el reintegro de una ayuda concedida a la mercantil “Productos Mediavilla, S.L.” La iniciación se acuerda el lunes 2 de marzo y el plazo máximo para resolver y notificar es de 6 meses. Su administradora presenta varios escritos en papel, pese a ser requerida para subsanarlos electrónicamente.</p><p>La instrucción corresponde al Servicio de Ayudas del citado Departamento del Gobierno Vasco. Su jefa, que participó en un informe técnico facultativo previo incorporado al expediente, es hermana de la persona administradora de una empresa competidora, “Agrícola Vargas, S.L.”, que, en el mismo programa de ayudas, también percibió una, aunque de menor cuantía, y denunció los hechos. La interesada promueve la recusación. Mientras se resuelve, el órgano instructor acuerda abrir prueba por diez días y solicita un informe preceptivo a otro órgano. El informe se emite fuera de plazo.</p><p>Durante la tramitación se plantea adoptar una medida provisional para impedir la disposición de determinados bienes de inversión vinculados a la ayuda. Concluida la instrucción, se concede audiencia. La resolución de reintegro se notifica electrónicamente y pone fin a la vía administrativa. Productos Mediavilla, S.L. interpone recurso; además, solicita la suspensión de la ejecución. 3 años después, la Administración detecta un error material en una cifra de la resolución y, separadamente, duda de la validez de otro acto favorable firme dictado en el mismo programa de ayudas.</p>"];
            let preguntas = [
  {
    "question": "1. Respecto de los escritos presentados en papel por Mediavilla, S.L., ¿qué fecha se considera, con carácter general, como fecha de presentación?",
    "options": [
      "a) La fecha en que se presentaron materialmente en papel.",
      "b) La fecha en que la interesada efectúe la subsanación mediante presentación electrónica.",
      "c) La fecha de la notificación del requerimiento de subsanación.",
      "d) La fecha en que el órgano instructor incorpore los escritos digitalizados al expediente."
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "2. La jefa del Servicio de Ayudas debe abstenerse. ¿Por qué?: SEÑALE LA INCORRECTA",
    "options": [
      "a) Por haber intervenido en el mencionado informe previo constituye, por sí solo, causa legal de abstención, puesto que el informe es vinculante.",
      "b) Solo procedería la abstención si su hermana fuera administradora de Productos Mediavilla, S.L..",
      "c) Porque tiene parentesco de consanguinidad dentro del segundo grado con la administradora de Agrícola Vargas, S.L., una entidad interesada en el asunto.",
      "d) Todas son correctas."
    ],
    "correct": 0,
    "caso": 0
  },
  {
    "question": "3. Promovida la recusación, señale la respuesta correcta:",
    "options": [
      "a) Al día siguiente, la persona recusada manifestará a su inmediato superior si concurre o no la causa de recusación; si la niega, el superior resolverá en tres días, previos informes y comprobaciones oportunos.",
      "b) La recusación podría ser causa de suspensión del procedimiento hasta que exista resolución.",
      "c) Contra la resolución de la recusación cabe recurso de alzada independiente.",
      "d) La recusación solo puede plantearse antes del acuerdo de iniciación."
    ],
    "correct": 0,
    "caso": 0
  },
  {
    "question": "4. Sobre el período de prueba abierto por diez días, ¿cuál es la valoración correcta?",
    "options": [
      "a) Es inválido porque el período ordinario nunca puede ser inferior a treinta días.",
      "b) Solo sería posible si lo hubiera solicitado Agrícola Mediavilla, S.L.",
      "c) Sería correcto únicamente si se tratase de un procedimiento sancionador.",
      "d) Es compatible con la Ley 39/2015, que permite un período de prueba no superior a treinta días ni inferior a diez."
    ],
    "correct": 3,
    "caso": 0
  },
  {
    "question": "5. El informe preceptivo solicitado a otro órgano se emite fuera del plazo legal o del señalado. Con carácter general:",
    "options": [
      "a) Se produce la caducidad.",
      "b) Podrán proseguirse las actuaciones, sin perjuicio de la suspensión del plazo máximo cuando concurran los requisitos legales; el informe tardío puede no ser tenido en cuenta.",
      "c) El informe queda convalidado si se emite antes del trámite de audiencia.",
      "d) La falta de emisión equivale siempre a informe favorable (silencio positivo)."
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "6. La medida provisional consistente en impedir la disposición de bienes:",
    "options": [
      "a) Puede acordarse motivadamente, de oficio o a instancia de parte, si existen elementos de juicio suficientes y respetando proporcionalidad, efectividad y menor onerosidad.",
      "b) Solo puede adoptarse en para la protección provisional de los intereses implicados.",
      "c) Puede causar perjuicios de difícil reparación.",
      "d) Debe mantenerse hasta que la resolución sea firme."
    ],
    "correct": 0,
    "caso": 0
  },
  {
    "question": "7. El trámite de audiencia, con carácter general, debe concederse:",
    "options": [
      "a) Por un plazo exacto de veinte días hábiles.",
      "b) Antes de la práctica de toda prueba y de la solicitud de informes.",
      "c) Por un plazo no inferior a diez días ni superior a quince, una vez instruido el procedimiento e inmediatamente antes de redactar la propuesta de resolución, con las salvedades legales.",
      "d) Únicamente en procedimientos iniciados a solicitud del interesado."
    ],
    "correct": 2,
    "caso": 0
  },
  {
    "question": "8. En la notificación electrónica puesta a disposición de Agrícola Mediavilla, S.L., si no accede a su contenido, se entenderá rechazada:",
    "options": [
      "a) Al quinto día natural desde la puesta a disposición.",
      "b) Al décimo día hábil desde el aviso al correo electrónico.",
      "c) Al transcurrir diez días desde la emisión del acto, aunque aún no se haya puesto a disposición.",
      "d) Cuando hayan transcurrido diez días naturales desde la puesta a disposición sin acceder a su contenido, salvo imposibilidad técnica o material acreditada."
    ],
    "correct": 3,
    "caso": 0
  },
  {
    "question": "9. Sobre el recurso potestativo de reposición contra la resolución expresa que pone fin a la vía administrativa, indique cuál NO es correcta:",
    "options": [
      "a) Puede interponerse ante el mismo órgano que dictó el acto.",
      "b) Mientras no sea resuelto expresamente, no puede interponerse recurso contencioso-administrativo.",
      "c) El plazo de interposición es de un mes.",
      "d) Contra su resolución cabe interponer nuevamente el recurso de reposición, si se invocan distintos motivos."
    ],
    "correct": 3,
    "caso": 0
  },
  {
    "question": "10. Solicitada la suspensión de la ejecución al interponer el recurso, se entenderá suspendida si:",
    "options": [
      "a) Transcurre un mes desde la solicitud sin notificación de resolución expresa.",
      "b) Transcurre un mes desde la entrada de la solicitud en el registro electrónico de la Administración u organismo competente para decidir sobre ella sin que se haya notificado resolución expresa.",
      "c) Transcurren diez días hábiles desde la interposición del recurso.",
      "d) La recurrente afirma que la ejecución le ocasionaría cualquier perjuicio económico."
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "11. Detectado un error material en una cifra de la resolución, la Administración:",
    "options": [
      "a) Solo puede corregirlo dentro del plazo para recurrir.",
      "b) Debe acudir siempre a la revisión de oficio por nulidad.",
      "c) Puede rectificarlo en cualquier momento, de oficio o a instancia de los interesados, siempre que sea realmente un error material, de hecho o aritmético y no una alteración sustantiva del acto.",
      "d) Solo puede corregirlo si el acto es firme."
    ],
    "correct": 2,
    "caso": 0
  },
  {
    "question": "12. Respecto del otro acto favorable firme cuya validez se cuestiona, ¿qué afirmaciones son correctas?",
    "options": [
      "a) Si incurre en una causa de nulidad de pleno derecho, la Administración puede iniciar revisión de oficio, con dictamen favorable del órgano consultivo competente cuando proceda.",
      "b) Si es anulable y favorable, la Administración debe declararlo lesivo para el interés público antes de impugnarlo ante la jurisdicción contencioso-administrativa, dentro de los límites temporales legales.",
      "c) Las facultades de revisión no pueden ejercerse cuando, por prescripción, tiempo transcurrido u otras circunstancias, su ejercicio resulte contrario a la equidad, buena fe, derecho de los particulares o leyes.",
      "d) Todas las respuestas son correctas."
    ],
    "correct": 3,
    "caso": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    [].concat(pregunta.correct).forEach(c => toggleClasses(botonesOpciones[c], 'correcta'));

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;
                const sup = document.getElementById('supuesto');
                if (pregunta.caso != null && supuestos[pregunta.caso]) {
                    if (sup.dataset.caso !== String(pregunta.caso)) { document.getElementById('supuesto-texto').innerHTML = supuestos[pregunta.caso]; sup.dataset.caso = pregunta.caso; }
                    sup.classList.remove('hidden');
                } else sup.classList.add('hidden');
                const ref = document.getElementById('referencia');
                ref.textContent = pregunta.ref || '';
                ref.classList.toggle('hidden', !(pregunta.comprobada && pregunta.ref));

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = [].concat(pregunta.correct).includes(pregunta.respuestaUsuario);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();
                if (pregunta.ref) document.getElementById('referencia').classList.remove('hidden');

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
