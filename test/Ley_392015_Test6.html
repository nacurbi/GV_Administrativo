<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley_392015_Test6</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>LEY 39/2015, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN:</strong> Test 6</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. Juan que promueve un procedimiento administrativo como titular de un derecho, tiene la consideración de:",
    "options": [
      "a) Beneficiario.",
      "b) Interesado.",
      "c) Persona física.",
      "d) Demandante."
    ],
    "correct": 1
  },
  {
    "question": "2. Tendrán la capacidad de obrar ante las Administraciones Públicas los menores de edad para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación este permitida por:",
    "options": [
      "a) La Ley.",
      "b) El ordenamiento jurídico sin la asistencia de la persona que ejerza la patria potestad, tutela o curatela, excepto en el caso de los menores incapacitados.",
      "c) Sus representantes legales.",
      "d) El ordenamiento jurídico con la asistencia de la persona que ejerza la patria potestad, tutela o curatela."
    ],
    "correct": 1
  },
  {
    "question": "3. A los efectos previstos en la Ley 39/2015, de 1 de octubre, tendrán capacidad de obrar ante las Administraciones Públicas (señala la incorrecta):",
    "options": [
      "a) Las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a las normas civiles.",
      "b) Los menores de edad no incapacitados para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de la persona que ejerza la patria potestad, tutela o curatela.",
      "c) Los menores incapacitados, cuando la extensión de la incapacitación afecte al ejercicio y defensa de los derechos o intereses de que se trate.",
      "d) Cuando la Ley así lo declare expresamente, los grupos de afectados, las uniones y entidades sin personalidad jurídica y los patrimonios independientes o autónomos."
    ],
    "correct": 2
  },
  {
    "question": "4. Se consideran interesados en el procedimiento administrativo (señala la incorrecta):",
    "options": [
      "a) quienes lo promuevan como titulares de derechos o intereses legítimos individuales.",
      "b) quienes lo promuevan como titulares de derechos o intereses legítimos colectivos.",
      "c) los que, sin haber iniciado el procedimiento, tengan derechos que puedan resultar afectados por la decisión que en el mismo se adopte.",
      "d) aquellos cuyos intereses legítimos, individuales o colectivos, puedan resultar afectados por la resolución siempre que se personen en el procedimiento durante el trámite de audiencia."
    ],
    "correct": 3
  },
  {
    "question": "5. Las asociaciones y organizaciones representativas de intereses económicos y sociales:",
    "options": [
      "a) Serán titulares de intereses legítimos individuales y colectivos en los términos que reglamentariamente se establezca.",
      "b) Serán titulares de intereses legítimos individuales y colectivos.",
      "c) No serán titulares de intereses legítimos colectivos.",
      "d) Serán titulares de intereses legítimos colectivos en los términos que la Ley reconozca."
    ],
    "correct": 3
  },
  {
    "question": "6. Cuando la condición de interesado derivase de alguna relación jurídica transmisible el derecho-habiente sucederá en tal condición:",
    "options": [
      "a) Si el procedimiento no ha alcanzado la fase de instrucción.",
      "b) Si el procedimiento no ha alcanzado el trámite de audiencia.",
      "c) Si el procedimiento no ha alcanzado el trámite de información pública.",
      "d) Cualquiera que sea el estado del procedimiento."
    ],
    "correct": 3
  },
  {
    "question": "7. Los menores incapacitados, cuando la extensión de la incapacitación afecte al ejercicio y defensa de los derechos o intereses de que se trate:",
    "options": [
      "a) Tienen capacidad de obrar limitada.",
      "b) Pueden actuar sin la asistencia de la persona que ejerza la patria potestad, tutela o curatela.",
      "c) No tienen capacidad de obrar.",
      "d) Ninguna es correcta."
    ],
    "correct": 2
  },
  {
    "question": "8. Los interesados con capacidad de obrar podrán actuar por medio de representante:",
    "options": [
      "a) Entendiéndose con éste las actuaciones administrativas, salvo manifestación expresa o tácita en contra del interesado.",
      "b) Entendiéndose con el interesado las actuaciones administrativas, salvo manifestación expresa en contra del interesado.",
      "c) Entendiéndose con éste las actuaciones administrativas, salvo manifestación expresa en contra del interesado.",
      "d) Entendiéndose con el interesado las actuaciones administrativas, salvo manifestación expresa o tácita en contra del interesado."
    ],
    "correct": 2
  },
  {
    "question": "9. Se presumirá la representación para:",
    "options": [
      "a) Formular solicitudes.",
      "b) Los actos y gestiones de mero trámite.",
      "c) Interponer recursos.",
      "d) Renunciar a derechos en nombre de otra persona."
    ],
    "correct": 1
  },
  {
    "question": "10. La representación podrá acreditarse:",
    "options": [
      "a) Mediante cualquier título jurídico.",
      "b) Mediante resolución judicial.",
      "c) Mediante poder notarial, únicamente.",
      "d) Mediante cualquier medio válido en Derecho que deje constancia fidedigna de su existencia."
    ],
    "correct": 3
  },
  {
    "question": "11. Según el artículo 4 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ¿se puede considerar como “interesado” a una asociación?:",
    "options": [
      "a) No, en ningún caso.",
      "b) Sí, siempre que represente intereses subjetivos de una colectividad.",
      "c) Sí, siempre que represente intereses legítimos colectivos.",
      "d) Sí, siempre que represente intereses legítimos individuales o colectivos."
    ],
    "correct": 3
  },
  {
    "question": "12. Se entenderá acreditada la representación realizada:",
    "options": [
      "a) Mediante apoderamiento apud acta efectuado por comparecencia personal.",
      "b) Mediante apoderamiento apud acta efectuado por comparecencia electrónica en la correspondiente sede electrónica.",
      "c) A través de la acreditación de su inscripción en el registro electrónico de apoderamientos de la Administración Pública competente.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "13. La falta o insuficiente acreditación de la representación no impedirá que se tenga por realizado el acto de que se trate, siempre que se aporte aquélla o se subsane el defecto dentro del plazo de ……… días o de un plazo superior cuando las circunstancias del caso así lo requieran:",
    "options": [
      "a) 5.",
      "b) 10.",
      "c) 15.",
      "d) 20."
    ],
    "correct": 1
  },
  {
    "question": "14. En el registro electrónico general de apoderamientos, deberán inscribirse, al menos, los de carácter general otorgados por quien ostente la condición de interesado en un procedimiento administrativo a favor de representante:",
    "options": [
      "a) Apud acta.",
      "b) Presencialmente.",
      "c) Electronicamente.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "15. Respecto a los registros electrónicos de apoderamientos no es correcto:",
    "options": [
      "a) En el ámbito estatal, este registro será el Registro Electrónico de Apoderamientos de la Administración General del Estado.",
      "b) En ellos no constará el bastanteo realizado del poder.",
      "c) Los registros generales de apoderamientos no impedirán la existencia de registros particulares en cada Organismo.",
      "d) Cada Organismo podrá disponer de su propio registro electrónico de apoderamientos."
    ],
    "correct": 1
  },
  {
    "question": "16. Los asientos que se realicen en los registros electrónicos generales y particulares de apoderamientos deberán contener, al menos: (señala la incorrecta)",
    "options": [
      "a) Nombre y apellidos o la denominación o razón social, documento nacional de identidad, número de identificación fiscal o documento equivalente del poderdante y del apoderado.",
      "b) Causas de anulación del apoderamiento.",
      "c) Período de tiempo por el cual se otorga el poder.",
      "d) Tipo de poder según las facultades que otorgue."
    ],
    "correct": 1
  },
  {
    "question": "17. Respecto a los poderes que se inscriban en los registros electrónicos generales y particulares de apoderamientos pueden ser:",
    "options": [
      "a) Un poder general para que el apoderado pueda actuar en nombre del poderdante en cualquier actuación administrativa y ante cualquier Administración.",
      "b) Un poder para que el apoderado pueda actuar en nombre del poderdante en cualquier actuación administrativa ante una Administración u Organismo concreto.",
      "c) Un poder para que el apoderado pueda actuar en nombre del poderdante únicamente para la realización de determinados trámites especificados en el poder.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "18. Señala la correcta:",
    "options": [
      "a) La falta o insuficiente acreditación de la representación impedirá que se tenga por realizado el acto de que se trate.",
      "b) El documento electrónico que acredite el resultado de la consulta al registro electrónico de apoderamientos correspondiente tendrá la condición de acreditación a estos efectos.",
      "c) Los registros electrónicos generales y particulares de apoderamientos pertenecientes a todas y cada una de las Administraciones, serán preferiblemente interoperables entre sí.",
      "d) El interesado no podrá comparecer por sí mismo en un procedimiento en el que haya designado representante."
    ],
    "correct": 1
  },
  {
    "question": "19. Los poderes inscritos en los registros electrónicos generales y particulares de apoderamientos tendrán una validez determinada y máxima y:",
    "options": [
      "a) En todo caso caso, en cualquier momento antes de la finalización del plazo, el poderdante podrá revocar o prorrogar el poder.",
      "b) En todo caso caso, en cualquier momento antes de la finalización del plazo, el apoderado podrá revocar o prorrogar el poder.",
      "c) En todo caso caso, en cualquier momento antes de la finalización del plazo tanto el apoderado como el poderdante podrá revocar o prorrogar el poder.",
      "d) En todo caso caso, 2 meses antes de la finalización del plazo el apoderado podrá revocar o prorrogar el poder."
    ],
    "correct": 0
  },
  {
    "question": "20. Cuando en una solicitud, escrito o comunicación figuren varios interesados, las actuaciones a que den lugar se efectuarán con:",
    "options": [
      "a) El representante o el interesado que expresamente hayan señalado, y, en su defecto, con el que figure en primer término.",
      "b) Cualquiera de los interesados indistintamente.",
      "c) El que figure en primer término, y en su defecto, con el que figure en segundo lugar.",
      "d) Con todos y cada uno de los interesados."
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
