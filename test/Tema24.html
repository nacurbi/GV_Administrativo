<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 1 Organización Territorial del Estado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 10px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn, #finalizar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover, #finalizar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .resultados-finales-container {
            text-align: center;
        }
        .resultados-finales-texto {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .resultados-finales-correctas {
            color: #155724;
            font-weight: bold;
        }
        .resultados-finales-incorrectas {
            color: #721c24;
            font-weight: bold;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test" style="text-align: justify;"><strong>TEMA 24. ESTATUTO DE AUTONOMÍA:</strong> Organización Territorial del Estado</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
            <div id="resultados-finales" class="hidden resultados-finales-container">
                <h2>Resultados Finales</h2>
                <div id="resultados-texto" class="resultados-finales-texto"></div>
            </div>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
            <button id="finalizar-btn" class="comprobar-btn" style="width: 100%; margin-top: 20px;">Finalizar Test</button>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. La organización territorial diseñada por la Constitución se caracteriza fundamentalmente porque:",
    "options": [
      "a) El Estado se estructura en municipios, provincias y comunidades autónomas, todas ellas dotadas de autonomía para la gestión de sus respectivos intereses.",
      "b) Los municipios y provincias carecen de autonomía propia y actúan únicamente como órganos desconcentrados de la Administración estatal.",
      "c) Las provincias son entidades subordinadas a las comunidades autónomas y dependen de estas para ejercer sus competencias.",
      "d) La autonomía territorial solo se reconoce a las comunidades autónomas constituidas mediante procedimientos especiales."
    ],
    "correct": 0
  },
  {
    "question": "2. En relación con el principio de solidaridad territorial, puede afirmarse que:",
    "options": [
      "a) Permite establecer diferencias económicas permanentes entre territorios cuando existan razones históricas que las justifiquen.",
      "b) Obliga al Estado a garantizar un equilibrio económico adecuado y justo entre las distintas partes del territorio español.",
      "c) Impide que las comunidades autónomas desarrollen políticas económicas propias adaptadas a sus necesidades.",
      "d) Ninguna de las respuestas es correcta."
    ],
    "correct": 1
  },
  {
    "question": "3. Señale la respuesta incorrecta respecto de los Estatutos de Autonomía.",
    "options": [
      "a) Constituyen la norma institucional básica de cada comunidad autónoma dentro del marco constitucional.",
      "b) Deben contener, entre otros aspectos, la delimitación territorial y las competencias asumidas.",
      "c) Pueden reformarse mediante acuerdo de la comunidad autónoma afectada.",
      "d) Forman parte integrante del ordenamiento jurídico reconocido y amparado por el Estado."
    ],
    "correct": 2
  },
  {
    "question": "4. La igualdad de derechos y obligaciones de los españoles en todo el territorio nacional implica que:",
    "options": [
      "a) Ninguna Comunidad Autónoma puede adoptar medidas que obstaculicen la libre circulación de personas o bienes.",
      "b) Cada comunidad autónoma puede restringir el establecimiento de ciudadanos procedentes de otras partes de la Unión Europea.",
      "c) Los derechos fundamentales pueden variar según el territorio de residencia.",
      "d) Solo el Estado está obligado a respetar la libertad de circulación dentro del territorio nacional."
    ],
    "correct": 0
  },
  {
    "question": "5. En relación con el municipio como entidad territorial básica:",
    "options": [
      "a) Su personalidad jurídica depende de lo dispuesto por cada comunidad autónoma.",
      "b) Constituye el cauce inmediato de participación ciudadana en los asuntos públicos locales.",
      "c) Dispone de autonomía garantizada en la CE, según la cual actúa con personalidad jurídica propia.",
      "d) Está gobernado exclusivamente por el alcalde y el pleno del Ayuntamiento."
    ],
    "correct": 1
  },
  {
    "question": "6. Señale la respuesta incorrecta sobre la provincia.",
    "options": [
      "a) Tiene personalidad jurídica propia.",
      "b) Está determinada por la agrupación de municipios.",
      "c) Su gobierno y administración autónoma pueden corresponder a diputaciones u otras corporaciones representativas, como cabildos y consejos.",
      "d) Su ámbito territorial no puede modificarse libremente por decisión de las comunidades autónomas afectadas."
    ],
    "correct": 2
  },
  {
    "question": "7. Respecto de las islas integradas en los archipiélagos españoles:",
    "options": [
      "a) Carecen de administración propia diferenciada.",
      "b) Están administradas exclusivamente por la Administración General del Estado.",
      "c) Disponen de instituciones propias de gobierno y administración adaptadas a su realidad insular.",
      "d) Ninguna de las respuestas es correcta."
    ],
    "correct": 2
  },
  {
    "question": "8. Entre los órganos necesarios de la organización municipal se encuentran:",
    "options": [
      "a) El alcalde, los tenientes de alcalde, el pleno y la comisión especial de cuentas.",
      "b) El alcalde, el consejo insular y la junta electoral municipal.",
      "c) El pleno, el delegado del Gobierno y la comisión de coordinación autonómica.",
      "d) El alcalde y los concejales exclusivamente, sin otros órganos obligatorios."
    ],
    "correct": 0
  },
  {
    "question": "9. El modelo autonómico instaurado por la Constitución de 1978 supone que:",
    "options": [
      "a) Las regiones históricas mantienen únicamente funciones culturales sin capacidad política efectiva.",
      "b) El poder territorial permanece plenamente centralizado en los órganos estatales.",
      "c) Se reconoce el derecho a la autonomía de nacionalidades y regiones dentro de la unidad de la nación española.",
      "d) Todas son correctas."
    ],
    "correct": 2
  },
  {
    "question": "10. Las materias no atribuidas expresamente al Estado por la Constitución:",
    "options": [
      "a) Pueden corresponder a las comunidades autónomas conforme a sus respectivos Estatutos de Autonomía.",
      "b) Son necesariamente competencia exclusiva del Estado.",
      "c) Deben ser gestionadas siempre de manera compartida entre Estado y comunidades autónomas.",
      "d) Quedan excluidas de cualquier regulación jurídica."
    ],
    "correct": 0
  },
  {
    "question": "11. La diferencia esencial entre las dos vías ordinarias de acceso a la autonomía previstas inicialmente en la Constitución radicaba en que:",
    "options": [
      "a) Una permitía asumir desde el inicio el máximo nivel competencial y la otra preveía una asunción progresiva.",
      "b) Una estaba reservada exclusivamente a territorios insulares y la otra a territorios peninsulares.",
      "c) Ambas otorgaban idéntico nivel competencial desde el primer momento.",
      "d) Ninguna de las respuestas es correcta."
    ],
    "correct": 0
  },
  {
    "question": "12. Señale la respuesta incorrecta sobre las facultades atribuidas a las Cortes Generales por motivos de interés nacional.",
    "options": [
      "a) Pueden autorizar la constitución de una comunidad autónoma de ámbito provincial en determinados supuestos.",
      "b) Pueden acordar un Estatuto de Autonomía para territorios no integrados en la organización provincial.",
      "c) Pueden sustituir determinadas iniciativas de las corporaciones locales en el proceso autonómico.",
      "d) Pueden autorizar la federación de varias comunidades autónomas."
    ],
    "correct": 3
  },
  {
    "question": "13. En materia de relaciones entre comunidades autónomas:",
    "options": [
      "a) Los convenios de colaboración entre CCAA requerirán autorización de las Cortes Generales.",
      "b) Los acuerdos de cooperación entre CCAA deben ser comunicados a las Cortes Generales.",
      "c) Los Estatutos pueden prever la celebración de convenios para la gestión y prestación de servicios propios.",
      "d) Ninguna de las respuestas es correcta."
    ],
    "correct": 2
  },
  {
    "question": "14. El proyecto de Estatuto de Autonomía debe elaborarse inicialmente por:",
    "options": [
      "a) Una comisión designada por las Cortes Generales.",
      "b) Una asamblea formada por representantes provinciales y parlamentarios elegidos en los territorios afectados.",
      "c) El Senado mediante una ponencia específica de carácter territorial.",
      "d) El Congreso en colaboración con las entidades locales interesadas."
    ],
    "correct": 1
  },
  {
    "question": "15. La figura del Delegado del Gobierno en una comunidad autónoma tiene como función principal:",
    "options": [
      "a) Ostentar la representación ordinaria del Estado ante la CCAA.",
      "b) Dirigir la Administración del Estado en el territorio autonómico y coordinarla cuando proceda con la administración propia.",
      "c) Sustituir al presidente autonómico en situaciones excepcionales.",
      "d) Ostentar la alta representación de la CCAA ante el Estado."
    ],
    "correct": 1
  },
  {
    "question": "16. Señale la respuesta incorrecta respecto de las medidas previstas cuando una comunidad autónoma incumple gravemente sus obligaciones constitucionales.",
    "options": [
      "a) Requieren un requerimiento previo al presidente de la comunidad autónoma afectada.",
      "b) Exigen la aprobación por mayoría absoluta del Senado.",
      "c) Permiten adoptar medidas para garantizar el cumplimiento forzoso de las obligaciones incumplidas.",
      "d) Pueden aplicarse por el Gobierno con la aprobación por la mayoría absoluta del Congreso."
    ],
    "correct": 3
  },
  {
    "question": "17. La autonomía financiera de las comunidades autónomas debe ejercerse:",
    "options": [
      "a) Con plena independencia respecto de la Hacienda estatal y sin limitación alguna.",
      "b) Conforme a los principios de coordinación con la Hacienda estatal y de solidaridad entre todos los españoles.",
      "c) Exclusivamente bajo las instrucciones directas del Ministerio de Hacienda.",
      "d) Ninguna de las respuestas es correcta."
    ],
    "correct": 1
  },
  {
    "question": "18. Entre los recursos de las comunidades autónomas pueden encontrarse:",
    "options": [
      "a) Impuestos cedidos total o parcialmente por el Estado y participaciones en ingresos estatales.",
      "b) Impuestos, tasas y contribuciones especiales propios.",
      "c) Rendimientos patrimoniales, ingresos de derecho privado y operaciones de crédito.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "19. Las comunidades autónomas, en el ejercicio de sus competencias financieras:",
    "options": [
      "a) Pueden establecer tributos sobre bienes situados fuera de su territorio cuando exista reciprocidad.",
      "b) Pueden adoptar medidas que graven la libre circulación de mercancías y servicios por razones presupuestarias.",
      "c) Están sometidas a determinadas limitaciones para evitar obstáculos a la unidad económica del territorio nacional.",
      "d) Pueden gravar libremente cualquier actividad económica desarrollada fuera de su ámbito territorial."
    ],
    "correct": 2
  },
  {
    "question": "20. El Fondo de Compensación tiene como finalidad esencial:",
    "options": [
      "a) Financiar gastos corrientes de las entidades locales y las CCAA.",
      "b) Corregir desequilibrios económicos interterritoriales y reforzar el principio de solidaridad.",
      "c) Sustituir completamente la financiación ordinaria de las comunidades autónomas.",
      "d) Ninguna de las respuestas es correcta."
    ],
    "correct": 1
  },
  {
    "question": "21. Señale la respuesta incorrecta acerca de la posición constitucional de las comunidades autónomas.",
    "options": [
      "a) Su autonomía se reconoce dentro de la unidad e indivisibilidad de la Nación española.",
      "b) Disponen de un Estatuto de Autonomía como norma institucional básica.",
      "c) Pueden asumir competencias dentro de los límites establecidos por la Constitución.",
      "d) Poseen constitucionalmente reconocido el derecho a federarse entre sí para constituir nuevas entidades territoriales."
    ],
    "correct": 3
  },
  {
    "question": "22. La aprobación de una reforma estatutaria exige:",
    "options": [
      "a) Únicamente la aprobación mediante referéndum de la comunidad autónoma correspondiente.",
      "b) El acuerdo de las Cortes Generales mediante ley ordinaria.",
      "c) Llevar a cabo el procedimiento previsto en el Estatuto y la aprobación final mediante ley orgánica estatal.",
      "d) Todas son correctas."
    ],
    "correct": 2
  },
  {
    "question": "23. En relación con las diferencias existentes entre los distintos Estatutos de Autonomía:",
    "options": [
      "a) Deben traducirse necesariamente en ventajas económicas para los territorios históricos.",
      "b) Pueden implicar privilegios sociales cuando exista una justificación cultural suficiente.",
      "c) No pueden implicar en ningún caso privilegios económicos o sociales.",
      "d) Solo pueden afectar a cuestiones de naturaleza financiera."
    ],
    "correct": 2
  },
  {
    "question": "24. La Constitución contempla que los Presupuestos Generales del Estado puedan establecer asignaciones a las comunidades autónomas:",
    "options": [
      "a) Atendiendo al volumen de servicios y actividades estatales asumidos por cada una de ellas.",
      "b) Con el objetivo de garantizar un nivel mínimo en la prestación de los servicios públicos fundamentales.",
      "c) Como instrumento de equilibrio y cohesión territorial dentro del Estado autonómico.",
      "d) Todas son correctas."
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.resultadosFinales.classList.add('hidden');
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');
                DOM.finalizarBtn.textContent = 'Finalizar Test';

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function mostrarResultados() {
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                // Recalcular el recuento total acumulado
                let correctas = 0;
                let incorrectas = 0;
                preguntas.forEach(p => {
                    if (p.comprobada) {
                        if (p.esCorrecta) correctas++;
                        else incorrectas++;
                    }
                });

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${correctas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${incorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function toggleFinalizarTest() {
                if (DOM.resultadosFinales.classList.contains('hidden')) {
                    mostrarResultados();
                } else {
                    mostrarPregunta();
                }
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, finalizar test, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
