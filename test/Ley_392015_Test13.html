<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley_392015_Test13</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>LEY 39/2015, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN:</strong> Test 13</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. Los actos de las Administraciones Públicas sujetos al Derecho Administrativo serán inmediatamente ejecutivos, salvo que (señala la incorrecta):",
    "options": [
      "a) Se produzca la suspensión de la ejecución del acto.",
      "b) Se trate de una resolución de un procedimiento de naturaleza sancionadora contra la que quepa algún recurso en vía administrativa, salvo el potestativo de reposición.",
      "c) Una disposición establezca lo contrario.",
      "d) Se necesite aprobación o autorización superior."
    ],
    "correct": 1
  },
  {
    "question": "2. Cuando de una resolución administrativa nazca una obligación de pago derivada de una sanción pecuniaria, multa o cualquier otro derecho que haya de abonarse a la Hacienda pública, éste se efectuará preferentemente, salvo que se justifique la imposibilidad de hacerlo, utilizando:",
    "options": [
      "a) Tarjeta de crédito y débito.",
      "b) Transferencia bancaria o domiciliación bancaria.",
      "c) Cualesquiera que se autoricen por el órgano competente en materia de Hacienda Pública.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "3. Las Administraciones Públicas, a través de sus órganos competentes en cada caso, podrán proceder previo apercibimiento, a la ejecución forzosa de los actos administrativos salvo:",
    "options": [
      "a) En los supuestos en que se suspenda la ejecución de acuerdo con la Ley.",
      "b) Cuando la Constitución exija la intervención de un órgano judicial.",
      "c) Cuando la Ley exija la intervención de un órgano judicial.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "4. La ejecución forzosa por las Administraciones Públicas se efectuará, respetando siempre el principio de proporcionalidad, por los siguientes medios (señala la correcta):",
    "options": [
      "a) Apremio sobre el patrimonio.",
      "b) Ejecución coercitiva.",
      "c) Multa subsidiaria.",
      "d) Compulsión sobre el patrimonio."
    ],
    "correct": 0
  },
  {
    "question": "5. Si fueran varios los medios de ejecución admisibles se elegirá:",
    "options": [
      "a) El que decida el afectado.",
      "b) El que decida el órgano administrativo competente.",
      "c) El que se pueda llevar a cabo con mayor rapidez.",
      "d) El menos restrictivo de la libertad individual."
    ],
    "correct": 3
  },
  {
    "question": "6. Si para la ejecución forzosa fuese necesario entrar en el domicilio del afectado o en los restantes lugares que requieran la autorización de su titular las Administraciones Públicas:",
    "options": [
      "a) Deberán obtener el consentimiento del afectado.",
      "b) Deberán obtener la oportuna autorización judicial.",
      "c) Deberán obtener el consentimiento del afectado y obtener la oportuna autorización judicial.",
      "d) Deberán obtener el consentimiento del afectado u obtener la oportuna autorización judicial."
    ],
    "correct": 3
  },
  {
    "question": "7. Si en virtud de acto administrativo hubiera de satisfacerse cantidad líquida:",
    "options": [
      "a) Se seguirá el procedimiento previsto en las normas reguladoras del procedimiento de apremio.",
      "b) Habrá lugar a la ejecución subsidiaria.",
      "c) Podrá ser ejecutado por compulsión directa sobre las personas.",
      "d) Podrán imponerse multas coercitivas, reiteradas por lapsos de tiempo."
    ],
    "correct": 0
  },
  {
    "question": "8. No podrá imponerse a los administrados una obligación pecuniaria que no estuviese establecida con arreglo a:",
    "options": [
      "a) Una Ley.",
      "b) Una norma de rango legal.",
      "c) Una norma reglamentaria.",
      "d) Una norma de rango legal o reglamentaria."
    ],
    "correct": 1
  },
  {
    "question": "9. Habrá lugar a la ejecución subsidiaria cuando se trate de actos que:",
    "options": [
      "a) Por ser personalísimos puedan ser realizados por sujeto distinto del obligado.",
      "b) Por no ser personalísimos no puedan ser realizados por sujeto distinto del obligado.",
      "c) Por no ser personalísimos puedan ser realizados por sujeto distinto del obligado.",
      "d) Por ser personalísimos no puedan ser realizados por sujeto distinto del obligado."
    ],
    "correct": 2
  },
  {
    "question": "10. Cuando haya lugar a la ejecución subsidiaria las Administraciones Públicas realizarán el acto:",
    "options": [
      "a) A través de las personas que determinen, a costa del obligado.",
      "b) Por sí, a costa del obligado.",
      "c) Por sí, a costa de las personas que determinen.",
      "d) Por sí o a través de las personas que determinen, a costa del obligado."
    ],
    "correct": 3
  },
  {
    "question": "11. En la ejecución subsidiaria el importe de los gastos, daños y perjuicios:",
    "options": [
      "a) Podrá liquidarse de forma provisional y realizarse antes de la ejecución, a reserva de la liquidación definitiva.",
      "b) No podrá liquidarse de forma provisional ni realizarse antes de la ejecución, a reserva de la liquidación definitiva.",
      "c) Podrá liquidarse de forma provisional pero no podrá realizarse antes de la ejecución, a reserva de la liquidación definitiva.",
      "d) No podrá liquidarse de forma provisional pero podrá realizarse antes de la ejecución, a reserva de la liquidación definitiva."
    ],
    "correct": 0
  },
  {
    "question": "12. Cuando así lo autoricen las Leyes, y en la forma y cuantía que éstas determinen, las Administraciones Públicas pueden, para la ejecución de determinados actos, imponer multas coercitivas, reiteradas por lapsos de tiempo que sean suficientes para cumplir lo ordenado, en los siguientes supuestos (señala la incorrecta):",
    "options": [
      "a) Actos personalísimos en que no proceda la compulsión directa sobre la persona del obligado.",
      "b) Actos en que, procediendo la compulsión, la Administración no la estimara conveniente.",
      "c) Actos cuya ejecución no pueda el obligado encargar a otra persona.",
      "d) Todas son correctas."
    ],
    "correct": 2
  },
  {
    "question": "13. La multa coercitiva es:",
    "options": [
      "a) Dependiente de las sanciones que puedan imponerse con tal carácter e incompatible con ellas.",
      "b) Independiente de las sanciones que puedan imponerse con tal carácter y compatible con ellas.",
      "c) Dependiente de las sanciones que puedan imponerse con tal carácter y compatible con ellas.",
      "d) Independiente de las sanciones que puedan imponerse con tal carácter e incompatible con ellas."
    ],
    "correct": 1
  },
  {
    "question": "14. Podrán ser ejecutados por compulsión directa sobre las personas:",
    "options": [
      "a) Los actos administrativos que impongan una obligación personalísima de no hacer o soportar.",
      "b) Los actos administrativos que impongan una obligación personalísima de hacer o soportar.",
      "c) Los actos administrativos que impongan una obligación personalísima de hacer o no soportar.",
      "d) Los actos administrativos que impongan una obligación personalísima de no hacer o no soportar."
    ],
    "correct": 0
  },
  {
    "question": "15. Un acto administrativo podrá ser ejecutado por compulsión directa sobre las personas:",
    "options": [
      "a) En los casos en que la ley expresamente lo autorice.",
      "b) Dentro siempre del respeto debido a su dignidad.",
      "c) Dentro siempre del respeto debido a los derechos reconocidos en la Constitución.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "16. El obligado deberá resarcir los daños y perjuicios, a cuya liquidación y cobro se procederá en vía administrativa si, tratándose de:",
    "options": [
      "a) Obligaciones personalísimas de no hacer, se realizase la prestación.",
      "b) Obligaciones personalísimas de hacer, se realizase la prestación.",
      "c) Obligaciones personalísimas de hacer, no se realizase la prestación.",
      "d) Obligaciones personalísimas de no hacer, no se realizase la prestación."
    ],
    "correct": 2
  },
  {
    "question": "17. Las acciones posesorias contra las actuaciones de los órganos administrativos realizadas en materia de su competencia y de acuerdo con el procedimiento legalmente establecido:",
    "options": [
      "a) En ningún caso se admitirán a trámite.",
      "b) Excepcionalmente podrán admitirse a trámite.",
      "c) Se admitirán a trámite como regla general.",
      "d) Se admitirán a trámite en todo caso."
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
