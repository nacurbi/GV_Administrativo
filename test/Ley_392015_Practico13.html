<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley_392015_Practico13</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>LEY 39/2015 · TEST PRÁCTICO 13</strong></p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <details class="supuesto hidden" id="supuesto" open><summary>Supuesto práctico</summary><div id="supuesto-texto"></div></details>
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="referencia hidden" id="referencia"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const supuestos = ["<p>El Ayuntamiento de Valdemorra tramita un procedimiento para autorizar la instalación de una terraza de gran capacidad en una plaza céntrica.</p><p>La solicitud es presentada electrónicamente por una gestoría en nombre de la empresa solicitante. Al examinar el expediente, el órgano instructor observa que no se ha aportado documento acreditativo de la representación. Además, la memoria técnica contiene deficiencias que obligan a requerir su subsanación.</p><p>Durante la tramitación comparece una asociación vecinal alegando que la instalación afectará al descanso de los residentes. Asimismo, varios interesados presentan escritos a través de distintos registros administrativos.</p><p>La Administración practica diversas notificaciones electrónicas. Uno de los interesados no accede al contenido de la notificación durante varios días, mientras que otro comunica un cambio de dirección electrónica.</p><p>Posteriormente se dicta una resolución parcialmente favorable. Sin embargo, se detectan defectos en la competencia del órgano que la dictó y determinados errores formales en la tramitación. La Administración analiza si los defectos determinan nulidad, anulabilidad o si pueden ser objeto de conservación, conversión o convalidación.</p>"];
            let preguntas = [
  {
    "question": "1. La gestoría presenta la solicitud sin acreditar inicialmente la representación. ¿Qué debe hacer la Administración?",
    "options": [
      "a) Archivar inmediatamente la solicitud",
      "b) Conceder un plazo para subsanar la acreditación de la representación",
      "c) Considerar terminado el procedimiento",
      "d) Declarar la nulidad de todas las actuaciones"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "2. Un vecino cuyos intereses pueden verse afectados solicita intervenir en el procedimiento ya iniciado. ¿Puede adquirir la condición de interesado?",
    "options": [
      "a) No, porque no inició el procedimiento",
      "b) Solo si lo autoriza el Ayuntamiento de Valdemorra",
      "c) Sí, si acredita derechos o intereses legítimos afectados",
      "d) Solo mediante recurso administrativo una vez que haya recaído resolución"
    ],
    "correct": 2,
    "caso": 0
  },
  {
    "question": "3. La empresa presenta documentación un lunes, habiendo sido el último día del plazo marcado por la normativa el sábado inmediatamente anterior. A efectos de cómputo, la presentación se entenderá realizada:",
    "options": [
      "a) Fuera de plazo",
      "b) El sábado a todos los efectos",
      "c) Dentro de plazo",
      "d) Ninguna es correcta"
    ],
    "correct": 2,
    "caso": 0
  },
  {
    "question": "4. Cuando se requiere una subsanación de documentos al interesado:",
    "options": [
      "a) La Administración debe resolver sin esperar respuesta",
      "b) El interesado dispone del plazo legal para corregir los defectos",
      "c) El procedimiento queda automáticamente suspendido",
      "d) La solicitud debe entenderse desestimada por falta de documentos"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "5. La asociación vecinal fundamenta su intervención en intereses colectivos. La Ley 39/2015:",
    "options": [
      "a) Impide siempre su participación",
      "b) Permite su intervención cuando ostente intereses legítimos",
      "c) Solo reconoce intereses individuales",
      "d) Exige autorización administrativa previa"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "6. La identificación electrónica de una persona tiene por finalidad principal:",
    "options": [
      "a) Acreditar su identidad",
      "b) Acreditar su calidad de representante",
      "c) Sustituir cualquier firma",
      "d) Acreditar su calidad de representado"
    ],
    "correct": 0,
    "caso": 0
  },
  {
    "question": "7. La firma electrónica y la identificación electrónica:",
    "options": [
      "a) Tienen un valor jurídico exactamente igual",
      "b) Siempre permiten manifestar la voluntad y consentimiento del interesado",
      "c) Solo pueden usarlas las personas físicas",
      "d) Siempre permiten autenticarse ante las Administraciones Públicas"
    ],
    "correct": 3,
    "caso": 0
  },
  {
    "question": "8. Una persona jurídica presenta documentación en papel pese a estar obligada a relacionarse electrónicamente. La Administración:",
    "options": [
      "a) Debe admitirla sin más problemas",
      "b) Debe requerir su presentación por vía electrónica",
      "c) Debe destruir la documentación",
      "d) Debe archivar el expediente"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "9. ¿Cuál es la regla general para el cómputo de plazos expresados en días?",
    "options": [
      "a) Se computan días naturales si no se dice nada",
      "b) Se computan días hábiles salvo disposición expresa en contrario",
      "c) Se excluyen únicamente domingos y festivos",
      "d) Se cuentan de fecha a fecha"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "10. Si se ha resuelto el procedimiento y notificado la resolución a los interesados el día 29 de febrero, concediéndoles 1 mes para presentar recurso:",
    "options": [
      "a) El plazo vence el 28 de marzo",
      "b) El plazo vence el 29 de marzo",
      "c) El plazo se puede acortar a la mitad en caso de decretarse la tramitación de urgencia",
      "d) Puede solicitarse prórroga del mismo, que será concedida por la Administración"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "11. A una resolución que limita los derechos de un interesado. ¿Qué exigencia especial suele resultarle aplicable?",
    "options": [
      "a) La notificación en el plazo de 10 días desde que se dictó",
      "b) La motivación del acto",
      "c) La publicación obligatoria en boletín oficial correspondiente",
      "d) La firma manuscrita del órgano competente"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "12. Salvo que en ellos se disponga otra cosa, los actos administrativos se presumen válidos:",
    "options": [
      "a) Desde la fecha en la que se dicten",
      "b) Desde su publicación",
      "c) Cuando lo declaren los mismos actos",
      "d) Únicamente si son favorables"
    ],
    "correct": 0,
    "caso": 0
  },
  {
    "question": "13. Una notificación electrónica no es abierta por el interesado dentro del plazo legalmente establecido. Como regla general:",
    "options": [
      "a) La notificación se dará por realizada",
      "b) La notificación puede entenderse rechazada",
      "c) El plazo anteriormente citado es de 10 días naturales",
      "d) Todas son correctas"
    ],
    "correct": 3,
    "caso": 0
  },
  {
    "question": "14. Un acto es dictado por un órgano manifiestamente incompetente por razón de la materia. Este defecto puede dar lugar a:",
    "options": [
      "a) Una simple irregularidad, subsanable por el órgano realmente competente.",
      "b) La nulidad de pleno derecho",
      "c) La convalidación del acto en determinados casos.",
      "d) La anulabilidad del acto"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "15. Un defecto formal no esencial que no genera indefensión provocará:",
    "options": [
      "a) Nulidad de pleno derecho",
      "b) Anulabilidad",
      "c) Ningún efecto invalidante relevante",
      "d) Caducidad"
    ],
    "correct": 2,
    "caso": 0
  },
  {
    "question": "16. La anulabilidad se caracteriza porque:",
    "options": [
      "a) Todo acto anulable es considerado inexistente",
      "b) Deriva de infracciones distintas de las causas de nulidad de pleno derecho",
      "c) Nunca puede subsanarse",
      "d) El acto produce efectos solo si ha habido desviación de poder"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "17. La conservación de actos y trámites persigue:",
    "options": [
      "a) Subsanar actuaciones válidas",
      "b) Mantener aquellas actuaciones cuyo contenido seguiría siendo válido",
      "c) Repetir íntegramente el procedimiento",
      "d) Convalidar actos nulos"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "18. La conversión de un acto administrativo será posible cuando:",
    "options": [
      "a) Contenga los elementos de otro acto distinto",
      "b) Se convierta un acto anulable, exclusivamente.",
      "c) Se convalide un acto nulo",
      "d) Ninguna es correcta"
    ],
    "correct": 0,
    "caso": 0
  },
  {
    "question": "19. La convalidación puede utilizarse respecto de:",
    "options": [
      "a) Actos en los que se haya incurrido en desviación de poder",
      "b) Actos dictados prescindiendo de las normas que contienen las reglas esenciales para la formación de la voluntad de los órganos colegiados",
      "c) Disposiciones reglamentarias restrictivas de derechos individuales que dispongan su retroactividad",
      "d) Actos dictados como consecuencia de infracción penal"
    ],
    "correct": 0,
    "caso": 0
  },
  {
    "question": "20. La finalidad de la convalidación es:",
    "options": [
      "a) Subsanar los vicios que afectan a determinados actos administrativos",
      "b) Evitar que un acto nulo no despliegue sus efectos",
      "c) Evitar cualquier recurso cuyo fundamento sea un defecto de forma",
      "d) Modificar disposiciones reglamentarias anulables"
    ],
    "correct": 0,
    "caso": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    [].concat(pregunta.correct).forEach(c => toggleClasses(botonesOpciones[c], 'correcta'));

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;
                const sup = document.getElementById('supuesto');
                if (pregunta.caso != null && supuestos[pregunta.caso]) {
                    if (sup.dataset.caso !== String(pregunta.caso)) { document.getElementById('supuesto-texto').innerHTML = supuestos[pregunta.caso]; sup.dataset.caso = pregunta.caso; }
                    sup.classList.remove('hidden');
                } else sup.classList.add('hidden');
                const ref = document.getElementById('referencia');
                ref.textContent = pregunta.ref || '';
                ref.classList.toggle('hidden', !(pregunta.comprobada && pregunta.ref));

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = [].concat(pregunta.correct).includes(pregunta.respuestaUsuario);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();
                if (pregunta.ref) document.getElementById('referencia').classList.remove('hidden');

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
