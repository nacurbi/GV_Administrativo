<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley_392015_Test12</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>LEY 39/2015, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN:</strong> Test 12</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. ¿Cuál de los siguientes derechos se atribuye por la LPAC a los interesados en un procedimiento administrativo?",
    "options": [
      "a) A conocer, en cualquier momento, el estado de la tramitación de los procedimientos en los que tengan la condición de interesados.",
      "b) A conocer el sentido del silencio administrativo que corresponda, en caso de que la Administración no dicte ni notifique resolución expresa en plazo.",
      "c) A conocer el órgano competente para su instrucción, en su caso, y resolución.",
      "d) Todas las anteriores son correctas"
    ],
    "correct": 3
  },
  {
    "question": "2. ¿Cuál de los siguientes derechos no reconoce la LPAC a los interesados en un procedimiento administrativo?",
    "options": [
      "a) A conocer los actos de trámite dictados.",
      "b) A acceder y a obtener los documentos contenidos en los citados procedimientos.",
      "c) A conocer, en cualquier momento, el estado de la tramitación de los procedimientos en los que tengan la condición de interesados.",
      "d) A conocer el sentido del silencio administrativo que corresponda."
    ],
    "correct": 1
  },
  {
    "question": "3. ¿Cuál de los siguientes derechos corresponde, según la LPAC, a los interesados en un procedimiento administrativo?",
    "options": [
      "a) A formular alegaciones, utilizar los medios de defensa admitidos por el Ordenamiento Jurídico y a aportar documentos en cualquier fase del procedimiento, que deberán ser tenidos en cuenta por el órgano competente al redactar la propuesta de resolución.",
      "b) A identificar a las autoridades y al personal al servicio de las Administraciones Públicas.",
      "c) A obtener información y orientación acerca de los requisitos jurídicos o técnicos que las disposiciones vigentes impongan a los proyectos, actuaciones o solicitudes que se propongan realizar.",
      "d) Todos los derechos anteriores corresponden a los interesados."
    ],
    "correct": 2
  },
  {
    "question": "4. ¿Cuál de los siguientes derechos atribuye la LPAC a los interesados en un procedimiento administrativo?",
    "options": [
      "a) A identificar a las autoridades y al personal al servicio de las Administraciones Públicas bajo cuya responsabilidad se tramiten los procedimientos.",
      "b) A actuar asistidos de asesor cuando lo consideren conveniente en defensa de sus intereses.",
      "c) A cumplir las obligaciones de pago a través de los medios electrónicos previstos en el artículo 98.2.",
      "d) Todas las anteriores respuestas son ciertas."
    ],
    "correct": 3
  },
  {
    "question": "5. ¿Cuál de los siguientes derechos no se atribuye por la LPAC a los interesados en un procedimiento administrativo?",
    "options": [
      "a) A no presentar documentos originales salvo que, de manera excepcional, la normativa reguladora aplicable establezca lo contrario.",
      "b) A ejecutar derechos de cobro a través de los medios electrónicos previstos en el artículo 98.2",
      "c) A conocer, en cualquier momento, el estado de la tramitación de los procedimientos en los que tengan la condición de interesados.",
      "d) Todas las anteriores opciones no son derechos de los interesados."
    ],
    "correct": 1
  },
  {
    "question": "6. ¿Cuál de los siguientes derechos es enunciado como específico en la LPAC para los presuntos responsables en un procedimiento administrativo sancionador?",
    "options": [
      "a) A conocer el sentido del silencio administrativo que corresponda, en caso de que la Administración no dicte ni notifique resolución expresa en plazo.",
      "b) A la presunción de no existencia de responsabilidad administrativa mientras no se demuestre lo contrario.",
      "c) A acceder y a obtener los documentos contenidos en los citados procedimientos.",
      "d) A la presunción de no existencia de responsabilidad disciplinaria o administrativa mientras no se demuestre lo contrario."
    ],
    "correct": 1
  },
  {
    "question": "7. ¿De qué forma/s puede iniciarse el procedimiento administrativo?",
    "options": [
      "a) Exclusivamente de oficio por la Administración competente.",
      "b) De oficio o a solicitud de ciudadano.",
      "c) De oficio o a solicitud del interesado.",
      "d) De oficio por solicitud del ciudadano."
    ],
    "correct": 2
  },
  {
    "question": "8. ¿Cuál de los siguientes derechos es enunciado como específico en la LPAC para los presuntos responsables en un procedimiento administrativo sancionador?",
    "options": [
      "a) A no presentar documentos originales salvo que, de manera excepcional, la normativa reguladora aplicable establezca lo contrario.",
      "b) A actuar asistidos de asesor cuando lo consideren conveniente en defensa de sus intereses.",
      "c) A ser notificado de los hechos que se le imputen, de las infracciones que tales hechos puedan constituir y de las sanciones que, en su caso, se les pudieran imponer, así como de la identidad del instructor, de la autoridad competente para imponer la sanción y de la norma que atribuya tal competencia.",
      "d) A cumplir con las obligaciones de pago a través de los medios electrónicos previstos en la normativa."
    ],
    "correct": 2
  },
  {
    "question": "9. ¿Qué objeto tiene la apertura de un período de información o actuaciones previas?",
    "options": [
      "a) Garantizar la resolución de la eficacia que pudiera recaer.",
      "b) Garantizar las circunstancias del caso concreto.",
      "c) Establecer la conveniencia de tomar medidas preventivas.",
      "d) Conocer las circunstancias del caso concreto y la conveniencia o no de iniciar el procedimiento"
    ],
    "correct": 3
  },
  {
    "question": "10. ¿Qué órgano puede abrir un período de información o actuaciones previas?",
    "options": [
      "a) El competente.",
      "b) El instructor.",
      "c) El superior jerárquico del instructor.",
      "d) El órgano colegiado superior de la entidad."
    ],
    "correct": 0
  },
  {
    "question": "11. Según la LPAC, las medidas provisionales antes de iniciar el procedimiento se podrán adoptar:",
    "options": [
      "a) Sólo de oficio.",
      "b) Sólo a instancia de parte.",
      "c) De oficio o a instancia de parte, y siempre de forma motivada.",
      "d) Siempre de oficio."
    ],
    "correct": 2
  },
  {
    "question": "12. ¿Qué objeto tiene la apertura de un período de actuaciones previas en los procedimientos de naturaleza sancionadora?",
    "options": [
      "a) Determinar con la mayor precisión posible, los hechos susceptibles de motivar la incoación del procedimiento, la identificación de la persona o personas culpables y las circunstancias relevantes que concurran en unos y otros.",
      "b) Garantizar las circunstancias del caso concreto.",
      "c) Determinar con la mayor precisión posible, los hechos susceptibles de motivar la incoación del procedimiento, la identificación de la persona o personas que pudieran resultar responsables y las circunstancias relevantes que concurran en unos y otros.",
      "d) Conocer las circunstancias del caso concreto y la conveniencia o no de iniciar el procedimiento."
    ],
    "correct": 2
  },
  {
    "question": "13. ¿Qué órgano/s puede/n realizar las actuaciones previas al inicio de un procedimiento administrativo?",
    "options": [
      "a) Los que tengan atribuidas funciones de investigación, averiguación e inspección en la materia y, en defecto de éstos, por la persona u órgano administrativo que se determine por el órgano competente para la iniciación o resolución del procedimiento.",
      "b) El instructor.",
      "c) Los que tengan atribuidas funciones de instrucción y ordenación sobre la materia y, en defecto de estos, por la persona u órgano administrativo que se determine legalmente para la iniciación o resolución.",
      "d) El competente por razón del territorio."
    ],
    "correct": 0
  },
  {
    "question": "14. Señala la LPAC, al listar las potenciales medidas provisionales que pudieran acordarse para garantizar la eficacia de la resolución que pudiera recaer, que las mismas podrán acordarse conforme a la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil. Entre las mismas se encuentra:",
    "options": [
      "a) La prestación de fianzas.",
      "b) La intervención y depósito de ingresos obtenidos mediante una actividad que se considere ilícita y cuya prohibición o cesación se pretenda.",
      "c) La retención de ingresos a cuenta que deban abonar las Administraciones Públicas.",
      "d) Todas las anteriores respuestas son ciertas."
    ],
    "correct": 3
  },
  {
    "question": "15. Establece la LPAC, al hablar de las medidas provisionales, la vinculación entre las mismas, cuando se toman antes de la iniciación del procedimiento, y dicho inicio. ¿Qué sucede si no se inicia el procedimiento en el plazo de quince días tasado?",
    "options": [
      "a) Que las medidas provisionales se mantendrán hasta la finalización del procedimiento.",
      "b) Que las medidas provisionales podrán ser levantadas, modificadas o suprimidas de oficio.",
      "c) Que las medidas provisionales quedarán sin efecto.",
      "d) Que las medidas provisionales no podrán adoptarse."
    ],
    "correct": 2
  },
  {
    "question": "16. ¿Cuándo deberá efectuarse el acuerdo de iniciación del procedimiento, cuando se hayan adoptado medidas provisionales antes de su inicio?",
    "options": [
      "a) Dentro de los 15 días naturales siguientes a su adopción.",
      "b) Dentro de los 20 días siguientes a su adopción.",
      "c) Dentro de los 15 días siguientes a su adopción.",
      "d) Dentro de 30 días siguientes a su adopción."
    ],
    "correct": 2
  },
  {
    "question": "17. Según la LPAC es falso que, cuando surjan circunstancias sobrevenidas o que no pudieron ser tenidas en cuenta en el momento de su adopción:",
    "options": [
      "a) Las medidas provisionales podrán ser confirmadas.",
      "b) Las medidas provisionales podrán ser alzadas.",
      "c) Las medidas provisionales podrán ser modificadas.",
      "d) Todas las respuestas son ciertas."
    ],
    "correct": 0
  },
  {
    "question": "18. ¿A quién corresponde adoptar medidas provisionales antes de la iniciación del procedimiento, según la LPAC?",
    "options": [
      "a) Al órgano competente para iniciar o instruir el procedimiento.",
      "b) Al superior jerárquico del órgano competente para resolverlo.",
      "c) Al órgano administrativo competente para resolverlo.",
      "d) Al superior jerárquico del instructor del procedimiento."
    ],
    "correct": 0
  },
  {
    "question": "19. Las medidas provisionales que se adopten antes de la iniciación del procedimiento, a tenor de lo señalado en la LPAC:",
    "options": [
      "a) Deberán ser confirmadas, siempre.",
      "b) Deberán ser modificadas, siempre.",
      "c) Deberán ser levantadas, siempre.",
      "d) Ninguna es correcta."
    ],
    "correct": 3
  },
  {
    "question": "20. Señala la LPAC, al listar las potenciales medidas provisionales que pudieran acordarse para garantizar la eficacia de la resolución que pudiera recaer, que las mismas podrán acordarse conforme a la Ley 1/2000, de 7 de enero, de Enjuiciamiento Civil. Entre las mismas se encuentran:",
    "options": [
      "a) La retirada o intervención de bienes productivos o suspensión temporal de servicios por razones de sanidad, higiene o seguridad, el cierre temporal del establecimiento por estas u otras causas previstas en la normativa reguladora aplicable.",
      "b) El embargo preventivo de bienes, rentas y cosas fungibles computables en metálico por aplicación de precios ciertos.",
      "c) Cualesquiera otras medidas que, para la protección de los derechos de los interesados, prevean expresamente las leyes, o que se estimen necesarias para asegurar la efectividad de la resolución.",
      "d) Todas son ciertas, entre otras."
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
