<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley_392015_Practico2</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>LEY 39/2015 · TEST PRÁCTICO 2</strong> (Plazos)</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <details class="supuesto hidden" id="supuesto" open><summary>Supuesto práctico</summary><div id="supuesto-texto"></div></details>
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="referencia hidden" id="referencia"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const supuestos = ["<p>El 3 de marzo de 2026, D. Juan Pérez presenta en el registro electrónico del Ayuntamiento de Alto Prado una solicitud de licencia de obra para su vivienda. La solicitud no incluye firma electrónica válida.</p><p>El 5 de marzo, la Administración detecta el defecto y requiere subsanación, otorgando un plazo de 10 días.</p><p>El interesado accede a la notificación el 12 de marzo.</p><p>El 25 de marzo presenta la subsanación correctamente firmada.</p><p>El procedimiento sigue su curso. El 10 de abril, el concejal de deportes dicta una resolución denegatoria sin motivación suficiente, lo que produce indefensión al interesado. El 14 de abril se pone a disposición en sede electrónicamente la resolución. El interesado no accede al contenido.</p><p>El interesado interpone recurso de reposición el 30 de mayo alegando nulidad de pleno derecho.</p><div class=\"calendarios\"><table class=\"cal\"><caption>mar-26</caption><tr><th>Lu</th><th>Ma</th><th>Mi</th><th>Ju</th><th>Vi</th><th>Sá</th><th>Do</th></tr><tr><td class=\"vacio\"></td><td class=\"vacio\"></td><td class=\"vacio\"></td><td class=\"vacio\"></td><td class=\"vacio\"></td><td class=\"vacio\"></td><td class=\"finde\">1</td></tr><tr><td class=\"\">2</td><td class=\"\">3</td><td class=\"\">4</td><td class=\"\">5</td><td class=\"\">6</td><td class=\"finde\">7</td><td class=\"finde\">8</td></tr><tr><td class=\"\">9</td><td class=\"\">10</td><td class=\"\">11</td><td class=\"\">12</td><td class=\"\">13</td><td class=\"finde\">14</td><td class=\"finde\">15</td></tr><tr><td class=\"\">16</td><td class=\"\">17</td><td class=\"\">18</td><td class=\"\">19</td><td class=\"\">20</td><td class=\"finde\">21</td><td class=\"finde\">22</td></tr><tr><td class=\"\">23</td><td class=\"\">24</td><td class=\"\">25</td><td class=\"\">26</td><td class=\"\">27</td><td class=\"finde\">28</td><td class=\"finde\">29</td></tr><tr><td class=\"\">30</td><td class=\"\">31</td><td class=\"vacio\"></td><td class=\"vacio\"></td><td class=\"vacio\"></td><td class=\"vacio\"></td><td class=\"vacio\"></td></tr></table><table class=\"cal\"><caption>abr-26</caption><tr><th>Lu</th><th>Ma</th><th>Mi</th><th>Ju</th><th>Vi</th><th>Sá</th><th>Do</th></tr><tr><td class=\"vacio\"></td><td class=\"vacio\"></td><td class=\"\">1</td><td class=\"fest\">2</td><td class=\"fest\">3</td><td class=\"finde\">4</td><td class=\"finde\">5</td></tr><tr><td class=\"\">6</td><td class=\"\">7</td><td class=\"\">8</td><td class=\"\">9</td><td class=\"\">10</td><td class=\"finde\">11</td><td class=\"finde\">12</td></tr><tr><td class=\"\">13</td><td class=\"\">14</td><td class=\"\">15</td><td class=\"\">16</td><td class=\"\">17</td><td class=\"finde\">18</td><td class=\"finde\">19</td></tr><tr><td class=\"\">20</td><td class=\"\">21</td><td class=\"\">22</td><td class=\"\">23</td><td class=\"\">24</td><td class=\"finde\">25</td><td class=\"finde\">26</td></tr><tr><td class=\"\">27</td><td class=\"fest\">28</td><td class=\"\">29</td><td class=\"\">30</td><td class=\"vacio\"></td><td class=\"vacio\"></td><td class=\"vacio\"></td></tr></table><table class=\"cal\"><caption>may-26</caption><tr><th>Lu</th><th>Ma</th><th>Mi</th><th>Ju</th><th>Vi</th><th>Sá</th><th>Do</th></tr><tr><td class=\"vacio\"></td><td class=\"vacio\"></td><td class=\"vacio\"></td><td class=\"vacio\"></td><td class=\"fest\">1</td><td class=\"finde\">2</td><td class=\"finde\">3</td></tr><tr><td class=\"\">4</td><td class=\"\">5</td><td class=\"\">6</td><td class=\"\">7</td><td class=\"\">8</td><td class=\"finde\">9</td><td class=\"finde\">10</td></tr><tr><td class=\"\">11</td><td class=\"\">12</td><td class=\"\">13</td><td class=\"\">14</td><td class=\"\">15</td><td class=\"finde\">16</td><td class=\"finde\">17</td></tr><tr><td class=\"\">18</td><td class=\"\">19</td><td class=\"\">20</td><td class=\"\">21</td><td class=\"\">22</td><td class=\"finde\">23</td><td class=\"finde\">24</td></tr><tr><td class=\"\">25</td><td class=\"\">26</td><td class=\"\">27</td><td class=\"\">28</td><td class=\"\">29</td><td class=\"finde\">30</td><td class=\"finde\">31</td></tr></table></div><p class=\"leyenda\"><span class=\"fest\">&nbsp;&nbsp;&nbsp;</span> Festivo</p>"];
            let preguntas = [
  {
    "question": "1. El plazo de subsanación comienza:",
    "options": [
      "a) 5 de marzo",
      "b) 6 de marzo",
      "c) 12 de marzo",
      "d) 13 de marzo"
    ],
    "correct": 3,
    "caso": 0
  },
  {
    "question": "2. El último día de subsanación es:",
    "options": [
      "a) 15 marzo",
      "b) 16 marzo",
      "c) 25 marzo",
      "d) 26 marzo"
    ],
    "correct": 3,
    "caso": 0
  },
  {
    "question": "3. La subsanación el 25 de marzo es:",
    "options": [
      "a) Correcta, porque aunque está fuera de plazo, al ser electrónica, se entiende presentada la solicitud el mismo día de la subsanación",
      "b) Correcta y en plazo",
      "c) Fuera de plazo, supone el desistimiento del interesado",
      "d) Correcta, la Administración siempre aceptará de plano la subsanación"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "4. La falta inicial de la firma electrónica del interesado implica:",
    "options": [
      "a) Que la solicitud es anulable, pues se puede subsanar",
      "b) Que en caso de no subsanar la solicitud, se produce el desistimiento",
      "c) Que el Ayuntamiento debe solicitar la mejora voluntaria de la solicitud",
      "d) El desistimiento y archivo automático de la solicitud"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "5. La resolución del concejal es:",
    "options": [
      "a) Nula de pleno derecho, por ser contraria al ordenamiento jurídico al no estar motivada",
      "b) Nula de pleno derecho, por ser el órgano que resuelve manifiestamente incompetente",
      "c) Anulable, por ser contraria al ordenamiento jurídico al no estar motivada",
      "d) Anulable, por ser el órgano que resuelve manifiestamente incompetente"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "6. Si la resolución no tuviera otros vicios… ¿Qué implicaría la fata de motivación en este caso?:",
    "options": [
      "a) Nulidad de pleno derecho",
      "b) Anulabilidad",
      "c) No tendría efectos, toda vez que el interesado ha interpuesto un recurso (se entiende subsanado el defecto por parte del interesado)",
      "d) Validez plena, puesto que no es necesario motivar dicho acto"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "7. Sobre la puesta a disposición de la resolución el día 14 de abril:",
    "options": [
      "a) Se entiende rechazada a los 10 días hábiles, dándose por notificada y prosiguiendo las actuaciones",
      "b) Se entiende rechazada a los 10 días naturales, dándose por notificada y prosiguiendo las actuaciones",
      "c) Se entiende rechazada a los 10 días hábiles, considerándose infructuosa",
      "d) Se entiende rechazada a los 10 días naturales, teniendo el Ayuntamiento que publicar la resolución en el BOE"
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "8. ¿Cuándo se entiende transcurrido el plazo para acceder a la notificación?:",
    "options": [
      "a) 24 de abril",
      "b) 25 de abril",
      "c) 27 de abril",
      "d) 30 de abril"
    ],
    "correct": 0,
    "caso": 0
  },
  {
    "question": "9. El plazo para interponer el recurso potestativo de reposición es de 1 mes:",
    "options": [
      "a) Por tanto el recurso interpuesto está fuera de plazo",
      "b) Está dentro de plazo, pero no hay motivo para alegar una nulidad de pleno derecho",
      "c) Al alegar nulidad de pleno derecho, el plazo es irrelevante",
      "d) Está dentro del plazo y es correcto alegar causa de nulidad"
    ],
    "correct": 0,
    "caso": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    [].concat(pregunta.correct).forEach(c => toggleClasses(botonesOpciones[c], 'correcta'));

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;
                const sup = document.getElementById('supuesto');
                if (pregunta.caso != null && supuestos[pregunta.caso]) {
                    if (sup.dataset.caso !== String(pregunta.caso)) { document.getElementById('supuesto-texto').innerHTML = supuestos[pregunta.caso]; sup.dataset.caso = pregunta.caso; }
                    sup.classList.remove('hidden');
                } else sup.classList.add('hidden');
                const ref = document.getElementById('referencia');
                ref.textContent = pregunta.ref || '';
                ref.classList.toggle('hidden', !(pregunta.comprobada && pregunta.ref));

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = [].concat(pregunta.correct).includes(pregunta.respuestaUsuario);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();
                if (pregunta.ref) document.getElementById('referencia').classList.remove('hidden');

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
