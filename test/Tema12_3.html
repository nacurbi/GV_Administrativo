<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 3 Fuentes del Derecho</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 10px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn, #finalizar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover, #finalizar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .resultados-finales-container {
            text-align: center;
        }
        .resultados-finales-texto {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .resultados-finales-correctas {
            color: #155724;
            font-weight: bold;
        }
        .resultados-finales-incorrectas {
            color: #721c24;
            font-weight: bold;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test" style="text-align: justify;"><strong>TEST 3: Fuentes del Derecho</strong></p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
            <div id="resultados-finales" class="hidden resultados-finales-container">
                <h2>Resultados Finales</h2>
                <div id="resultados-texto" class="resultados-finales-texto"></div>
            </div>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
            <button id="finalizar-btn" class="comprobar-btn" style="width: 100%; margin-top: 20px;">Finalizar Test</button>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. ¿Qué denominación reciben las normas emanadas del Gobierno haciendo uso de la delegación legislativa otorgada previamente por las Cortes Generales?",
    "options": [
      "a) Decretos-Leyes.",
      "b) Decretos Legislativos.",
      "c) Leyes Orgánicas.",
      "d) Decretos gubernativos."
    ],
    "correct": 1
  },
  {
    "question": "2. Las normas contenidas en los tratados internacionales, ¿son jerárquicamente superiores a nuestras propias leyes internas?",
    "options": [
      "a) Sí, en todos los casos.",
      "b) Sí, menos a la Constitución.",
      "c) Sí, menos a la Constitución y a las Leyes Orgánicas.",
      "d) No, en ningún caso."
    ],
    "correct": 1
  },
  {
    "question": "3. La Constitución fue aprobada el:",
    "options": [
      "a) 28 de diciembre de 1978.",
      "b) 27 de diciembre de 1978.",
      "c) 27 de diciembre de 1979.",
      "d) 28 de diciembre de 1878."
    ],
    "correct": 1
  },
  {
    "question": "4. Los principios generales del derecho se aplican en defecto de:",
    "options": [
      "a) Ley y jurisprudencia.",
      "b) Jurisprudencia y costumbre.",
      "c) Ley y costumbre.",
      "d) Costumbre y doctrina."
    ],
    "correct": 2
  },
  {
    "question": "5. Si existe ley aplicable…",
    "options": [
      "a) No existe la costumbre.",
      "b) Debe probarse la costumbre.",
      "c) No rige la costumbre.",
      "d) Rige la costumbre siempre que no sea contraria a la moral y el orden público y resulte probada por quien la alega."
    ],
    "correct": 2
  },
  {
    "question": "6. La costumbre es una práctica o conducta:",
    "options": [
      "a) Generalizada, uniforme, y constante.",
      "b) Generalizada, constante y continua.",
      "c) Uniforme, constante y típica.",
      "d) Generalizada, uniforme, y discontinua."
    ],
    "correct": 0
  },
  {
    "question": "7. La jurisprudencia:",
    "options": [
      "a) Es obligatoria y también vinculante.",
      "b) Es obligatoria pero no vinculante.",
      "c) No es vinculante.",
      "d) Es vinculante pero no es obligatoria."
    ],
    "correct": 2
  },
  {
    "question": "8. El poder legislativo en Álava reside en:",
    "options": [
      "a) Juntas Generales.",
      "b) Diputación Foral.",
      "c) Junta de Gobierno Local.",
      "d) Parlamento."
    ],
    "correct": 0
  },
  {
    "question": "9. El Congreso de los Diputados se conoce también con el nombre de:",
    "options": [
      "a) Cámara alta.",
      "b) Cámara baja.",
      "c) Cortes Generales.",
      "d) Ninguna de las anteriores."
    ],
    "correct": 1
  },
  {
    "question": "10. Señala la respuesta incorrecta:",
    "options": [
      "a) La mayoría cualificada se calcula respecto de los miembros presentes en el acto.",
      "b) La mayoría simple consiste en tener más votos a favor que en contra de los miembros presentes en la votación.",
      "c) La abstención supone no votar ni a favor ni en contra.",
      "d) La mayoría absoluta se consigue con la mitad más 1 de los votos del total de miembros que legalmente forman el órgano."
    ],
    "correct": 0
  },
  {
    "question": "11. ¿Qué instancia judicial conoce de los delitos contra la Corona o terrorismo?",
    "options": [
      "a) Tribunal Supremo.",
      "b) Juzgados de paz.",
      "c) Audiencia Nacional.",
      "d) Tribunal Superior de Justicia del País Vasco."
    ],
    "correct": 2
  },
  {
    "question": "12. Las Juntas Generales de Álava están formadas por 51 junteros. El 15 de noviembre de 2022, únicamente asisten a la sesión 42 miembros. Necesitan aprobar una norma foral y para ello, se requiere obtener una mayoría cualificada de 4/5. ¿Cuántos votos a favor se necesitan?",
    "options": [
      "a) 41 votos.",
      "b) 39 votos.",
      "c) 38 votos",
      "d) 42 votos."
    ],
    "correct": 0
  },
  {
    "question": "13. Las Comunidades Autónomas:",
    "options": [
      "a) Pueden dictar decretos leyes pero no decretos legislativos.",
      "b) Pueden dictar decretos legislativos pero no decretos leyes.",
      "c) Pueden dictar decretos leyes y decretos legislativos.",
      "d) No pueden dictar decretos legislativos pero sí leyes ordinarias."
    ],
    "correct": 2
  },
  {
    "question": "14. Los Tribunales Superiores de Justicia de las Comunidades Autónomas son órganos jurisdiccionales:",
    "options": [
      "a) Del Estado.",
      "b) Del Estado y de las Comunidades Autónomas.",
      "c) De las Comunidades Autónomas.",
      "d) Ninguna de las respuestas es cierta."
    ],
    "correct": 0
  },
  {
    "question": "15. ¿Cuáles son las vías procedimentales principales para realizar el control de constitucionalidad?",
    "options": [
      "a) Recurso de amparo.",
      "b) Recurso de inconstitucionalidad y cuestión de inconstitucionalidad.",
      "c) Recurso de alzada.",
      "d) Recurso extraordinario de revisión."
    ],
    "correct": 1
  },
  {
    "question": "16. Las leyes son controladas por el TC:",
    "options": [
      "a) Sólo si tienen carácter estatal.",
      "b) Sólo si tienen carácter estatal y local.",
      "c) Sólo si tienen carácter autonómico.",
      "d) Tanto si tienen carácter estatal como autonómico."
    ],
    "correct": 3
  },
  {
    "question": "17. Una ley orgánica:",
    "options": [
      "a) Puede regular cualquier materia.",
      "b) Sólo puede regular las materias que recoge el art. 82 CE.",
      "c) Puede regular las cuestiones que le permita el gobierno.",
      "d) Sólo puede regular las materias que recoge el art. 81 CE."
    ],
    "correct": 3
  },
  {
    "question": "18. Los reglamentos:",
    "options": [
      "a) No pueden ser modificados por una ley si se trata de materias reservadas a reglamento.",
      "b) Pueden ser modificados por una ley.",
      "c) No pueden ser objeto de control por parte de los tribunales.",
      "d) Son controlados por el Tribunal Constitucional."
    ],
    "correct": 1
  },
  {
    "question": "19. El carácter supremo de la CE se manifiesta en que:",
    "options": [
      "a) No puede ser reformada de acuerdo con los procedimientos ordinarios válidos para otras normas, sino que exige unos procedimientos específicos de carácter más complejo.",
      "b) Sus artículos no pueden ser alterados, contradichos ni ignorados por los poderes públicos pues si así lo hicieran, su actuación sería inconstitucional y, por tanto, susceptible de ser así declarada.",
      "c) No se puede modificar.",
      "d) Las respuestas a) y b) son correctas."
    ],
    "correct": 3
  },
  {
    "question": "20. Los decretos legislativos:",
    "options": [
      "a) Tienen rango superior a la ley.",
      "b) Tienen rango pero no fuerza de ley.",
      "c) Tienen rango de ley y son dictadas por el parlamento.",
      "d) Tienen rango de ley y son dictadas por el Gobierno."
    ],
    "correct": 3
  },
  {
    "question": "21. La potestad reglamentaria es atribuida a:",
    "options": [
      "a) El Consejo de Ministros exclusivamente.",
      "b) El Consejo de Ministros, Presidente del Gobierno, Vicepresidente y Ministros.",
      "c) Ministros y Secretarios de Estado exclusivamente.",
      "d) El Parlamento en pleno."
    ],
    "correct": 1
  },
  {
    "question": "22. Los decretos leyes no pueden regular materias que afecten a:",
    "options": [
      "a) El derecho electoral general.",
      "b) Todos los derechos de los ciudadanos.",
      "c) Cuestiones de extranjería.",
      "d) Cuestiones de responsabilidad patrimonial."
    ],
    "correct": 0
  },
  {
    "question": "23. ¿A quién corresponde en última instancia la determinación e identificación de los límites de los derechos fundamentales?",
    "options": [
      "a) A los Tribunales ordinarios.",
      "b) Al Tribunal Europeo de Derechos Humanos.",
      "c) Al Tribunal Supremo.",
      "d) Al Tribunal Constitucional."
    ],
    "correct": 3
  },
  {
    "question": "24. Los reglamentos son:",
    "options": [
      "a) Disposiciones de carácter general que pueden innovar el ordenamiento jurídico.",
      "b) Resoluciones particulares.",
      "c) Normas con rango de ley.",
      "d) Disposiciones de carácter particular que pueden innovar el ordenamiento jurídico."
    ],
    "correct": 0
  },
  {
    "question": "25. Pueden dictar leyes orgánicas:",
    "options": [
      "a) Sólo el legislador autonómico.",
      "b) Sólo el legislador estatal.",
      "c) Tanto el legislador estatal como el autonómico.",
      "d) El legislador estatal, el autonómico y el local."
    ],
    "correct": 1
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.resultadosFinales.classList.add('hidden');
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');
                DOM.finalizarBtn.textContent = 'Finalizar Test';

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function mostrarResultados() {
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                // Recalcular el recuento total acumulado
                let correctas = 0;
                let incorrectas = 0;
                preguntas.forEach(p => {
                    if (p.comprobada) {
                        if (p.esCorrecta) correctas++;
                        else incorrectas++;
                    }
                });

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${correctas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${incorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function toggleFinalizarTest() {
                if (DOM.resultadosFinales.classList.contains('hidden')) {
                    mostrarResultados();
                } else {
                    mostrarPregunta();
                }
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, finalizar test, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
