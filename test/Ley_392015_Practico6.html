<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley_392015_Practico6</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>LEY 39/2015 · TEST PRÁCTICO 6</strong></p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <details class="supuesto hidden" id="supuesto" open><summary>Supuesto práctico</summary><div id="supuesto-texto"></div></details>
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="referencia hidden" id="referencia"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const supuestos = ["<p>D Valentín Aguirretxe, solicita una prestación económica el 1 de enero de 2018 al Departamento de Servicios Sociales de la DFA por la situación de Dependencia que tiene su padre, prestación económica regulada en el Decreto Foral 39/2014, del Consejo de Diputados, de 1 de agosto. En el mencionado Decreto regulador se establece que el procedimiento correspondiente durará como máximo 6 meses, siendo que si no se ha emitido resolución en este plazo debe entenderse desestimada la correspondiente solicitud. La competencia para estimar o desestimar la concesión de la prestación ha de hacerse por la Diputada de Servicios Sociales. La estimación o desestimación pone fin a la vía administrativa.</p>"];
            let preguntas = [
  {
    "question": "1. EL 15 DE JULIO DE 2018, LA DIRECTORA DE ASUNTOS SOCIALES ANTE LA AUSENCIA POR ENFERMEDAD DE LA DIPUTADA, RESUELVE LA SOLICITUD, SIN QUE HAYA HABIDO DELEGACIÓN DE COMPETENCIAS ALGUNA. ESTA RESOLUCIÓN DESDE EL PUNTO DE VISTA COMPETENCIAL:",
    "options": [
      "a) Es correcta, en los supuestos de fuerza mayor no es necesaria delegación alguna.",
      "b) Es nula de pleno derecho, por haber sido dictado por órgano manifiestamente incompetente.",
      "c) Es anulable.",
      "d) Ninguna es correcta."
    ],
    "correct": 2,
    "caso": 0
  },
  {
    "question": "2. SUPONIENDO QUE ESTA RESOLUCIÓN NO FUERA VÁLIDA, ¿CABRÍA SU CONVALIDACIÓN?",
    "options": [
      "a) No, en ningún caso cabe la convalidación.",
      "b) No, excepto en el supuesto de que el Decreto foral admitiese expresamente esa convalidación.",
      "c) Sí, mediante Orden Foral de la Diputada de Servicios Sociales.",
      "d) Sí, mediante Decreto Foral del Consejo de Gobierno Foral."
    ],
    "correct": 2,
    "caso": 0
  },
  {
    "question": "3. LA RESOLUCIÓN MENCIONADA, RESUELVE EN EL SENTIDO DE ESTIMAR PARCIALMENTE LA PRETENSIÓN DE D VALENTÍN. ESTA RESOLUCIÓN EN SENTIDO AFIRMATIVO:",
    "options": [
      "a) Es correcta, la resolución expresa posterior al vencimiento del plazo se adoptará sin vinculación alguna al sentido del silencio.",
      "b) No es correcta, la resolución expresa posterior al vencimiento del plazo deberá adoptarse con vinculación al sentido del silencio.",
      "c) No es correcta, la resolución expresa posterior a la producción del acto sólo podrá dictarse de ser totalmente estimatoria del mismo.",
      "d) Todas las respuestas anteriores son falsas."
    ],
    "correct": 0,
    "caso": 0
  },
  {
    "question": "4. D VALENTÍN NO ESTÁ CONFORME CON LA ESTIMACIÓN PARCIAL, POR LO QUE DECIDE INTERPONER RECURSO EN VÍA ADMINISTRATIVA. ¿QUÉ RECURSO ADMINISTRATIVO ORDINARIO DEBE INTERPONER?",
    "options": [
      "a) Recurso de alzada.",
      "b) Recurso potestativo de reposición.",
      "c) Recurso potestativo de reposición o recurso contencioso administrativo.",
      "d) Ninguno, contra las disposiciones administrativas de carácter general no cabe recurso alguno."
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "5. EN EL SUPUESTO DE QUE SEA POSIBLE LA INTERPOSICIÓN DE RECURSO, ¿EN QUÉ PLAZO DEBE INTERPONER EL CORRESPONDIENTE RECURSO?",
    "options": [
      "a) 1 mes desde la notificación de la estimación parcial.",
      "b) 1 mes desde el siguiente al de la notificación de la estimación parcial.",
      "c) 1 mes desde la fecha de salida del escrito correspondiente.",
      "d) 3 meses desde la notificación de la estimación parcial."
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "6. SI EN EL SUPUESTO MENCIONADO, NO HUBIESE HABIDO RESOLUCIÓN EXPRESA, CONTRA EL CORRESPONDIENTE SILENCIO, ¿QUÉ PLAZO EXISTE PARA LA INTERPOSICIÓN DEL CORRESPONDIENTE RECURSO ADMINISTRATIVO?",
    "options": [
      "a) 1 mes desde el día en que se produzcan los efectos del silencio administrativo.",
      "b) En cualquier momento a partir del día siguiente a aquel en que se produzcan los efectos del silencio administrativo.",
      "c) En cualquier momento a partir del día en que se produzcan los efectos del silencio administrativo.",
      "d) 1 mes desde el día siguiente a aquel en que se produzcan los efectos del silencio administrativo."
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "7. FINALMENTE, SIGUIENDO EL CONSEJO DE UN AMIGO SUYO ABOGADO, DECIDE INTERPONER RECURSO DE NULIDAD, ¿SE TRAMITARÍA EL RECURSO PESE A NO SER EL CORRECTO?",
    "options": [
      "a) No, pues no cabe recurso alguno contra las disposiciones administrativas de carácter general.",
      "b) Sí, ya que el error en la calificación del recurso no es obstáculo para su tramitación, siempre que se deduzca su verdadero carácter.",
      "c) No, ya que el error en la calificación del recurso es obstáculo para su tramitación, pese a que se deduzca su verdadero carácter.",
      "d) No, salvo que acredite poder suficiente para ello."
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "8. COMO MEDIDA CAUTELAR, AL PRESENTAR EL RECURSO D VALENTÍN SOLICITA LA SUSPENSIÓN DEL ACTO IMPUGNADO, POR ENTENDER QUE LA EJECUCIÓN LE PERJUDICA EN SUS INTERESES. ¿CABE ESTA SUSPENSIÓN?",
    "options": [
      "a) No, la interposición de cualquier recurso no suspenderá la ejecución del acto impugnado.",
      "b) Solo cabría la suspensión si se tratase de un recurso de alzada.",
      "c) Cabría la suspensión si la impugnación se fundamenta en alguna de las causas de nulidad previstas en el artículo 47 de la Ley 39/2015.",
      "d) Cabría la suspensión si la impugnación se fundamenta en alguna de las causas de anulabilidad previstas en el artículo 48 de la Ley 39/2015."
    ],
    "correct": 3,
    "caso": 0
  },
  {
    "question": "9. EL RECURSO INTERPUESTO ES DESESTIMADO, NO ESTANDO CONFORME D VALENTÍN CON ESTA DESESTIMACIÓN. ¿CABE INTERPONER ALGÚN RECURSO CONTRA ESTA RESOLUCIÓN EN VÍA ADMINISTRATIVA?",
    "options": [
      "a) No, contra la resolución de un recurso no cabrá ningún otro recurso administrativo, salvo el recurso extraordinario de revisión, en los casos establecidos legalmente.",
      "b) No, contra la resolución de un recurso no cabrá ningún otro recurso administrativo sin excepciones.",
      "c) No, contra la resolución de un recurso no cabrá ningún otro recurso administrativo, salvo el recurso extraordinario de apelación, en los casos establecidos legalmente.",
      "d) Sí, cabrá recurso contencioso-administrativo, en el plazo de 3 meses."
    ],
    "correct": 0,
    "caso": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    [].concat(pregunta.correct).forEach(c => toggleClasses(botonesOpciones[c], 'correcta'));

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;
                const sup = document.getElementById('supuesto');
                if (pregunta.caso != null && supuestos[pregunta.caso]) {
                    if (sup.dataset.caso !== String(pregunta.caso)) { document.getElementById('supuesto-texto').innerHTML = supuestos[pregunta.caso]; sup.dataset.caso = pregunta.caso; }
                    sup.classList.remove('hidden');
                } else sup.classList.add('hidden');
                const ref = document.getElementById('referencia');
                ref.textContent = pregunta.ref || '';
                ref.classList.toggle('hidden', !(pregunta.comprobada && pregunta.ref));

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = [].concat(pregunta.correct).includes(pregunta.respuestaUsuario);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();
                if (pregunta.ref) document.getElementById('referencia').classList.remove('hidden');

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
