<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 10px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn, #finalizar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover, #finalizar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .resultados-finales-container {
            text-align: center;
        }
        .resultados-finales-texto {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .resultados-finales-correctas {
            color: #155724;
            font-weight: bold;
        }
        .resultados-finales-incorrectas {
            color: #721c24;
            font-weight: bold;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test" style="text-align: justify;"><strong>TEMA 2. ESTATUTO DE AUTONOMÍA:</strong> Estatuto de Autonomía del País Vasco</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
            <div id="resultados-finales" class="hidden resultados-finales-container">
                <h2>Resultados Finales</h2>
                <div id="resultados-texto" class="resultados-finales-texto"></div>
            </div>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
            <button id="finalizar-btn" class="comprobar-btn" style="width: 100%; margin-top: 20px;">Finalizar Test</button>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. Según el artículo 2 del Estatuto vasco de autonomía, tienen derecho a formar parte de la Comunidad Autónoma del País Vasco:",
    "options": [
      "a) Álava, Gipuzkoa y Bizkaia.",
      "b) Álava, Gipuzkoa y Bizkaia, así como Navarra.",
      "c) Las provincias que así lo deseen.",
      "d) Las provincias limítrofes que así lo deseen."
    ],
    "correct": 1
  },
  {
    "question": "2. La posibilidad de integración de Navarra en la Comunidad Autónoma del País Vasco:",
    "options": [
      "a) No se cita en la Constitución española.",
      "b) Se prohíbe en la Constitución española.",
      "c) Aparecía prevista en la Constitución española, pero se ha suprimido esa referencia.",
      "d) Aparece prevista en la Constitución española, en la Disposición Transitoria cuarta."
    ],
    "correct": 3
  },
  {
    "question": "3. Los Consejeros o Consejeras del Gobierno Vasco:",
    "options": [
      "a) Poseen una única condición, como titulares de un Departamento.",
      "b) Poseen una única condición, como miembros del Gobierno Vasco.",
      "c) Poseen una doble condición: por un lado, como miembros del Gobierno; por otro como titulares de un Departamento.",
      "d) Poseen una triple condición: primero, como miembros del Gobierno; segundo, como titulares de un Departamento y, tercero, como miembros del Parlamento Vasco."
    ],
    "correct": 2
  },
  {
    "question": "4. El Gobierno Vasco:",
    "options": [
      "a) Está integrado por el Lehendakari, Consejeros, Viceconsejeros y Directores Generales.",
      "b) Está integrado por el Lehendakari y los Consejeros.",
      "c) Está integrado por el Lehendakari, los Consejeros, y los Viceconsejeros.",
      "d) Está integrado por el Lehendakari, los Consejeros y los Directores Generales de cada Departamento."
    ],
    "correct": 1
  },
  {
    "question": "5. Según el Estatuto de Autonomía, el Lehendakari:",
    "options": [
      "a) Será designado por el Parlamento Vasco.",
      "b) Será designado por el Rey.",
      "c) Será designado por las Cortes Generales.",
      "d) Será designado directamente por los ciudadanos vascos."
    ],
    "correct": 0
  },
  {
    "question": "6. Según el Estatuto de Autonomía, las Leyes del Parlamento Vasco:",
    "options": [
      "a) Son promulgadas por el Presidente del Gobierno Vasco.",
      "b) Se publican en el Boletín Oficial del País Vasco, pero no se publican en el Boletín Oficial del Estado.",
      "c) Se publican en el Boletín Oficial del Estado, pero no se publican en el Boletín Oficial del País Vasco.",
      "d) Se publican en el Boletín Oficial del País Vasco exclusivamente."
    ],
    "correct": 0
  },
  {
    "question": "7. El Estatuto del País Vasco señala la siguiente característica del Parlamento Vasco:",
    "options": [
      "a) Estará integrado por un número igual de representantes de cada Territorio Histórico.",
      "b) La circunscripción electoral será única: el territorio de la Comunidad Autónoma del País Vasco.",
      "c) El Parlamento Vasco será elegido por un período de seis años.",
      "d) Los representantes serán elegidos por sufragio indirecto y secreto."
    ],
    "correct": 0
  },
  {
    "question": "8. Las funciones principales del Parlamento Vasco son:",
    "options": [
      "a) Ejercer la potestad reglamentaria.",
      "b) Redactar los presupuestos de la Comunidad.",
      "c) Ser controlado por el Gobierno Vasco.",
      "d) Las respuestas anteriores son incorrectas."
    ],
    "correct": 3
  },
  {
    "question": "9. ¿Cómo se hará la designación de las sedes de las instituciones comunes de la Comunidad Autónoma del País Vasco?",
    "options": [
      "a) Mediante acuerdo de los parlamentarios vascos.",
      "b) Mediante ley del Parlamento Vasco.",
      "c) Mediante ley de las Cortes Generales.",
      "d) Mediante decreto del Gobierno Vasco."
    ],
    "correct": 1
  },
  {
    "question": "10. Los conocidos como «enclaves» en la Comunidad Autónoma Vasca:",
    "options": [
      "a) Son territorios enclavados geográficamente en su totalidad dentro del territorio de la Comunidad Autónoma Vasca pero que pertenecen a Provincias o Comunidades Autónomas ajenas a la vasca.",
      "b) El propio Estatuto contempla el procedimiento de agregación de los enclaves territoriales a la Comunidad Autónoma Vasca.",
      "c) Son dos los casos de este tipo.",
      "d) Las tres respuestas anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "11. La organización de la Administración de Justicia en el País Vasco, culminará en:",
    "options": [
      "a) Tribunal de Justicia del País Vasco.",
      "b) Tribunales ordinarios.",
      "c) Tribunal Supremo.",
      "d) Tribunal Constitucional."
    ],
    "correct": 0
  },
  {
    "question": "12. La bandera de la Comunidad Autónoma del País Vasco:",
    "options": [
      "a) No fue fijada por el Estatuto Vasco de Autonomía.",
      "b) Según establece el Estatuto, se denomina “Ikurriña”.",
      "c) Es bicrucífera, compuesta de aspa verde, cruz blanca superpuesta y fondo rojo.",
      "d) Las respuestas anteriores son incorrectas."
    ],
    "correct": 2
  },
  {
    "question": "13. Según el Estatuto de Autonomía del País Vasco, el himno y el escudo de la Comunidad Autónoma del País Vasco:",
    "options": [
      "a) Ambos aparecen descritos en el Estatuto.",
      "b) Ambos quedaron fijados en una ley de símbolos de la Comunidad Autónoma del País Vasco.",
      "c) La Comunidad Autónoma del País Vasco no cuenta con himno ni escudo oficial.",
      "d) En el Estatuto no se hace referencia a esos dos elementos."
    ],
    "correct": 3
  },
  {
    "question": "14. Según el Estatuto corresponde al Parlamento Vasco, además de sus funciones principales:",
    "options": [
      "a) Designar a varios Senadores, que representan al País Vasco en el Senado.",
      "b) Solicitar del Gobierno del Estado la adopción de un proyecto de Ley.",
      "c) Remitir a la Mesa del Congreso de los Diputados una proposición de Ley.",
      "d) Las respuestas anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "15. Según el Estatuto de Autonomía, el Lehendakari es nombrado por:",
    "options": [
      "a) El Rey.",
      "b) El Gobierno Vasco.",
      "c) El Diputado General.",
      "d) El Alcalde."
    ],
    "correct": 0
  },
  {
    "question": "16. Los Archivos, Bibliotecas y Museos que no sean de titularidad estatal es una competencia:",
    "options": [
      "a) De desarrollo legislativo y de ejecución.",
      "b) Exclusiva del País Vasco.",
      "c) De ejecución.",
      "d) De desarrollo legislativo."
    ],
    "correct": 1
  },
  {
    "question": "17. Según lo previsto en el Estatuto de Autonomía del País Vasco:",
    "options": [
      "a) La iniciativa legislativa corresponderá a un quinto de los miembros del Parlamento Vasco, al Gobierno Vasco y a las instituciones de los TTHH.",
      "b) La iniciativa legislativa corresponderá a un tercio de los miembros del Parlamento Vasco, al Gobierno Vasco y a las instituciones de los TTHH.",
      "c) La iniciativa legislativa corresponderá a los miembros del Parlamento Vasco, al Gobierno Vasco y a las instituciones de los TTHH.",
      "d) La iniciativa legislativa corresponderá al Gobierno Vasco y a las instituciones de los TTHH."
    ],
    "correct": 2
  },
  {
    "question": "18. Los habitantes del País Vasco:",
    "options": [
      "a) Tienen el deber de conocer y el derecho a usar el castellano y el euskera.",
      "b) Tienen el derecho a conocer y usar el castellano y el euskera.",
      "c) Tienen el deber de conocer y usar el castellano y el euskera.",
      "d) Tienen el derecho a conocer y el deber de usar el castellano y el euskera."
    ],
    "correct": 1
  },
  {
    "question": "19. La policía autónoma vasca, en cuanto actúe como policía judicial:",
    "options": [
      "a) Estará al servicio de la Administración de Justicia pero bajo la dependencia del Gobierno Vasco.",
      "b) Estará bajo la dependencia de la Administración de Justicia pero al servicio del Gobierno Vasco.",
      "c) Estará al servicio y bajo la dependencia de la Administración de Justicia.",
      "d) Ninguna es correcta."
    ],
    "correct": 2
  },
  {
    "question": "20. Señala la respuesta correcta:",
    "options": [
      "a) El Gobierno Vasco es un órgano unipersonal que ostenta funciones ejecutivas y administrativas.",
      "b) La Real Academia de la Lengua Vasca-Euskaltzaindia es institución consultiva oficial en lo referente al euskera.",
      "c) La circunscripción electoral es la provincia.",
      "d) El Parlamento Vasco es elegido por un periodo de 5 años."
    ],
    "correct": 1
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.resultadosFinales.classList.add('hidden');
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');
                DOM.finalizarBtn.textContent = 'Finalizar Test';

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function mostrarResultados() {
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                // Recalcular el recuento total acumulado
                let correctas = 0;
                let incorrectas = 0;
                preguntas.forEach(p => {
                    if (p.comprobada) {
                        if (p.esCorrecta) correctas++;
                        else incorrectas++;
                    }
                });

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${correctas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${incorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function toggleFinalizarTest() {
                if (DOM.resultadosFinales.classList.contains('hidden')) {
                    mostrarResultados();
                } else {
                    mostrarPregunta();
                }
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, finalizar test, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
