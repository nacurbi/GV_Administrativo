<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley_392015_Test16</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>LEY 39/2015, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN:</strong> Test 16</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. Respecto a los expedientes administrativos no es correcto:",
    "options": [
      "a) Tendrá formato no electrónico.",
      "b) Se formará mediante la agregación ordenada de cuantos documentos, pruebas, dictámenes, informes, acuerdos, notificaciones y demás diligencias que deban integrarlos.",
      "c) Tendrán un índice numerado de todos los documentos que contenga cuando se remita.",
      "d) Deberá constar en el expediente copia electrónica certificada de la resolución adoptada."
    ],
    "correct": 0
  },
  {
    "question": "2. La autenticación del índice garantizará la integridad e inmutabilidad del expediente electrónico generado desde el momento de:",
    "options": [
      "a) Su presentación y permitirá su recuperación siempre que sea preciso, siendo admisible que un mismo documento forme parte de distintos expedientes electrónicos.",
      "b) Su firma y permitirá su recuperación, siempre que sea preciso, siendo admisible que un mismo documento forme parte de distintos expedientes electrónicos.",
      "c) Su presentación y permitirá su recuperación siempre que sea preciso, no siendo admisible que un mismo documento forme parte de distintos expedientes electrónicos.",
      "d) Su firma y permitirá su recuperación siempre que sea preciso, no siendo admisible que un mismo documento forme parte de distintos expedientes electrónicos."
    ],
    "correct": 1
  },
  {
    "question": "3. El procedimiento sometido al principio de celeridad, se impulsará de oficio en todos sus trámites y:",
    "options": [
      "a) A través de medios electrónicos, respetando los principios de transparencia, publicidad y buena fe.",
      "b) A través de medios electrónicos, respetando los principios de transparencia y publicidad.",
      "c) A través de medios no electrónicos, respetando los principios de transparencia, publicidad y buena fe.",
      "d) Ninguna es correcta."
    ],
    "correct": 1
  },
  {
    "question": "4. De acuerdo con el principio de simplificación administrativa:",
    "options": [
      "a) Se acordará en un solo acto todos los trámites que por su naturaleza, admiten un impulso simultáneo y sea obligado su cumplimiento sucesivo.",
      "b) Se acordará en sucesivos actos todos los trámites que por su naturaleza admitan un impulso simultáneo y no sea obligado su cumplimiento sucesivo.",
      "c) Se acordará en un sólo acto todos los trámites que por su naturaleza, admiten un impulso simultáneo y no sea obligado su cumplimiento sucesivo.",
      "d) Se acordará en sucesivos actos todos los trámites que por su naturaleza admitan un impulso y sea obligado su cumplimiento sucesivo."
    ],
    "correct": 2
  },
  {
    "question": "5. Cuándo la administración considere que alguno de los actos de los interesados no reúne los requisitos necesarios, lo pondrán en conocimiento de su autor:",
    "options": [
      "a) Con anterioridad al trámite de audiencia, concediéndole un plazo de 5 días para cumplimentarlo.",
      "b) En cualquier momento del procedimiento, concediéndole un plazo de 5 días para cumplimentarlo.",
      "c) En cualquier momento del procedimiento, concediéndole un plazo de 10 días para cumplimentarlo.",
      "d) Con anterioridad al trámite de audiencia, concediéndole un plaz6de 10 días para cumplimentarlo."
    ],
    "correct": 2
  },
  {
    "question": "6. Las cuestiones incidentales que se susciten en el procedimiento:",
    "options": [
      "a) Suspenderán la tramitación del procedimiento.",
      "b) Ninguna cuestión incidental suspenderá la tramitación del procedimiento.",
      "c) Incluso las que se refieran a la nulidad de actuaciones, no suspenderán la tramitación del mismo salvo la recusación.",
      "d) Ninguna es correcta."
    ],
    "correct": 2
  },
  {
    "question": "7. Cuál de las siguientes cuestiones suspende la tramitación del procedimiento?",
    "options": [
      "a) La abstención.",
      "b) La nulidad de actuaciones.",
      "c) La caducidad.",
      "d) La recusación."
    ],
    "correct": 3
  },
  {
    "question": "8. Es lo mismo finalización del procedimiento que resolución?",
    "options": [
      "a) Si.",
      "b) Si, el procedimiento administrativo sólo puede terminar con resolución expresa.",
      "c) No, la resolución es la forma normal del procedimiento, pero hay más formas de finalizarlo.",
      "d) Ninguna es correcta."
    ],
    "correct": 2
  },
  {
    "question": "9. Las actuaciones complementarias reguladas en el artículo 87 de la LPAC quién las acuerda?",
    "options": [
      "a) Los interesados mediante petición razonada.",
      "b) El órgano competente para resolver.",
      "c) El órgano competente para tramitar el procedimiento.",
      "d) Las respuestas b y c son correctas."
    ],
    "correct": 1
  },
  {
    "question": "10. Que plazo es correcto con respecto a las actuaciones complementarias?",
    "options": [
      "a) El acuerdo de realización de actuaciones complementarias se notificará a los interesados para que realicen alegaciones por un plazo de 5 días.",
      "b) Las actuaciones complementarias deberán practicarse en un plazo no inferior a 15 días.",
      "c) Las actuaciones complementarias deberán practicarse en un plazo no superior a 30 días como el período de prueba.",
      "d) Ninguna es correcta."
    ],
    "correct": 3
  },
  {
    "question": "11. Qué debe contener la resolución? :",
    "options": [
      "a) La decisión que deberá decidir todas las cuestiones planteadas, pero no incluirá las cuestiones conexas.",
      "b) La decisión, motivada en los casos del artículo 35 LPAC, los recursos que procedan contra la misma en vía administrativa.",
      "c) La decisión, motivada en los casos del artículo 35, los recursos que quepan contra ella, tanto en vía administrativa como judicial y el plazo para interponerlos.",
      "d) Ninguna es correcta."
    ],
    "correct": 2
  },
  {
    "question": "12. Sobre la obligación de resolver establecida en el artículo 21 de la ley 39/2015 de 1 de octubre:",
    "options": [
      "a) La administración no está obligada a dictar resolución expresa y a notificarlo, de ahí la figura del silencio del artículo 24 en los procedimientos iniciados a solicitud del interesado.",
      "b) El plazo máximo en el que debe notificarse será siempre de 6 meses.",
      "c) El plazo máximo de notificación será el establecido en la LPAC para cada correspondiente procedimiento.",
      "d) Todas son incorrectas."
    ],
    "correct": 3
  },
  {
    "question": "13. Señala la respuesta correcta:",
    "options": [
      "a) Sin perjuicio de la forma y lugar señalados por el interesado para la práctica de las notificaciones, la resolución del procedimiento se dictará electrónicamente.",
      "b) Cuando la competencia para instruir y resolver un procedimiento no recaiga en un mismo órgano, será necesario que el instructor realice una propuesta de resolución.",
      "c) En los procedimientos de carácter sancionador la propuesta de resolución deberá ser notificada a los interesados.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "14. Respecto a la propuesta de resolución en los procedimientos de carácter sancionador no es correcto:",
    "options": [
      "a) En el caso de procedimientos de carácter sancionador, una vez concluido la instrucción del procedimiento el órgano instructor formulará una propuesta de resolución que no se notificará a los interesados.",
      "b) La propuesta de resolución deberá indicar la puesta de manifiesto del procedimiento y el plazo para formular alegaciones y presentar los documentos e informaciones que se estimen pertinentes.",
      "c) En la propuesta de resolución se fijarán de forma motivada los hechos que se consideren probados y su exacta calificación jurídica.",
      "d) El órgano instructor puede no formular propuesta de resolución con archivo de actuaciones en los supuestos del artículo 89.1 de la ley 39 /2015 de 1 de octubre."
    ],
    "correct": 0
  },
  {
    "question": "15. El órgano encargado de la resolución del procedimiento podrá acordar el archivo de actuaciones sin que sea necesaria propuesta de resolución:",
    "options": [
      "a) Cuándo los hechos no resulten acreditados.",
      "b) Cuando los hechos probados no constituyan infracción administrativa.",
      "c) Cuando no se haya podido identificar a las personas.",
      "d) Todas son incorrectas."
    ],
    "correct": 3
  },
  {
    "question": "16. El órgano instructor resolverá la finalización del procedimiento con archivo de las actuaciones sin que sea necesaria la formulación de la propuesta de resolución, cuando en la instrucción se ponga de manifiesto que:( señala la respuesta incorrecta) :",
    "options": [
      "a) La inexistencia de los hechos que pudieran constituir la infracción.",
      "b) Cuando los hechos resulten acreditados.",
      "c) Los hechos probados no constituyan de modo manifiesto, infracción administrativa.",
      "d) Cuando se concluyera en cualquier momento que ha prescrito la infracción."
    ],
    "correct": 1
  },
  {
    "question": "17. En ningún caso podrá la administración abstenerse de resolver so pretexto de silencio, oscuridad o insuficiencia de los preceptos legales aplicables al caso:",
    "options": [
      "a) Ni podrá acordarse la inadmisión de las solicitudes de reconocimiento de derechos no previstos en el Ordenamiento jurídico o manifiestamente carentes de fundamento, sin perjuicio del derecho de petición previsto por el artículo 27 de la Constitución.",
      "b) Aunque podrá acordarse la inadmisión de las solicitudes de reconocimiento de derechos no previstos en el Ordenamiento jurídico o manifiestamente carentes de fundamento, sin perjuicio del derecho de petición previsto por el artículo 27 de la Constitución.",
      "c) Aunque podrá acordarse la inadmisión de las solicitudes de reconocimiento de derechos no previstos en el Ordenamiento jurídico o manifiestamente carentes de fundamento sin perjuicio del derecho de petición previsto por el artículo 29 de la Constitución.",
      "d) Todas son incorrectas."
    ],
    "correct": 2
  },
  {
    "question": "18. Señala la respuesta correcta con respecto a las especialidades de la resolución en los procedimientos sancionadores:",
    "options": [
      "a) La resolución que ponga fin al procedimiento será ejecutiva aunque quepa contra ella recurso en vía administrativa.",
      "b) La resolución ejecutiva no se podrá suspender cautelarmente.",
      "c) La suspensión cautelar de la resolución ejecutiva puede acabar cuando el interesado haya interpuesto recurso contencioso administrativo y no haya solicitado en el mismo trámite la suspensión cautelar.",
      "d) Ninguna es correcta."
    ],
    "correct": 2
  },
  {
    "question": "19. Señala la respuesta correcta sobre las especialidades de la resolución en los procedimientos en materia de responsabilidad patrimonial:",
    "options": [
      "a) En los casos de procedimiento de responsabilidad patrimonial, será necesario que la resolución se pronuncie sobre la existencia o no de relación de causalidad entre el funcionamiento del servicio público y la lesión producida.",
      "b) En los casos de responsabilidad patrimonial la resolución se pronunciará sobre el daño causado, la cuantía y el modo de indemnización cuando proceda de acuerdo con los criterios de la Ley de Régimen Jurídico del sector público.",
      "c) Transcurridos 6 meses desde que se inició el procedimiento sin que haya recaído y se notifique resolución expresa, se entiende estimado por silencio.",
      "d) Las respuestas a y b son correctas."
    ],
    "correct": 3
  },
  {
    "question": "20. Sobre la responsabilidad patrimonial el artículo 24 de la ley de procedimiento administrativo común dispone:",
    "options": [
      "a) El silencio tendrá efecto estimatorio en los procedimientos de responsabilidad patrimonial.",
      "b) El silencio tendrá efecto desestimatorio en los procedimientos de responsabilidad patrimonial.",
      "c) En los casos de desestimación por silencio la resolución expresa posterior no está vinculada por el sentido del silencio.",
      "d) Las respuestas b y c son correctas."
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
