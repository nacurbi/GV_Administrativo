<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 10px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn, #finalizar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover, #finalizar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .resultados-finales-container {
            text-align: center;
        }
        .resultados-finales-texto {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .resultados-finales-correctas {
            color: #155724;
            font-weight: bold;
        }
        .resultados-finales-incorrectas {
            color: #721c24;
            font-weight: bold;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test" style="text-align: justify;"><strong>TEMA 1. CONSTITUCIÓN ESPAÑOLA:</strong> Derechos y Deberes Fundamentales</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
            <div id="resultados-finales" class="hidden resultados-finales-container">
                <h2>Resultados Finales</h2>
                <div id="resultados-texto" class="resultados-finales-texto"></div>
            </div>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
            <button id="finalizar-btn" class="comprobar-btn" style="width: 100%; margin-top: 20px;">Finalizar Test</button>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. La CE de 1978, otorga una protección jurisdiccional extraordinaria a los derechos reconocidos en los arts. 14-29 y 30.2, que consiste en un procedimiento ante los tribunales basado en los principios de:",
    "options": [
      "a) Prioridad.",
      "b) Preferencia y sumariedad.",
      "c) Rapidez.",
      "d) Tutela reforzada."
    ],
    "correct": 1
  },
  {
    "question": "2. ¿Cuáles son los derechos susceptibles de que, ante su vulneración, se plantee un recurso de amparo?",
    "options": [
      "a) Todos.",
      "b) Los recogidos en el título I.",
      "c) Los recogidos en los artículos 15 a 29 de la CE.",
      "d) Los recogidos en los artículos 14 a 29 y 30.2 de la CE."
    ],
    "correct": 3
  },
  {
    "question": "3. ¿En qué artículo de la CE se regula la objeción de conciencia?",
    "options": [
      "a) 30.2",
      "b) 29.",
      "c) 30.",
      "d) 30.1"
    ],
    "correct": 0
  },
  {
    "question": "4. ¿En qué artículo de la CE se regula el derecho de petición?",
    "options": [
      "a) 30.",
      "b) 29.",
      "c) 27.",
      "d) 28."
    ],
    "correct": 1
  },
  {
    "question": "5. La defensa de España, para los españoles, es:",
    "options": [
      "a) Un derecho y un deber.",
      "b) Un deber.",
      "c) Un derecho.",
      "d) Ni un derecho ni un deber."
    ],
    "correct": 0
  },
  {
    "question": "6. Sobre la prisión provisional, la Constitución señala:",
    "options": [
      "a) Que el plazo máximo de duración es de 72 horas.",
      "b) Que el plazo máximo de duración es de 48 horas.",
      "c) Que el plazo máximo de duración es de 24 horas.",
      "d) Que el plazo máximo de duración se determinará por ley."
    ],
    "correct": 3
  },
  {
    "question": "7. En lo relativo al derecho de la igualdad ante la ley, la CE no cita expresamente entre sus circunstancias:",
    "options": [
      "a) Edad.",
      "b) Religión.",
      "c) Nacimiento.",
      "d) Raza."
    ],
    "correct": 0
  },
  {
    "question": "8. Respecto a los disminuidos físicos, sensoriales y psíquicos, los poderes públicos realizarán una política de:",
    "options": [
      "a) Rehabilitación, competencia, previsión y revisión.",
      "b) Tratamiento, rehabilitación, marginación y competencia.",
      "c) Previsión, tratamiento, rehabilitación y consulta.",
      "d) Previsión, tratamiento, rehabilitación e integración."
    ],
    "correct": 3
  },
  {
    "question": "9. ¿Pueden interceptarse las comunicaciones postales?",
    "options": [
      "a) Sí, por medio de resolución judicial o administrativa.",
      "b) Sí, por medio de resolución administrativa.",
      "c) No, en ningún caso.",
      "d) Sólo mediante resolución judicial."
    ],
    "correct": 3
  },
  {
    "question": "10. Para hacer efectivo el derecho a disfrutar de una vivienda digna, los poderes públicos:",
    "options": [
      "a) Tratarán de favorecer la especulación del suelo.",
      "b) Promoverán las condiciones necesarias y establecerán las normas pertinentes.",
      "c) Regularán la utilización del suelo, de acuerdo con los intereses particulares.",
      "d) Todas son ciertas."
    ],
    "correct": 1
  },
  {
    "question": "11. Conforme al art. 10 de la CE: Las normas relativas a los derechos fundamentales y libertades públicas que la Constitución reconoce se interpretarán de conformidad:",
    "options": [
      "a) Con la CE.",
      "b) Con la Declaración Universal de Derechos Humanos y Tratados Internacionales ratificados por España.",
      "c) Conforme a la jurisprudencia del Tribunal Supremo.",
      "d) Conforme a la doctrina del Tribunal Constitucional."
    ],
    "correct": 1
  },
  {
    "question": "12. ¿Puede un español de origen ser privado de la nacionalidad?",
    "options": [
      "a) Sí.",
      "b) No.",
      "c) En casos excepcionales.",
      "d) Cuando haya cometido un delito grave."
    ],
    "correct": 1
  },
  {
    "question": "13. ¿Quiénes son titulares del derecho reconocido en el art 23 de la CE, conforme al artículo 13?",
    "options": [
      "a) Los extranjeros.",
      "b) Los españoles.",
      "c) Los españoles, salvo que atendiendo a criterios de reciprocidad se reconozca el derecho de sufragio activo y pasivo en las elecciones municipales.",
      "d) Los españoles, salvo que atendiendo a criterios de reciprocidad se reconozca el derecho de sufragio pasivo en las elecciones municipales."
    ],
    "correct": 2
  },
  {
    "question": "14. El derecho a la vida y a la integridad física y moral se reconoce:",
    "options": [
      "a) Españoles.",
      "b) Los ciudadanos.",
      "c) Todos.",
      "d) Extranjeros."
    ],
    "correct": 2
  },
  {
    "question": "15. ¿Qué confesión religiosa está establecida en España?",
    "options": [
      "a) Católica.",
      "b) Cristiana.",
      "c) Ninguna.",
      "d) Musulmana."
    ],
    "correct": 2
  },
  {
    "question": "16. La mayoría de edad se alcanza a los:",
    "options": [
      "a) 16 años.",
      "b) 14 años.",
      "c) 18 años.",
      "d) 15 años."
    ],
    "correct": 2
  },
  {
    "question": "17. Con respecto al empleo, los poderes públicos:",
    "options": [
      "a) Realizarán una política de estabilidad económica.",
      "b) Orientarán su política al pleno empleo.",
      "c) Promoverán una distribución de la renta personal más equitativa.",
      "d) Procurarán una distribución regional de igualdad."
    ],
    "correct": 1
  },
  {
    "question": "18. ¿Quién se configura como un alto comisionado de las Cortes Generales y designado por éstas para la defensa de los derechos de los ciudadanos?",
    "options": [
      "a) Presidente del Gobierno.",
      "b) Presidente del Congreso.",
      "c) Presidente del Senado.",
      "d) Defensor del Pueblo."
    ],
    "correct": 3
  },
  {
    "question": "19. La Administración civil:",
    "options": [
      "a) Puede imponer sanciones privativas de libertad en todo caso.",
      "b) Solo puede imponer sanciones privativas de libertas cuando esté autorizada.",
      "c) No puede imponer sanciones que directa o indirectamente impliquen privación de libertad.",
      "d) Solo en casos excepcionales podrá imponer sanciones privativas de libertad."
    ],
    "correct": 2
  },
  {
    "question": "20. En caso de reuniones en lugares de tránsito público y manifestaciones:",
    "options": [
      "a) Solamente será precisa la comunicación a la autoridad cuando las reuniones no sean pacíficas.",
      "b) Solamente será precisa la comunicación a la autoridad cuando las reuniones sean pacíficas.",
      "c) Se dará comunicación previa a la autoridad competente.",
      "d) No será precisa la comunicación a ninguna autoridad."
    ],
    "correct": 2
  },
  {
    "question": "21. ¿Qué artículos componen el Título I de la CE de 1978?",
    "options": [
      "a) Del 14 al 29 incluidos.",
      "b) Del 9 al 55 incluidos.",
      "c) Del 10 al 55 incluidos.",
      "d) Del 15 al 29 incluidos."
    ],
    "correct": 2
  },
  {
    "question": "22. ¿Qué artículos forman la sección denominada \"Derechos fundamentales y libertades públicas\"?",
    "options": [
      "a) Del 15 al 29 incluidos.",
      "b) Del 14 al 30 incluidos.",
      "c) Del 15 al 30 incluidos.",
      "d) Del 14 al 29 incluidos."
    ],
    "correct": 0
  },
  {
    "question": "23. ¿Qué artículos son susceptibles de amparo constitucional?",
    "options": [
      "a) Del 14 al 30.2 incluidos.",
      "b) Del 15 al 30 incluidos.",
      "c) Del 14 al 30 incluidos.",
      "d) Del 14 al 29 y el 30.2 incluidos."
    ],
    "correct": 3
  },
  {
    "question": "24. ¿Dónde quedan recogidos en el CE de 1978 los \"auténticos\" derechos fundamentales?",
    "options": [
      "a) Artículos 10 a 55, ambos inclusive.",
      "b) Artículos 14 a 29, ambos inclusive.",
      "c) Artículos 10 a 29, ambos inclusive.",
      "d) Artículos 14 a 55, ambos inclusive."
    ],
    "correct": 1
  },
  {
    "question": "25. ¿Qué derechos fundamentales tendrán que regularse por ley orgánica?",
    "options": [
      "a) Los derechos fundamentales y libertades públicas reconocidas en la sección I, Capítulo II del Título I CE.",
      "b) Los derechos y libertades públicas de todo el Capítulo II del Título I.",
      "c) Los derechos y libertades de Título I.",
      "d) Los derechos fundamentales y libertades públicas de la Sección I del Capítulo II más los artículos 14 y 30.2."
    ],
    "correct": 0
  },
  {
    "question": "26. ¿Cuáles son los derechos que se protegen por el recurso de amparo ante el TC?",
    "options": [
      "a) Los derechos reconocidos en el art. 14 y la Sección Primera del Capítulo II del Título I de la CE.",
      "b) Los derechos reconocidos en el art. 14 y la Sección Primera del Capítulo II del Título I de la CE y, además, la objeción de conciencia reconocida en el art. 30.2.",
      "c) Los derechos reconocidos en el art. 14 y la Sección Primera del Capítulo II del Título II de la CE y el artículo 30.2.",
      "d) Los derechos reconocidos en el art. 14 y la Sección Primera del Capítulo I del Título I de la CE y el artículo 30."
    ],
    "correct": 1
  },
  {
    "question": "27. El recurso de amparo se podrá interponer en defensa de los derechos reconocidos en:",
    "options": [
      "a) Los arts. 14, 30.2 y Sección 2ª del Capítulo I del Título I de la CE.",
      "b) Los arts. 14, 30.2 y Sección 2ª del Capítulo II del Título I de la CE.",
      "c) Los arts. 14, 30.2 y Sección 1ª del Capítulo II del Título I de la CE.",
      "d) Los arts. 14, 30.2 y Sección 2ª del Capítulo III del Título I de la CE."
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.resultadosFinales.classList.add('hidden');
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');
                DOM.finalizarBtn.textContent = 'Finalizar Test';

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function mostrarResultados() {
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                // Recalcular el recuento total acumulado
                let correctas = 0;
                let incorrectas = 0;
                preguntas.forEach(p => {
                    if (p.comprobada) {
                        if (p.esCorrecta) correctas++;
                        else incorrectas++;
                    }
                });

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${correctas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${incorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function toggleFinalizarTest() {
                if (DOM.resultadosFinales.classList.contains('hidden')) {
                    mostrarResultados();
                } else {
                    mostrarPregunta();
                }
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, finalizar test, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
