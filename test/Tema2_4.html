<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 10px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn, #finalizar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover, #finalizar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .resultados-finales-container {
            text-align: center;
        }
        .resultados-finales-texto {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .resultados-finales-correctas {
            color: #155724;
            font-weight: bold;
        }
        .resultados-finales-incorrectas {
            color: #721c24;
            font-weight: bold;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test" style="text-align: justify;"><strong>TEMA 2. ESTATUTO DE AUTONOMÍA:</strong> Estatuto de Autonomía del País Vasco</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
            <div id="resultados-finales" class="hidden resultados-finales-container">
                <h2>Resultados Finales</h2>
                <div id="resultados-texto" class="resultados-finales-texto"></div>
            </div>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
            <button id="finalizar-btn" class="comprobar-btn" style="width: 100%; margin-top: 20px;">Finalizar Test</button>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. El Estatuto de Autonomía del País Vasco es una:",
    "options": [
      "a) Ley Autonómica.",
      "b) Ley Ordinaria.",
      "c) Ley Orgánica.",
      "d) Ley de Bases."
    ],
    "correct": 2
  },
  {
    "question": "2. Además de sus sesiones ordinarias, el Parlamento Vasco podrá reunirse en sesiones extraordinarias:",
    "options": [
      "a) A petición del Lehendakari, del/de la Presidente/a de la Cámara o de 1/4 parte de sus miembros.",
      "b) A petición del Gobierno de la Diputación permanente o de la tercera parte de los miembros.",
      "c) A petición del Lehendakari, de los Diputados Generales o de la mitad de sus miembros.",
      "d) A petición del Gobierno Vasco, de las Diputaciones Forales de las ¾ partes de sus miembros."
    ],
    "correct": 1
  },
  {
    "question": "3. De acuerdo con el Estatuto de Autonomía del País Vasco, ¿cuál es la afirmación correcta?",
    "options": [
      "a) El euskera y el castellano son las lenguas propias del Pueblo Vasco.",
      "b) El euskera es oficial en las zonas vascoparlantes de la Comunidad Autónoma de Euskadi.",
      "c) Todos los habitantes de Euskadi tienen el deber de conocer y el derecho de usar el euskera.",
      "d) El euskera, lengua propia del Pueblo Vasco, tiene carácter de lengua cooficial de Euskadi, y todos sus habitantes tienen derecho a conocerla y usarla."
    ],
    "correct": 3
  },
  {
    "question": "4. ¿Cómo definirías la competencia de la Comunidad Autónoma de Euskadi en materia de “turismo y deporte, ocio y esparcimiento”?",
    "options": [
      "a) Competencia exclusiva.",
      "b) Competencia de desarrollo legislativo y ejecución.",
      "c) Competencia exclusivamente de ejecución.",
      "d) Competencia exclusiva de los Territorios Históricos."
    ],
    "correct": 0
  },
  {
    "question": "5. La competencia “Cooperativas, Mutualidades no integradas en la Seguridad Social y Pósitos, conforme a la legislación general en materia mercantil” es una:",
    "options": [
      "a) Competencia exclusiva.",
      "b) Competencia de desarrollo legislativo y ejecución.",
      "c) Competencia exclusivamente de ejecución.",
      "d) Competencia exclusiva de los Territorios Históricos."
    ],
    "correct": 0
  },
  {
    "question": "6. “Normas procesales y de procedimientos administrativo y económico-administrativo que se deriven de las especialidades del derecho sustantivo y de la organización propia del País Vasco” es una:",
    "options": [
      "a) Competencia exclusiva.",
      "b) Competencia de desarrollo legislativo y ejecución.",
      "c) Competencia exclusivamente de ejecución.",
      "d) Competencia exclusiva de los Territorios Históricos."
    ],
    "correct": 0
  },
  {
    "question": "7. “Salvamento marítimo y vertidos industriales y contaminantes en las aguas territoriales del Estado correspondientes al litoral vasco” es una:",
    "options": [
      "a) Competencia exclusiva.",
      "b) Competencia de ejecución de la legislación del Estado.",
      "c) Competencia exclusiva de los Territorios Históricos.",
      "d) Competencia de desarrollo legislativo y ejecución."
    ],
    "correct": 1
  },
  {
    "question": "8. ¿Quién aprueba los presupuestos del Parlamento Vasco?",
    "options": [
      "a) El Gobierno Vasco.",
      "b) El Lehendakari.",
      "c) El propio Parlamento Vasco.",
      "d) El Consejo de Gobierno."
    ],
    "correct": 2
  },
  {
    "question": "9. “Desarrollo comunitario. Condición femenina. Política Infantil, juvenil y de la tercera edad” es una:",
    "options": [
      "a) Competencia exclusiva.",
      "b) Competencia de desarrollo legislativo y ejecución.",
      "c) Competencia exclusivamente de ejecución.",
      "d) Competencia exclusiva de los Territorios Históricos."
    ],
    "correct": 0
  },
  {
    "question": "10. ¿Quién impulsará particularmente una política tendente a la mejora de las condiciones de vida y trabajo?",
    "options": [
      "a) Los poderes públicos vascos.",
      "b) El Gobierno Vasco.",
      "c) El Lehendakari.",
      "d) El Parlamento Vasco."
    ],
    "correct": 0
  },
  {
    "question": "11. Los miembros del Parlamento Vasco son elegidos:",
    "options": [
      "a) En igual número por cada Territorio Histórico para un período de 4 años.",
      "b) En igual número por cada Territorio Histórico para un período de 5 años.",
      "c) Proporcionalmente a la población del Territorio Histórico para un periodo de 4 años.",
      "d) Proporcionalmente a la población del Territorio Histórico para un periodo de 5 años."
    ],
    "correct": 0
  },
  {
    "question": "12. En la actualidad, el Territorio Histórico de Álava elige a:",
    "options": [
      "a) 20 parlamentarios.",
      "b) 25 parlamentarios.",
      "c) 30 parlamentarios.",
      "d) 15 parlamentarios."
    ],
    "correct": 1
  },
  {
    "question": "13. ¿Cómo se regulan las causas de inelegibilidad e incompatibilidad de los parlamentarios vascos?",
    "options": [
      "a) Mediante una Ley.",
      "b) Mediante un Decreto del Parlamento Vasco.",
      "c) Mediante un Decreto.",
      "d) Mediante una Ley Electoral del Parlamento Vasco."
    ],
    "correct": 3
  },
  {
    "question": "14. Los miembros del Parlamento Vasco, durante su mandato, por los actos delictivos cometidos en el ámbito territorial de la Comunidad Autónoma, no podrán ser detenidos ni retenidos sino en caso de flagrante delito, correspondiendo decidir, en todo caso, sobre su inculpación, prisión, procesamiento y juicio al:",
    "options": [
      "a) TC.",
      "b) TS.",
      "c) Audiencia Nacional.",
      "d) TSJPV."
    ],
    "correct": 3
  },
  {
    "question": "15. Podrán agregarse a la Comunidad Autónoma del País Vasco otros territorios o municipios que estuvieran enclavados en su totalidad dentro del territorio de la misma, mediante el cumplimiento de una serie de requisitos. Señala la respuesta correcta:",
    "options": [
      "a) Será necesario que lo apruebe el Parlamento del País Vasco y las Cortes Generales del Estado simultáneamente, mediante Ley.",
      "b) Será necesario que lo apruebe el Parlamento del País Vasco y, posteriormente, las Cortes Generales del Estado, mediante Ley Orgánica.",
      "c) Será necesario que lo apruebe el Parlamento del País Vasco y, posteriormente, las Cortes Generales del Estado, mediante Ley.",
      "d) Será necesario que lo aprueben las Cortes Generales del Estado mediante Ley previa audiencia del Parlamento Vasco."
    ],
    "correct": 1
  },
  {
    "question": "16. A los efectos del Estatuto de Autonomía del País Vasco, tiene la condición política de vascos:",
    "options": [
      "a) Quienes tengan la vecindad civil de acuerdo con las Leyes Generales del Estado, en cualquiera de los municipios integrados en el territorio de la Comunidad Autónoma.",
      "b) Quienes tengan la vecindad administrativa de acuerdo con las Leyes Generales del Estado, en cualquiera de los municipios integrados en el territorio de la Comunidad Autónoma.",
      "c) Quienes tengan la vecindad civil administrativa de acuerdo con las Leyes Generales del Estado, en cualquiera de los municipios integrados en el territorio de la Comunidad Autónoma.",
      "d) Quienes tengan la vecindad administrativa en cualquiera de los municipios integrados en el territorio de la Comunidad Autónoma."
    ],
    "correct": 1
  },
  {
    "question": "17. La designación de la sede de las instituciones comunes de la CAPV se efectúa:",
    "options": [
      "a) Por el propio Estatuto de Autonomía.",
      "b) Por una Ley de las Cortes Generales.",
      "c) Por una Ley del Parlamento Vasco.",
      "d) Por Decreto del Gobierno Vasco."
    ],
    "correct": 2
  },
  {
    "question": "18. Los periodos ordinarios de sesiones en el Parlamento Vasco durarán como máximo:",
    "options": [
      "a) 8 meses al año.",
      "b) 9 meses al año.",
      "c) 10 meses al año.",
      "d) Ninguna es correcta."
    ],
    "correct": 3
  },
  {
    "question": "19. En las elecciones al Parlamento Vasco, la circunscripción electoral es:",
    "options": [
      "a) La comarca.",
      "b) El Territorio Histórico.",
      "c) El Municipio.",
      "d) La Comunidad Autónoma."
    ],
    "correct": 1
  },
  {
    "question": "20. El territorio de la Comunidad Autónoma del País Vasco quedará integrado por los Territorios Históricos que coinciden con las provincias, en sus actuales límites, de Álava, Guipúzcoa y Vizcaya, así como la de Navarra, en el supuesto de que esta última decida su incorporación de acuerdo con el procedimiento establecido en la:",
    "options": [
      "a) Disposición final quinta de la Constitución.",
      "b) Disposición final segunda de la Constitución.",
      "c) Disposición transitoria cuarta de la Constitución.",
      "d) Disposición adicional quinta de la Constitución."
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.resultadosFinales.classList.add('hidden');
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');
                DOM.finalizarBtn.textContent = 'Finalizar Test';

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function mostrarResultados() {
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                // Recalcular el recuento total acumulado
                let correctas = 0;
                let incorrectas = 0;
                preguntas.forEach(p => {
                    if (p.comprobada) {
                        if (p.esCorrecta) correctas++;
                        else incorrectas++;
                    }
                });

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${correctas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${incorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function toggleFinalizarTest() {
                if (DOM.resultadosFinales.classList.contains('hidden')) {
                    mostrarResultados();
                } else {
                    mostrarPregunta();
                }
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, finalizar test, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
