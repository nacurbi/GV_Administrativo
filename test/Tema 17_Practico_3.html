<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema 17_Practico_3</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>TEMA 17. LEY 19/2013 · SUPUESTO PRÁCTICO 3</strong></p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <details class="supuesto hidden" id="supuesto" open><summary>Supuesto práctico</summary><div id="supuesto-texto"></div></details>
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="referencia hidden" id="referencia"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const supuestos = ["<p>Don Jon Ander Enriquez ha presentado en ZUZENEAN (dependiente del Gobierno Vasco) una solicitud de información pública acerca de unos supuestos prácticos, correspondientes a exámenes que no han sido publicados de convocatorias de 2018, ya terminadas. Dicha solicitud, dirigida a la Diputación Foral de Álava, adolece de alguno los requisitos del Art. 66 de la Ley 39/2015.</p>"];
            let preguntas = [
  {
    "question": "1. Ante la falta de los requisitos citados de la solicitud la Diputación procederá a:",
    "options": [
      "a) Requerir al interesado para que, en un plazo de quince días, subsane la falta o acompañe los documentos preceptivos, con indicación de que, si así no lo hiciera, se le tendrá por desistido de su petición, previa resolución que deberá ser dictada en los términos previstos en el artículo 21.",
      "b) Si se aprecia que el requisito que falta no es subsanable, el expediente se archivará sin más trámite.",
      "c) Se trata de información acerca de procedimientos selectivos o de concurrencia competitiva, así que se le tendrá por desistido de su petición.",
      "d) Se requerirá al interesado para que, en un plazo de diez días, subsane la falta."
    ],
    "correct": 3,
    "caso": 0
  },
  {
    "question": "2. Supongamos que la Diputación actúa de la forma establecida en la Ley 19/2013 y transcurridos 20 días desde la correspondiente notificación al interesado, se constata que este no ha realizado actuación alguna.",
    "options": [
      "a) La administración vuelve a requerirle para la subsanación de la solicitud.",
      "b) La administración dictará resolución, en los términos del artículo 19 de la Ley 19/2013, teniéndole por desistido de su petición.",
      "c) La administración dictará resolución, según lo indicado por el artículo 19 de la Ley 19/2013, decretando la renuncia a la solicitud.",
      "d) La administración procederá al archivo del expediente, sin más trámites, tal como indica el artículo 19 de la Ley 19/2013."
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "3. Supongamos que, tras la subsanación en plazo, la Diputación decide publicar la información solicitada, dado que detecta que se trata de un error. ¿Qué debería hacer con la solicitud del Sr. Enriquez?",
    "options": [
      "a) Resolverá favorablemente, remitiéndole la información solicitada también por correo postal.",
      "b) Resolverá denegando el acceso a la información, indicándole cómo puede acceder a la información recientemente publicada en la sede electrónica.",
      "c) Inadmitirá a trámite la solicitud, indicándole cómo puede acceder a la información publicada.",
      "d) Podrá resolver la resolución de manera favorable, e indicar al interesado cómo puede acceder a la información solicitada."
    ],
    "correct": 2,
    "caso": 0
  },
  {
    "question": "4. La Diputación, a la vista de la solicitud presentada por Don J. Enriquez, y al detectar que éste ha actuado en representación de la Academia Opebider, S.L.:",
    "options": [
      "a) Procederá a requerir la subsanación del acto de presentación, no así la acreditación de la representación.",
      "b) Procederá a requerir la acreditación de la representación, no así la subsanación del acto de presentación.",
      "c) Procederá a requerir tanto la subsanación del acto de presentación como la acreditación de la representación.",
      "d) No será necesario realizar ningún tipo de requerimiento de subsanación por parte de la Diputación, bastará con consultar al Registro Electrónico de Apoderamientos."
    ],
    "correct": 2,
    "caso": 0
  },
  {
    "question": "5. ¿Qué plazo tiene la Diputación para resolver y notificar la resolución al interesado?",
    "options": [
      "a) La Administración dispone de 1 mes, ampliable por otro más, tal como indica el artículo 20 de la Ley 19/2013, a contar desde que la solicitud ha tenido entrada en Zuzenean.",
      "b) La Administración dispone de 2 meses, tal como indica el artículo 20 de la Ley 19/2013, a contar desde que ha tenido entrada la solicitud en el órgano competente para resolver de Diputación.",
      "c) La Administración dispone de 1 mes, ampliable por otro más, tal como indica el artículo 20 de la Ley 19/2013, a contar desde que ha tenido entrada la solicitud en el registro electrónico de Diputación.",
      "d) Ninguna es correcta."
    ],
    "correct": 3,
    "caso": 0
  },
  {
    "question": "6. Transcurrido el plazo contemplado en la pregunta anterior sin que la Diputación haya notificado nada a Don J. Enriquez:",
    "options": [
      "a) Se entenderá desestimado el procedimiento, pues se enmarca dicha solicitud en el procedimiento del ejercicio del derecho de petición.",
      "b) Se entenderá desestimado el procedimiento, pues así lo indica una norma con rango de Ley.",
      "c) Se entenderá desestimado el procedimiento, por suponer transferencia al interesado de información relativa al dominio público.",
      "d) Se entenderá desestimado el procedimiento, pues así lo indica la ley 39/2015 de procedimiento administrativo común."
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "7. Al final, la Diputación resuelve la solicitud de manera desfavorable a los intereses de la Academia Opebider, S.L.. Tras recibir Don J. Enriquez la notificación:",
    "options": [
      "a) Queda expedita la vía contencioso-administrativa.",
      "b) Tendrá que presentar la reclamación que viene a sustituir al recurso contemplada en la Ley 19/2013.",
      "c) Podrá presentarse, potestativamente, el recurso de reposición.",
      "d) Todas son correctas"
    ],
    "correct": 0,
    "caso": 0
  },
  {
    "question": "8. Don J. Enriquez decide presentar una reclamación ante la Comisión Vasca de Acceso a la Información Pública (órgano que sustituye, en el ámbito de la CAPV, al Consejo de Transparencia y Buen Gobierno):",
    "options": [
      "a) Don J. Enriquez dispone de 3 meses para presentar dicha reclamación, y dicha autoridad administrativa dispone de 1 mes para resolver y notificar.",
      "b) Don J. Enriquez dispone de 1 mes para presentar dicha reclamación, y dicha autoridad administrativa dispone de 3 meses para resolver y notificar.",
      "c) Don J. Enriquez dispone de 1 meses para presentar dicha reclamación, y dicha autoridad administrativa dispone de 1 mes para resolver y notificar.",
      "d) Ninguna es correcta."
    ],
    "correct": 1,
    "caso": 0
  },
  {
    "question": "9. En caso de que la Comisión Vasca de Acceso a la Información Pública dicte resolución favorable a los intereses de la Academia Opebider, S.L.:",
    "options": [
      "a) La Diputación, en ejecución de dicha resolución, le otorgará el acceso a la información solicitada por vía electrónica, en el mismo momento de la notificación.",
      "b) La Diputación, en ejecución de dicha resolución, le otorgará el acceso a la información en papel, tal como lo ha solicitado Don. J. Enriquez, bien en el momento de notificar o, como mucho en un plazo no superior a 10 días.",
      "c) La Diputación, en ejecución de dicha resolución, le otorgará el acceso a la información solicitada por vía electrónica, bien en el momento de notificar o, como mucho en un plazo no superior a 10 días.",
      "d) La Diputación, en ejecución de dicha resolución, le otorgará el acceso a la información en papel, tal como lo ha solicitado Don. J. Enriquez, en el mismo momento de la notificación."
    ],
    "correct": 2,
    "caso": 0
  },
  {
    "question": "10. Don J. Enriquez, de naturaleza curiosa, en su tiempo libre también ha presentado una solicitud ante la Casa de S. M. El Rey para conocer información sobre las liberalidades y regalos entregados por dicha institución las pasadas Navidades, la cual también ha resultado denegada. Tras recibir Don J. Enriquez la notificación:",
    "options": [
      "a) Antes de acudir a la jurisdicción contencioso-administrativa, deberá interponer la reclamación que viene a sustituir al recurso de alzada contemplada en la Ley 19/2013.",
      "b) Podrá presentar la reclamación que viene a sustituir al recurso de reposición contemplada en la Ley 19/2013 o interponer recurso contencioso-administrativo, indistintamente.",
      "c) Únicamente podrá presentar recurso ante la jurisdicción contencioso-administrativa.",
      "d) No cabe ningún tipo de recurso o reclamación más que el Recurso de Amparo ante el Tribunal Constitucional."
    ],
    "correct": 2,
    "caso": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    [].concat(pregunta.correct).forEach(c => toggleClasses(botonesOpciones[c], 'correcta'));

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;
                const sup = document.getElementById('supuesto');
                if (pregunta.caso != null && supuestos[pregunta.caso]) {
                    if (sup.dataset.caso !== String(pregunta.caso)) { document.getElementById('supuesto-texto').innerHTML = supuestos[pregunta.caso]; sup.dataset.caso = pregunta.caso; }
                    sup.classList.remove('hidden');
                } else sup.classList.add('hidden');
                const ref = document.getElementById('referencia');
                ref.textContent = pregunta.ref || '';
                ref.classList.toggle('hidden', !(pregunta.comprobada && pregunta.ref));

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index] || '';
                    boton.classList.toggle('hidden', pregunta.options[index] === undefined);
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = [].concat(pregunta.correct).includes(pregunta.respuestaUsuario);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();
                if (pregunta.ref) document.getElementById('referencia').classList.remove('hidden');

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
