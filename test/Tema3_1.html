<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema3_1</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>TEMA 3. PROTECCIÓN DE DATOS:</strong> LO 3/2018, de Protección de Datos Personales y garantía de los derechos digitales (Test 1)</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. Los datos serán:",
    "options": [
      "a) Verdaderos y, si fuere necesario, actualizados.",
      "b) Inequívocos y, si fuere necesario, actualizados.",
      "c) Exactos y, si fuere necesario, actualizados.",
      "d) Exactos y, en cualquier caso, actualizados."
    ],
    "correct": 2
  },
  {
    "question": "2. No será imputable al responsable del tratamiento, siempre que este haya adoptado todas las medidas razonables para que se supriman o rectifiquen sin dilación, la inexactitud de los datos personales, con respecto a los fines para los que se tratan, cuando los datos inexactos: (Señala la respuesta incorrecta)",
    "options": [
      "a) Hubiesen sido obtenidos por el responsable directamente del afectado.",
      "b) Hubiesen sido obtenidos por el responsable de un mediador o intermediario.",
      "c) Fuesen sometidos a tratamiento por el responsable por haberlos recibido de otro responsable.",
      "d) Fuesen obtenidos de un registro público por el encargado del tratamiento de datos."
    ],
    "correct": 3
  },
  {
    "question": "3. ¿Quiénes están sujetos al deber de confidencialidad al que se refiere el artículo 5.1.f) del Reglamento (UE) 2016/679?",
    "options": [
      "a) Los responsables y encargados del tratamiento de datos así como todas las personas que intervengan en cualquier fase del tratamiento.",
      "b) Los responsables del tratamiento, exclusivamente.",
      "c) Los encargados del tratamiento así como todas las personas que intervengan en cualquier fase del tratamiento.",
      "d) Ninguna es correcta."
    ],
    "correct": 0
  },
  {
    "question": "4. El deber de confidencialidad se mantendrá:",
    "options": [
      "a) Aun cuando hubiese finalizado la relación del obligado con el responsable o encargado del tratamiento.",
      "b) Por un periodo de 10 años, en todo caso.",
      "c) Por un periodo de 6 años, salvo excepciones.",
      "d) Únicamente durante el tiempo de tratamiento de los datos de carácter personal."
    ],
    "correct": 0
  },
  {
    "question": "5. ¿Qué se entiede por consentimiento del afectado?",
    "options": [
      "a) Toda manifestación de voluntad libre, específica, informada e inequívoca por la que este acepta, ya sea mediante una declaración o una clara acción afirmativa, el tratamiento de datos personales que le conciernen.",
      "b) Toda manifestación de voluntad libre, específica, informada e inequívoca por la que este acepta, mediante una declaración formal, el tratamiento de datos personales que le conciernen.",
      "c) Toda manifestación de voluntad libre, clara, informada e inequívoca por la que este acepta, ya sea mediante una declaración o una acción afirmativa específica, el tratamiento de datos personales que le conciernen.",
      "d) Toda manifestación de voluntad libre, veraz, específica, informada e inequívoca por la que este acepta, ya sea mediante una declaración o una clara acción afirmativa, el tratamiento de datos personales que le conciernen."
    ],
    "correct": 0
  },
  {
    "question": "6. El tratamiento de los datos personales de un menor de edad únicamente podrá fundarse en su consentimiento cuando sea mayor de:",
    "options": [
      "a) 14 años.",
      "b) 15 años.",
      "c) 16 años.",
      "d) 18 años."
    ],
    "correct": 0
  },
  {
    "question": "7. El tratamiento de datos personales solo podrá considerarse fundado en el cumplimiento de una misión realizada en interés público o en el ejercicio de poderes públicos conferidos al responsable, cuando derive de una competencia atribuida por:",
    "options": [
      "a) Una norma con rango de ley.",
      "b) Una norma con rango reglamentario.",
      "c) Las respuestas a) y b) son correctas.",
      "d) Las respuestas a) y b) son incorrectas."
    ],
    "correct": 0
  },
  {
    "question": "8. El tratamiento de datos personales relativos a condenas e infracciones penales, así como a procedimientos y medidas cautelares y de seguridad conexas, para fines distintos de los de prevención, investigación, detección o enjuiciamiento de infracciones penales o de ejecución de sanciones penales, solo podrá llevarse a cabo cuando se encuentre amparado en:",
    "options": [
      "a) Una norma de Derecho de la Unión.",
      "b) La Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales.",
      "c) Otras normas de rango legal.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "9. Cuando los datos personales sean obtenidos del afectado, el responsable del tratamiento podrá dar cumplimiento al deber de información establecido en el artículo 13 del Reglamento (UE) 2016/679 facilitando al afectado determinada información básica e indicándole una dirección electrónica u otro medio que permita acceder de forma sencilla e inmediata a la restante información. La información básica a la que se refiere esta pregunta, deberá contener, al menos: (Señala la respuesta que no es cierta)",
    "options": [
      "a) La identidad del responsable del tratamiento y de su representante, en su caso.",
      "b) La finalidad del tratamiento.",
      "c) La posibilidad de ejercer los derechos establecidos en los artículos 15 a 22 del Reglamento (UE) 2016/679.",
      "d) Las fuentes de las que procedieran los datos."
    ],
    "correct": 3
  },
  {
    "question": "10. Cuando los datos personales no hubieran sido obtenidos del afectado, el responsable podrá dar cumplimiento al deber de información establecido en el artículo 14 del Reglamento (UE) 2016/679 facilitando a aquel determinada información básica e indicándole una dirección electrónica u otro medio que permita acceder de forma sencilla e inmediata a la restante información. La información básica a la que se refiere esta pregunta, deberá contener, además: (Señala la respuesta que es cierta)",
    "options": [
      "a) Las categorías de datos objeto de tratamiento.",
      "b) Las fuentes de las que procedieran los datos.",
      "c) Los plazos para ejercitar los derechos de portabilidad, rectificación y supresión.",
      "d) Las respuestas a) y b) son correctas."
    ],
    "correct": 3
  },
  {
    "question": "11. Los derechos de acceso, rectificación, supresión, oposición, portabilidad y limitación del tratamiento reconocidos en los artículos 15 a 22 del Reglamento (UE) 2016/679, podrán ejercerse:",
    "options": [
      "a) Directamente.",
      "b) Por medio de representante legal o voluntario.",
      "c) Las respuestas a) y b) son correctas.",
      "d) Las respuestas a) y b) son incorrectas."
    ],
    "correct": 2
  },
  {
    "question": "12. Señala la respuesta correcta en relación con el derecho de acceso:",
    "options": [
      "a) Cuando el responsable trate una gran cantidad de datos relativos al afectado y este ejercite su derecho de acceso sin especificar si se refiere a todos o a una parte de los datos, el responsable deberá solicitarle, antes de facilitar la información, que el afectado especifique los datos o actividades de tratamiento a los que se refiere la solicitud.",
      "b) El derecho de acceso se entenderá otorgado si el responsable del tratamiento facilitara al afectado un sistema de acceso remoto, y directo a los datos personales que garantice, de modo permanente, el acceso a su totalidad. A tales efectos, la comunicación por el responsable al afectado del modo en que este podrá acceder a dicho sistema bastará para tener por atendida la solicitud de ejercicio del derecho.",
      "c) Se podrá considerar repetitivo el ejercicio del derecho de acceso en más de una ocasión durante el plazo de 6 meses, a menos que exista causa legítima para ello.",
      "d) A pesar de que el afectado elija un medio distinto al que se le ofrece que suponga un coste desproporcionado, la solicitud no será considerada excesiva, por lo que dicho afectado no asumirá el exceso de costes que su elección comporte."
    ],
    "correct": 2
  },
  {
    "question": "13. El derecho de oposición se ejercerá de acuerdo con lo establecido en el artículo:",
    "options": [
      "a) 21 y 22 del Reglamento (UE) 2016/679.",
      "b) 17 del Reglamento (UE) 2016/679.",
      "c) 18 del Reglamento (UE) 2016/679.",
      "d) 19 y 20 del Reglamento (UE) 2016/679."
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
