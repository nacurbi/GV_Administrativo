<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 1 Fuentes del Derecho</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 10px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn, #finalizar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover, #finalizar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .resultados-finales-container {
            text-align: center;
        }
        .resultados-finales-texto {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .resultados-finales-correctas {
            color: #155724;
            font-weight: bold;
        }
        .resultados-finales-incorrectas {
            color: #721c24;
            font-weight: bold;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test" style="text-align: justify;"><strong>TEST 1: Fuentes del Derecho</strong></p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
            <div id="resultados-finales" class="hidden resultados-finales-container">
                <h2>Resultados Finales</h2>
                <div id="resultados-texto" class="resultados-finales-texto"></div>
            </div>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
            <button id="finalizar-btn" class="comprobar-btn" style="width: 100%; margin-top: 20px;">Finalizar Test</button>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. De acuerdo con lo previsto en el Código Civil, las normas jurídicas contenidas en los tratados internacionales:",
    "options": [
      "a) En ningún caso puede llegar a tener aplicación directa en España.",
      "b) Aunque no pueden llegar a tener aplicación directa en España, tendrán carácter informador del ordenamiento jurídico interno.",
      "c) Serán de aplicación directa en España desde la firma del tratado internacional correspondiente.",
      "d) Serán de aplicación directa en España cuando hayan pasado a formar parte del ordenamiento interno."
    ],
    "correct": 3
  },
  {
    "question": "2 . ¿Cuál de las siguientes materias sí es regulable por medio de decreto ley?",
    "options": [
      "a) El régimen de las Comunidades Autónomas.",
      "b) El derecho electoral general.",
      "c) Los derechos y deberes de los ciudadanos regulados en el Título I de la Constitución.",
      "d) Las materias objeto de ley ordinaria."
    ],
    "correct": 3
  },
  {
    "question": "3. Si se dicta una ley de bases ¿qué contenido tendrá el decreto legislativo de desarrollo?",
    "options": [
      "a) Texto articulado.",
      "b) Ley ordinaria.",
      "c) Texto refundido.",
      "d) Texto delegado."
    ],
    "correct": 0
  },
  {
    "question": "4. ¿Cuándo se aplica la costumbre como fuente de derecho?",
    "options": [
      "a) En defecto de ley aplicable.",
      "b) En cualquier caso en que resulte de aplicación por razón de la materia.",
      "c) En cualquier caso aunque exista ley aplicable.",
      "d) Cuando no existan principios generales del derecho aplicables al caso."
    ],
    "correct": 0
  },
  {
    "question": "5. Las disposiciones que contradigan lo establecido en una norma de carácter superior:",
    "options": [
      "a) Son nulas de pleno derecho.",
      "b) Deben ser recurridas ante el Tribunal Constitucional.",
      "c) Deben ser recurridas ante el Tribunal Supremo.",
      "d) Son anuladas por las Cortes Generales."
    ],
    "correct": 0
  },
  {
    "question": "6. ¿Qué artículo del Código Civil establece las fuentes del Derecho?",
    "options": [
      "a) El art. 9.",
      "b) El art. 1.",
      "c) El art. 18.",
      "d) El art. 35."
    ],
    "correct": 1
  },
  {
    "question": "7. La potestad reglamentaria de la Administración Pública es controlada por:",
    "options": [
      "a) El Gobierno Central y Autonómico.",
      "b) El Tribunal Constitucional.",
      "c) Los Tribunales ordinarios.",
      "d) Las Cortes Generales."
    ],
    "correct": 2
  },
  {
    "question": "8. En caso de extraordinaria y urgente necesidad el Gobierno Vasco podrá dictar disposiciones legislativas provisionales que tomarán la forma de:",
    "options": [
      "a) Decreto Legislativo.",
      "b) Texto refundido.",
      "c) Decreto Ley.",
      "d) Orden ministerial."
    ],
    "correct": 2
  },
  {
    "question": "9. No es fuente directa del derecho administrativo:",
    "options": [
      "a) La costumbre.",
      "b) La ley.",
      "c) La doctrina.",
      "d) Los principios generales del derecho."
    ],
    "correct": 2
  },
  {
    "question": "10. El principio de jerarquía de las fuentes del derecho administrativo:",
    "options": [
      "a) Implica que las normas estatales están por encima de las autonómicas.",
      "b) Determina que la norma inferior deroga a la anterior en caso de contradicción entre ellas.",
      "c) No se aplica en las relaciones entre las leyes ordinarias y las orgánicas.",
      "d) Implica que la ley se subordina al reglamento."
    ],
    "correct": 2
  },
  {
    "question": "11. La reserva de ley significa:",
    "options": [
      "a) Que la ley se sitúa en la posición más elevada de la pirámide normativa.",
      "b) Que no es posible negarse a la aplicación o cumplimiento de la ley.",
      "c) Que el enjuiciamiento de la ley compete en exclusiva o está reservado al Tribunal Constitucional.",
      "d) Que determinadas materias establecidas por la Constitución sólo pueden ser reguladas por una norma con rango legal."
    ],
    "correct": 3
  },
  {
    "question": "12. Los principios generales del derecho:",
    "options": [
      "a) Son fuente indirecta.",
      "b) Tienen un valor normativo superior a la costumbre.",
      "c) Son fuente de aplicación en defecto de ley y costumbre.",
      "d) Es cierta la b) sin perjuicio de su carácter informador del ordenamiento jurídico."
    ],
    "correct": 2
  },
  {
    "question": "13. En la Ley Marco:",
    "options": [
      "a) Se fijan los principios para desarrollar las disposiciones normativas de las CCAA cuando lo exija el interés general.",
      "b) Se transferirán facultades de titularidad estatal a las Comunidades, mediante ley orgánica.",
      "c) Se establecerá la modalidad de control de las Cortes Generales sobre determinadas normas legislativas de las Comunidades.",
      "d) Podrá otorgarse delegación legislativa al Gobierno para que armonice actuaciones autonómicas cuando así lo exija el interés general."
    ],
    "correct": 0
  },
  {
    "question": "14. La aprobación, modificación o derogación de una ley orgánica exigirá:",
    "options": [
      "a) La mayoría absoluta del Congreso.",
      "b) La mayoría absoluta del Senado.",
      "c) La mayoría absoluta de las Cortes.",
      "d) La mayoría simple del Congreso, en votación final sobre el conjunto del proyecto."
    ],
    "correct": 0
  },
  {
    "question": "15. La delegación legislativa efectuada por las Cortes Generales en favor del Gobierno, con el fin de formar un Texto Articulado, deberán realizarse:",
    "options": [
      "a) A través de una Ley Marco.",
      "b) A través de una Ley de transferencia.",
      "c) A través de una Ley Ordinaria.",
      "d) A través de una Ley de Bases."
    ],
    "correct": 3
  },
  {
    "question": "16. De acuerdo con lo establecido en la CE, los decretos leyes:",
    "options": [
      "a) Deberán ser inmediatamente sometidos a debate y votación de las Cortes Generales para su promulgación.",
      "b) Deberán ser convalidados o derogados por el Congreso en el plazo de 30 días.",
      "c) Habrán de ser convalidados o derogados por la totalidad del Senado.",
      "d) Podrán ser tramitados como proyectos de ley en el plazo de 30 días por las Cortes Generales."
    ],
    "correct": 1
  },
  {
    "question": "17. De acuerdo con la CE, el contenido reservado a las leyes orgánicas se regula en el artículo:",
    "options": [
      "a) 91.",
      "b) 82.",
      "c) 81.",
      "d) 86."
    ],
    "correct": 2
  },
  {
    "question": "18. La cámara baja del poder legislativo estatal es:",
    "options": [
      "a) Congreso.",
      "b) Senado.",
      "c) Cortes Generales.",
      "d) Ninguna es correcta."
    ],
    "correct": 0
  },
  {
    "question": "19. ¿El Gobierno Central puede dictar normas con rango de Ley?",
    "options": [
      "a) Sí, en cualquier tipo de materias.",
      "b) Sí, pero sólo decretos leyes.",
      "c) Sí, pero sólo decretos legislativos.",
      "d) Las respuestas b) y c) son correctas."
    ],
    "correct": 3
  },
  {
    "question": "20. ¿Cuál de las siguientes instancias es posible que no exista?",
    "options": [
      "a) Juzgados de Paz.",
      "b) Juzgados de lo Mercantil.",
      "c) Audiencia Nacional.",
      "d) Juzgados de 1º instancia."
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.resultadosFinales.classList.add('hidden');
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');
                DOM.finalizarBtn.textContent = 'Finalizar Test';

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function mostrarResultados() {
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                // Recalcular el recuento total acumulado
                let correctas = 0;
                let incorrectas = 0;
                preguntas.forEach(p => {
                    if (p.comprobada) {
                        if (p.esCorrecta) correctas++;
                        else incorrectas++;
                    }
                });

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${correctas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${incorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function toggleFinalizarTest() {
                if (DOM.resultadosFinales.classList.contains('hidden')) {
                    mostrarResultados();
                } else {
                    mostrarPregunta();
                }
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, finalizar test, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
