<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema 21_1</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>TEMA 21.</strong> La ciudadanía como destinataria de los servicios y prestaciones públicas. Información y atención al público. Quejas y reclamaciones. Personas con discapacidad. Atención intercultural (Test 1)</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. La herramienta a través de la cual se informa a la ciudadanía sobre los servicios de la Administración correspondiente, así como los derechos asociados, como los compromisos de calidad de la prestación de dichos servicios, son:",
    "options": [
      "a) Las cartas de servicio.",
      "b) Las instrucciones.",
      "c) Las órdenes de servicio.",
      "d) Ninguna es correcta."
    ],
    "correct": 0
  },
  {
    "question": "2. Señala la respuesta falsa:",
    "options": [
      "a) Las Oficinas de Atención Ciudadana son dependencias o espacios físicos que la Administración dedica al contacto directo con la ciudadanía a los efectos de obtención de información, orientación y asesoramiento sobre las prestaciones, servicios y procedimientos; la recepción de documentación, solicitudes y comunicaciones; la práctica de comparecencias personales de las personas interesadas o, por último, la realización de gestiones indirectamente relacionadas con las competencias o servicios de la Administración.",
      "b) En la atención ciudadana, en el momento de la Acogida, es muy difícil responder a dos demandas al mismo tiempo, lo que hace que haya que priorizar a uno de nuestros interlocutores.",
      "c) Las quejas y las reclamaciones son una acción basada en los derechos de la ciudadanía para recibir los servicios y las informaciones que se consideran de calidad.",
      "d) Las Oficinas y servicios de atención ciudadana deben contar con un conjunto de medidas de accesibilidad, salvo de manera excepcional cuando en el edificio en el que se ubique la oficina, o en su entorno, concurran circunstancias de infraestructura o protección del patrimonio que hagan su aplicación imposible material o económicamente."
    ],
    "correct": 0
  },
  {
    "question": "3. Atención ciudadana. Las reglas de priorización en el momento de la acogida son las siguientes: (señala la incorrecta)",
    "options": [
      "a) El cliente tiene prioridad sobre cualquier conversación privada.",
      "b) El cliente tiene prioridad sobre nuestros compañeros de trabajo.",
      "c) Cuando dos clientes le reclaman al mismo tiempo, la prioridad la tiene el que llegó en primer lugar (no incluye el teléfono).",
      "d) Hay que conceder algunos segundos al nuevo solicitante con el fin de organizar la reanudación del contacto o rogarle que espere."
    ],
    "correct": 2
  },
  {
    "question": "4. Mediante …………………………………… suscrito por distintas Administraciones públicas, podrá acordarse que desde las oficinas de información y atención de cualesquiera de ellas pueda ofrecerse la información administrativa de las otras, articulándose los mecanismos de comunicación necesarios para el intercambio de la información, así como la creación de oficinas integradas de información con participación de varias Administraciones.",
    "options": [
      "a) Convenio de colaboración.",
      "b) Acuerdo.",
      "c) Convenio.",
      "d) Las respuestas a) y c) son correctas."
    ],
    "correct": 3
  },
  {
    "question": "5. Las Oficinas de Atención al Ciudadano deben ubicarse en entornos que garanticen el acceso de las personas con discapacidad Por ello, las recomendaciones de ubicación son: (señala la incorrecta)",
    "options": [
      "a) Con carácter preferente y siempre que resulte posible, la Oficina se ubicará en planta a nivel de la vía pública. En caso contrario, deberá disponer de rampas de acceso o ascensores con características que permitan su uso autónomo y seguro por personas con discapacidad.",
      "b) La Oficina debe estar correctamente señalizada visualmente desde el exterior, de tal forma que sea fácilmente identificable. La señalización deberá ser diseñada de modo que resulte inteligible y comprensible por parte de las personas con discapacidad intelectual.",
      "c) Al menos uno de los itinerarios que una los accesos de la Oficina con la vía pública, con los servicios o edificaciones anexas y con los aparcamientos, deberá ser accesible de acuerdo con las condiciones establecidas para un itinerario urbano accesible.",
      "d) Las Oficinas de Atención al Ciudadano, en el caso de disponer de plazas de aparcamiento, reservarán un número suficiente de plazas, convenientemente señalizadas, destinadas en exclusividad a personas con movilidad reducida, con dimensiones adecuadas para el acceso lateral, posterior y anterior a los vehículos, garantizando la existencia de itinerarios accesibles entre las plazas y la propia Oficina."
    ],
    "correct": 3
  },
  {
    "question": "6. Oficinas de Atención al Ciudadano. Cuando las puertas sean acristaladas o de vidrios se protegerán de forma que se eviten roturas por impacto y se señalizarán mediante:",
    "options": [
      "a) tres bandas horizontales de 30 centímetros de ancho, de contraste cromático con el resto de la superficie, colocada, la primera, a una altura entre 135 y 145 centímetros, y la segunda entre 130 y 150 centímetros.",
      "b) tres bandas horizontales de 25 centímetros de ancho, de contraste cromático con el resto de la superficie, colocada, la primera, a una altura entre 110 y 120 centímetros, y la segunda entre 150 y 160 centímetros.",
      "c) dos bandas horizontales de 20 centímetros de ancho, de contraste cromático con el resto de la superficie, colocada, la primera, a una altura entre 100 y 120 centímetros, y la segunda entre 150 y 170 centímetros.",
      "d) dos bandas horizontales de 30 centímetros de ancho, de contraste cromático con el resto de la superficie, colocada, la primera, a una altura entre 120 y 140 centímetros, y la segunda entre 160 y 180 centímetros."
    ],
    "correct": 2
  },
  {
    "question": "7. Dentro de la accesibilidad cognitiva, ¿cuál de los siguientes ocupa un lugar importante?",
    "options": [
      "a) La señalización fácil.",
      "b) La lectura fácil.",
      "c) Las respuestas a) y b) son correctas.",
      "d) Las respuestas a) y b) son incorrectas."
    ],
    "correct": 1
  },
  {
    "question": "8. Según las Directrices Europeas para generar información de lectura fácil, las recomendaciones principales de los documentos son, entre otras: (señala la incorrecta)",
    "options": [
      "a) Fomentar tecnicismos, abreviaturas, iniciales, etc.",
      "b) Expresión de dos ideas como máximo en cada frase.",
      "c) Uso de metáforas o comparaciones.",
      "d) Todas son incorrectas."
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
