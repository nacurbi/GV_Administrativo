<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley_392015_Test3</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>LEY 39/2015, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN:</strong> Test 3</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. SEGÚN EL ART. 3 DE LA LEY 39/2015, TIENE CAPACIDAD DE OBRAR:",
    "options": [
      "a) Los menores incapacitados, cuando la extensión de la incapacitación afecte a al ejercicio y defensa de los derechos o intereses de que se trate.",
      "b) Los grupos de afectados, los patrimonios independientes o autónomos en todo caso.",
      "c) Las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a las normas civiles",
      "d) Todas son correctas."
    ],
    "correct": 2
  },
  {
    "question": "2. LOS REGISTROS MERCANTILES, DE LA PROPIEDAD, Y DE LOS PROTOCOLOS NOTARIALES SERÁN INTEROPERABLES CON:",
    "options": [
      "a) Los registros electrónicos generales de apoderamientos",
      "b) Los registros electrónicos particulares de apoderamientos",
      "c) a y b son correctas",
      "d) Ninguna es correcta"
    ],
    "correct": 2
  },
  {
    "question": "3. LOS MODELOS DE PODERES INSCRIBIBLES EN EL REGISTRO CUANDO SE CIRCUNSCRIBA A ACTUACIONES DE LA ADMINISTRACIÓN DE UNA COMUNIDAD AUTÓNOMA:",
    "options": [
      "a) Serán aprobados por cada Comunidad Autónoma",
      "b) Serán los mismos de la Administración del Estado",
      "c) Serán los que proponga el propio interesado",
      "d) Serán aprobados por el Gobierno del Estado"
    ],
    "correct": 0
  },
  {
    "question": "4. SEÑALE EL ENUNCIADO INCORRECTO. EL ART. 4 DE LA LEY 39/2015, BAJO EL TÍTULO DE “CONCEPTO DE INTERESADO”, CONTIENE LAS SIGUIENTES PREVISIONES:",
    "options": [
      "a) Se consideran interesados en el procedimiento administrativo quienes lo promuevan como titulares de derechos o intereses legítimos individuales o colectivos.",
      "b) Se consideran interesados en el procedimiento administrativo los que, sin haber iniciado el procedimiento, tengan derechos que puedan resultar afectados por la decisión que en el mismo se adopte.",
      "c) Se consideran interesadas en el procedimiento administrativo, sin haber iniciado el procedimiento ni personado en el mismo, las asociaciones y organizaciones representativas de intereses económicos y sociales cuyos intereses legítimos colectivos puedan resultar afectados por la resolución.",
      "d) Cuando la condición de interesado derivase de alguna relación jurídica transmisible, el derecho-habiente sucederá en tal condición cualquiera que sea el estado del procedimiento"
    ],
    "correct": 2
  },
  {
    "question": "5. EL APODERAMIENTO «APUD ACTA» SE OTORGARÁ: (SEÑALA LA INCORRECTA)",
    "options": [
      "a) mediante comparecencia electrónica en la correspondiente sede electrónica haciendo uso de los sistemas de firma electrónica previstos en esta Ley.",
      "b) mediante comparecencia personal en las oficinas de asistencia en materia de registros.",
      "c) mediante comparecencia postal en la forma que reglamentariamente se establezca",
      "d) todas son correctas."
    ],
    "correct": 2
  },
  {
    "question": "6. LOS PODERES INSCRITOS EN EL REGISTRO TENDRÁN UNA VALIDEZ DETERMINADA:",
    "options": [
      "a) mínima de 5 años a contar desde la fecha de inscripción",
      "b) máxima de 10 años a contar desde la fecha de inscripción",
      "c) máxima de 5 años a contar desde la fecha de inscripción",
      "d) mínima de 10 años a contar desde la fecha de inscripción"
    ],
    "correct": 2
  },
  {
    "question": "7. PODRÁ REVOCAR O PRORROGAR EL PODER:",
    "options": [
      "a) El poderdante en cualquier momento antes de la finalización del plazo de validez del poder",
      "b) El apoderado una vez finalizado el plazo de validez del poder",
      "c) El apoderado en cualquier momento antes de la finalización del plazo de validez del poder",
      "d) El poderdante una vez finalizado el plazo de validez del poder"
    ],
    "correct": 0
  },
  {
    "question": "8. LAS PRÓRROGAS OTORGADAS POR EL PODERDANTE AL REGISTRO TENDRÁN UNA VALIDEZ DETERMINADA:",
    "options": [
      "a) máxima de 1 años a contar desde la fecha de inscripción.",
      "b) máxima de 2 años a contar desde la fecha de inscripción.",
      "c) máxima de 5 años a contar desde la fecha de inscripción.",
      "d) máxima de 10 años a contar desde la fecha de inscripción."
    ],
    "correct": 2
  },
  {
    "question": "9. EL ARTÍCULO 14 DE LA LEY 39/2015, DE 1 DE OCTUBRE, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN DE LAS ADMINISTRACIONES PÚBLICAS, ESTABLECE QUE ESTÁN OBLIGADOS A RELACIONARSE ELECTRÓNICAMENTE CON LAS ADMINISTRACIÓNES PÚBLICAS:",
    "options": [
      "a) Las personas jurídicas.",
      "b) Quienes ejerzan una actividad profesional para la que se requiera colegiación obligatoria exceptuando a los notarios y registradores de la propiedad y mercantiles.",
      "c) Las entidades con o sin personalidad jurídica de acuerdo a sus estatutos.",
      "d) Los empleados de las Administraciones Públicas para cualquier trámite o actuación que realicen con ellas en su condición de administrados."
    ],
    "correct": 0
  },
  {
    "question": "10. LAS SOLICITUDES DE INSCRIPCIÓN DEL PODER, DE REVOCACIÓN, DE PRÓRROGA O DE DENUNCIA DEL MISMO:",
    "options": [
      "a) Deberán dirigirse al registro de la Administración u Organismo ante la que tenga efectos el poder donde quedará inscrita esta circunstancia",
      "b) Podrán dirigirse a cualquier registro, debiendo quedar inscrita esta circunstancia en el registro de la Administración u Organismo ante la que tenga efectos el poder",
      "c) Podrán dirigirse a cualquier registro en el que quedará inscrita esta circunstancia",
      "d) Deberán dirigirse al registro de la Administración u Organismo ante la que tenga efectos el poder y quedará inscrita esta circunstancia en cualquier registro"
    ],
    "correct": 1
  },
  {
    "question": "11. LAS SOLICITUDES DE INSCRIPCIÓN DEL PODER, DE REVOCACIÓN, DE PRÓRROGA O DE DENUNCIA DEL MISMO SURTIRÁN EFECTO:",
    "options": [
      "a) Desde la fecha en la que se produzca dicha inscripción",
      "b) Desde la fecha que se indique en dicha inscripción",
      "c) Un mes posterior a la fecha en la que se produzca dicha inscripción",
      "d) Ninguna es correcta"
    ],
    "correct": 0
  },
  {
    "question": "12. LAS ADMINISTRACIONES PÚBLICAS, A LOS EFECTOS DE LA IDENTIFICACIÓN DIGITAL, DEBERÁN GARANTIZAR EN TODO PROCEDIMIENTO, LA UTILIZACIÓN DE:",
    "options": [
      "a) Un sistema basado en certificados electrónicos cualificados de firma electrónica expedidos por prestadores incluidos en la ‘‘Lista de confianza de prestadores de servicios de certificación’’.",
      "b) Un sistema basado en certificados electrónicos cualificados de sello electrónico expedidos por prestadores incluidos en la ‘‘Lista de confianza de certificadores de servicios de certificación’’.",
      "c) Un sistema de clave concertada, siempre que cuente con un registro previo como usuario que permita garantizar su identidad, previa autorización por parte de la Secretaría General de Administración Digital del Ministerio de Política Territorial y Función Pública.",
      "d) Un sistema de clave concertada o un sistema basado en certificados electrónicos cualificados de firma electrónica expedidos por prestadores incluidos en la ‘‘Lista de confianza de prestadores de servicios de certificación’’"
    ],
    "correct": 0
  },
  {
    "question": "13. SISTEMA DE CERTIFICACIÓN DIGITAL. PARA QUE EL SISTEMA DE CLAVE CONCERTADA O CUALQUIER OTRO QUE LA ADMINISTRACIÓN CONSIDERE VÁLIDO PUEDA SER UTILIZADO, DEBE CUMPLIR LO SIGUIENTE:",
    "options": [
      "a) Debe contar con un registro previo como usuario que permita garantizar su identidad.",
      "b) Debe contar con un registro previo como usuario que permita garantizar su identidad, y estar previamente autorizado por la Secretaría General de Administración Digital del Ministerio de Política Territorial y Función Pública",
      "c) Debe contar con un registro previo como usuario que permita garantizar su identidad, y estar previamente autorizado por el Parlamento Europeo o la Comisión Europea, dependiendo del tipo de datos de que se trate, de acuerdo con la Directiva 95/46/CE.",
      "d) Debe estar autorizado conjunta y solidariamente por la Secretaría de Estado de Seguridad del Ministerio del Interior y por la Secretaría General de Administración Digital del Ministerio de Política Territorial y Función Pública."
    ],
    "correct": 1
  },
  {
    "question": "14. SISTEMAS DE CERTIFICACIÓN DIGITAL. DIGA CUÁL ES CORRECTA",
    "options": [
      "a) La aceptación de alguno de los sistemas por la Administración General del Estado servirá para acreditar esta identificación electrónica frente a todas las Administraciones Públicas, salvo prueba en contrario.",
      "b) La aceptación de alguno de los sistemas por la Administración General del Estado servirá para acreditar esta identificación electrónica frente a todas las Administraciones Públicas, sin que quepa prueba en contrario.",
      "c) La aceptación de alguno de los sistemas por cualquier Administración servirá para acreditar esta identificación electrónica frente al resto de Administraciones Públicas, salvo prueba en contrario.",
      "d) La aceptación de alguno de los sistemas por una Administración autonómica servirá para acreditar esta identificación electrónica frente a todas las Administraciones Públicas, salvo prueba en contrario."
    ],
    "correct": 0
  },
  {
    "question": "15. ASISTENCIA EN EL USO DE MEDIOS ELECTRÓNICOS A LOS INTERESADOS.",
    "options": [
      "a) Las Administraciones Públicas asistirán en el uso de medios electrónicos a los interesados incluidos en los apartados 2 y 3 del artículo 14 que así lo soliciten, excepto en lo referente a la identificación y firma electrónica.",
      "b) Las Administraciones Públicas asistirán en el uso de medios electrónicos a los interesados incluidos en los apartados 2 y 3 del artículo 14 que así lo soliciten, especialmente en lo referente a la identificación y firma electrónica.",
      "c) Las Administraciones Públicas asistirán en el uso de medios electrónicos a los interesados no incluidos en los apartados 2 y 3 del artículo 14 que así lo soliciten, especialmente en lo referente a la identificación y firma electrónica.",
      "d) Las Administraciones Públicas asistirán en el uso de medios electrónicos a los interesados no incluidos en los apartados 2 y 3 del artículo 14 que así lo soliciten, excepto en lo referente a la identificación y firma electrónica."
    ],
    "correct": 2
  },
  {
    "question": "16. LAS ADMINISTRACIONES PÚBLICAS ESTÁN OBLIGADAS A VERIFICAR LA IDENTIDAD DE LOS INTERESADOS EN EL PROCEDIMIENTO ADMINISTRATIVO, MEDIANTE LA COMPROBACIÓN DE SU NOMBRE Y APELLIDOS O DENOMINACIÓN O RAZÓN SOCIAL, SEGÚN CORRESPONDA, QUE CONSTEN EN:",
    "options": [
      "a) El correspondiente registro administrativo",
      "b) Los archivos electrónicos de la Administración",
      "c) El Documento Nacional de Identidad o documento identificativo equivalente",
      "d) Los documentos presentados por las partes"
    ],
    "correct": 2
  },
  {
    "question": "17. LOS INTERESADOS PODRÁN FIRMAR A TRAVÉS DE CUALQUIER MEDIO QUE PERMITA ACREDITAR:",
    "options": [
      "a) La autenticidad de la expresión de su voluntad y consentimiento.",
      "b) La integridad del documento.",
      "c) La inalterabilidad del documento.",
      "d) Todas son correctas."
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
