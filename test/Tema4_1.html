<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema4_1</title>
    <link rel="stylesheet" href="../src/estilo.css">
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test"><strong>TEMA 4. IGUALDAD EFECTIVA DE MUJERES Y HOMBRES:</strong> LO 3/2007 y DL 1/2023 (Test 1)</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "1. Señala la afirmación cierta según la LO 3/2007, de 22 de marzo:",
    "options": [
      "a) Las mujeres y los hombres son iguales en dignidad humana, e iguales en derechos y deberes. Esta Ley tiene por objeto hacer efectivo el derecho de igualdad de trato y de oportunidades entre mujeres y hombres, en particular mediante la eliminación de la discriminación de la mujer, sea cual fuere su circunstancia o condición, en cualesquiera de los ámbitos de la vida y, singularmente, en las esferas política, civil, económica, social y cultural para, en el desarrollo de los artículos 9.2 y 14 de la Constitución, alcanzar una sociedad más democrática, más justa y más solidaria.",
      "b) Las obligaciones establecidas en esta Ley serán de aplicación a toda persona, física o jurídica, que se encuentre o actúe en territorio español, cualquiera que fuese su nacionalidad, domicilio o residencia.",
      "c) La Ley establece principios de actuación de los Poderes Públicos, regula derechos y deberes de las personas jurídicas, tanto públicas como privadas, y prevé medidas destinadas a eliminar y corregir en los sectores público y privado, toda forma de discriminación por razón de sexo.",
      "d) Todas las afirmaciones anteriores son falsas o incompletas según la LO 3/2007, de 22 de marzo."
    ],
    "correct": 1
  },
  {
    "question": "2. LO 3/2007, de 22 de marzo. La ausencia de toda discriminación, directa o indirecta, por razón de sexo, y, especialmente, las derivadas de la maternidad, la asunción de obligaciones familiares y el estado civil, hace referencia al principio de:",
    "options": [
      "a) Igualdad.",
      "b) Igualdad de trato.",
      "c) Igualdad de sexos.",
      "d) Acciones positivas."
    ],
    "correct": 1
  },
  {
    "question": "3. LO 3/2007, de 22 de marzo. El principio de igualdad de trato y de oportunidades entre mujeres y hombres, aplicable en el ámbito del empleo privado y en el del empleo público, se garantizará en:",
    "options": [
      "a) El acceso al empleo.",
      "b) Condiciones de trabajo.",
      "c) Formación profesional.",
      "d) Todas son correctas, entre otras."
    ],
    "correct": 3
  },
  {
    "question": "4. LO 3/2007, de 22 de marzo. ¿Constituirá discriminación en el acceso al empleo, incluida la formación necesaria, una diferencia de trato basada en una característica relacionada con el sexo cuando, debido a la naturaleza de las actividades profesionales concretas o al contexto en el que se lleven a cabo, dicha característica constituya un requisito profesional esencial y determinante, siempre y cuando el objetivo sea legítimo y el requisito proporcionado?",
    "options": [
      "a) No.",
      "b) Sí.",
      "c) No, salvo en algunos casos.",
      "d) Sí, salvo en algunos casos."
    ],
    "correct": 0
  },
  {
    "question": "5. LO 3/2007, de 22 de marzo. La situación en que se encuentra una persona que sea, haya sido o pudiera ser tratada, en atención a su sexo, de manera menos favorable que otra en situación comparable, se denomina:",
    "options": [
      "a) Discriminación directa por razón de sexo.",
      "b) Discriminación indirecta por razón de sexo.",
      "c) Acoso sexual.",
      "d) Acoso por razón de sexo."
    ],
    "correct": 0
  },
  {
    "question": "6. LO 3/2007, de 22 de marzo. La situación en que una disposición, criterio o práctica aparentemente neutros pone a personas de un sexo en desventaja particular con respecto a personas del otro, salvo que dicha disposición, criterio o práctica puedan justificarse objetivamente en atención a una finalidad legítima y que los medios para alcanzar dicha finalidad sean necesarios y adecuados, se conoce como:",
    "options": [
      "a) Discriminación directa por razón de sexo.",
      "b) Discriminación indirecta por razón de sexo.",
      "c) Acoso sexual.",
      "d) Acoso por razón de sexo."
    ],
    "correct": 1
  },
  {
    "question": "7. LO 3/2007, de 22 de marzo. Cualquier comportamiento, verbal o físico, de naturaleza sexual que tenga el propósito o produzca el efecto de atentar contra la dignidad de una persona, en particular cuando se crea un entorno intimidatorio, degradante u ofensivo, se llama:",
    "options": [
      "a) Discriminación directa por razón de sexo.",
      "b) Discriminación indirecta por razón de sexo.",
      "c) Acoso sexual.",
      "d) Acoso por razón de sexo."
    ],
    "correct": 2
  },
  {
    "question": "8. LO 3/2007, de 22 de marzo. Cualquier comportamiento realizado en función del sexo de una persona, con el propósito o el efecto de atentar contra su dignidad y de crear un entorno intimidatorio, degradante u ofensivo, se llama:",
    "options": [
      "a) Discriminación directa por razón de sexo.",
      "b) Discriminación indirecta por razón de sexo.",
      "c) Acoso sexual.",
      "d) Acoso por razón de sexo."
    ],
    "correct": 3
  },
  {
    "question": "9. LO 3/2007, de 22 de marzo. Se considerará en todo caso discriminatorio:",
    "options": [
      "a) El acoso sexual.",
      "b) El acoso por razón de sexo.",
      "c) Las respuestas a) y b) son correctas.",
      "d) Las respuestas a) y b) son incorrectas."
    ],
    "correct": 2
  },
  {
    "question": "10. LO 3/2007, de 22 de marzo. Todo trato desfavorable a las mujeres relacionado con el embarazo o la maternidad constituye:",
    "options": [
      "a) Discriminación directa por razón de sexo.",
      "b) Discriminación indirecta por razón de sexo.",
      "c) Acoso sexual.",
      "d) Acoso por razón de sexo."
    ],
    "correct": 0
  },
  {
    "question": "11. LO 3/2007, de 22 de marzo. Señala la respuesta falsa:",
    "options": [
      "a) Se considerará discriminación por razón de sexo cualquier trato adverso o efecto negativo que se produzca en una persona como consecuencia de la presentación por su parte de queja, reclamación, denuncia, demanda o recurso, de cualquier tipo, destinados a impedir su discriminación y a exigir el cumplimiento efectivo del principio de igualdad de trato entre mujeres y hombres.",
      "b) Los actos y las cláusulas de los negocios jurídicos que constituyan o causen discriminación por razón de sexo se considerarán nulos y sin efecto, y darán lugar a responsabilidad a través de un sistema de reparaciones o indemnizaciones que sean reales, efectivas y proporcionadas al perjuicio sufrido, así como, en su caso, a través de un sistema eficaz y disuasorio de sanciones que prevenga la realización de conductas discriminatorias.",
      "c) Con el fin de hacer efectivo el derecho constitucional de la igualdad, los Poderes Públicos adoptarán medidas específicas en favor de las mujeres para corregir situaciones patentes de desigualdad de hecho respecto de los hombres. Tales medidas, que serán aplicables en tanto subsistan dichas situaciones, habrán de ser razonables y proporcionadas en relación con el objetivo perseguido en cada caso.",
      "d) Cualquier español podrá recabar de los tribunales la tutela del derecho a la igualdad entre mujeres y hombres, de acuerdo con lo establecido en el artículo 53.2 de la Constitución, incluso tras la terminación de la relación en la que supuestamente se ha producido la discriminación."
    ],
    "correct": 3
  },
  {
    "question": "12. LO 3/2007, de 22 de marzo. Señala la respuesta falsa:",
    "options": [
      "a) La persona acosada será la única legitimada en los litigios sobre acoso sexual y acoso por razón de sexo.",
      "b) De acuerdo con las Leyes procesales, en aquellos procedimientos en los que las alegaciones de la parte actora se fundamenten en actuaciones discriminatorias, por razón de sexo, corresponderá a la persona demandante probar la ausencia de discriminación en las medidas adoptadas y su proporcionalidad.",
      "c) Los proyectos de disposiciones de carácter general y los planes de especial relevancia económica, social, cultural y artística que se sometan a la aprobación del Consejo de Ministros, deberán incorporar un informe sobre su impacto por razón de género.",
      "d) El Gobierno elaborará un informe periódico sobre el conjunto de sus actuaciones en relación con la efectividad del principio de igualdad entre mujeres y hombres. De este informe se dará cuenta a las Cortes Generales."
    ],
    "correct": 1
  },
  {
    "question": "13. LO 3/2007, de 22 de marzo. El principio de igualdad de trato y de oportunidades entre mujeres y hombres es un principio informador de carácter:",
    "options": [
      "a) Universal.",
      "b) Transversal.",
      "c) Político.",
      "d) Social."
    ],
    "correct": 1
  },
  {
    "question": "14. LO 3/2007, de 22 de marzo. Son criterios generales de actuación de los poderes públicos:",
    "options": [
      "a) La participación equilibrada de mujeres y hombres en las candidaturas electorales y en la toma de decisiones.",
      "b) La adopción de las medidas necesarias para la erradicación de la violencia de género, la violencia familiar y todas las formas de acoso sexual y acoso por razón de sexo.",
      "c) La consideración de las singulares dificultades en que se encuentran las mujeres de colectivos de especial vulnerabilidad como son las que pertenecen a minorías, las mujeres migrantes, las niñas, las mujeres con discapacidad, las mujeres mayores, las mujeres viudas y las mujeres víctimas de violencia de género, para las cuales los poderes públicos podrán adoptar, igualmente, medidas de acción positiva.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "15. LO 3/2007, de 22 de marzo. No es un criterio general de actuación de los poderes públicos:",
    "options": [
      "a) La colaboración y coordinación entre las distintas Administraciones públicas en la aplicación del principio de igualdad de trato y de oportunidades.",
      "b) El fomento de instrumentos de colaboración entre las distintas Administraciones públicas y los agentes sociales, las asociaciones de mujeres y otras entidades privadas.",
      "c) El fomento de la efectividad del principio de igualdad entre mujeres y hombres en las relaciones entre particulares.",
      "d) La implantación de un lenguaje no sexista en el ámbito administrativo y su fomento en la totalidad de las relaciones sociales, culturales y artísticas."
    ],
    "correct": 0
  },
  {
    "question": "16. DL 1/2023, de 16 de marzo. El presente Decreto Legislativo será de aplicación a:",
    "options": [
      "a) Todas las Administraciones públicas vascas.",
      "b) Todos los poderes públicos.",
      "c) Todo el estado.",
      "d) Ninguna es correcta."
    ],
    "correct": 0
  },
  {
    "question": "17. DL 1/2023, de 16 de marzo. A efectos del artículo anterior, se considera Administración pública vasca:",
    "options": [
      "a) La Administración de la Comunidad Autónoma, sus organismos autónomos y los entes públicos dependientes o vinculados a aquella.",
      "b) La Administración foral, sus organismos autónomos y los entes públicos dependientes o vinculados a aquella.",
      "c) La Administración local, sus organismos autónomos y los entes públicos dependientes o vinculados a aquella.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "18. DL 1/2023, de 16 de marzo. Los principios generales del artículo 3 a:",
    "options": [
      "a) Todos los poderes públicos vascos.",
      "b) Todas las AAPP vascas.",
      "c) Todo el estado nacional.",
      "d) Ninguna es correcta."
    ],
    "correct": 0
  },
  {
    "question": "19. DL 1/2023, de 16 de marzo. A efectos del DL 1/2023, de 16 de marzo, se considera poder público vasco: (Señala la respuesta incorrecta)",
    "options": [
      "a) Todas las administraciones públicas vascas con sus respectivas administraciones institucionales y demás entes instrumentales independientes o adscritos a ellas.",
      "b) Entes de naturaleza pública dotados de personalidad jurídica independiente y sin régimen de adscripción que integren el sector público vasco y otros entes cuya norma de creación así lo determine expresamente.",
      "c) Parlamento Vasco.",
      "d) UPV."
    ],
    "correct": 0
  },
  {
    "question": "20. DL 1/2023, de 16 de marzo. Los poderes públicos vascos, en los contratos, subvenciones, convenios u otro tipo de documentos a través de los cuales se formalice la transferencia de fondos públicos con entidades privadas, ¿incorporarán cláusulas para la igualdad?",
    "options": [
      "a) Sí, y su incumplimiento dará lugar a la imposición de penalidades, a la resolución de los correspondientes contratos o convenios o a la minoración o devolución de las cantidades percibidas.",
      "b) Sí, pero su incumplimiento, no podrá dar lugar a la imposición de penalidades, ni a la resolución de los correspondientes contratos o convenios ni a la minoración o devolución de las cantidades percibidas.",
      "c) Sí, y su incumplimiento podrá dar lugar a la imposición de penalidades, a la resolución de los correspondientes contratos o convenios o a la minoración o devolución de las cantidades percibidas.",
      "d) No."
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.rectanguloResumen.classList.remove('hidden');

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
